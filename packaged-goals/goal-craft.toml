id = "goal-craft"
tier = "high"
summary = "governs: goal content quality; six tactics: anchor test (sparseness), positive framing, orthogonality, goals-are-prompts (5 rules), synthesis-over-enumeration, user-said-only; WHAT/WHY schema (no DECISIONS/HOW/SCOPE) | triggers: writing/editing any goal; candidate violation during interview/alignment; enumeration vs prose; negative framing detection"
description = """
## WHAT
Operational rules for writing the content of a goal so it works as
both a standing intent file and as the prompt tend and goal sessions read.

A goal is two synthesized sections — **WHAT** and **WHY** — written
as integrated prose, not an enumerated list of decisions. There is no
DECISIONS section, no HOW section, and no SCOPE section: user-vetted
intent is woven into WHAT and WHY, and provenance lives in
`.tinker/notes/notes.md`, not in the goal. These rules apply to every
goal file and are consumed by tend during interviews, edits, and
cross-goal alignment.

Six tactics govern the content:

1. **Sparseness** (the anchor test). A claim belongs in a goal only
   if something outside the implementation anchors it: (a) user intent
   or preference, (b) an external dependency — facts about the world
   outside the codebase, like existing systems, vendor contracts,
   regulation, hardware — or (c) a constraint where no positive
   reformulation captures the same boundary. A claim that is pure
   implementation opinion has no anchor and doesn't belong.

2. **Positive framing.** WHAT not whatn't. Write the positive form
   wherever one exists and place it adjacent to the claim it qualifies.
   Keep a negative only when no positive form captures the same
   constraint — that is anchor (c) from the sparseness test.

3. **Orthogonality of content.** Goals are free-standing. Cross-
   cutting concerns are carried by the link mechanism (`parent_id`,
   `children`, `related`), not duplicated inside each goal's body.

4. **Goals are prompts.** Every goal does double duty as the prompt
   tend and goal sessions read. Five rules follow: (i) define terms
   before first use; (ii) use the same word for the same thing
   throughout the file and across sibling goals; (iii) reference
   other goals by id (`creative-process`, not "the dialectical-loop
   goal"); (iv) a concrete example earns its keep only when it
   anchors an abstract claim — decorative examples add density;
   (v) lead with the load-bearing point, supporting context after.

5. **Synthesis over enumeration.** User-vetted intent is integrated
   into WHAT/WHY prose, never accumulated as a list of decisions.
   Synthesis forces integration — contradictions surface where a list
   would hide them, and the goal reads as design rather than changelog.

6. **Synthesis adds form only.** Every claim in the goal traces to
   something the user stated during the interview. The synthesis
   integrates form; it does not add content. Close to the user's
   language; gap-filling no.

These rules are enforced read-time, not by a mechanical write step.
Tend cites this goal when it surfaces a candidate violation during an
interview or cross-goal alignment — a claim without a clear anchor, a
negative with a positive reformulation, content that belongs in a
related-link, a decision-list creeping back in. Drift is handled the
same way: when tend edits a goal and notices an anchor has dissolved,
it surfaces and proposes rewriting or retiring the claim.

## WHY
These tactics serve the iteration loop in `creative-process`. Sparse,
synthesized goals carry only user-vetted intent — applying
`the-false-promise`'s antidote recursively at the goal layer. Sessions
retain implementation autonomy because goals stay high-level; the loop
stays fast because the user isn't over-specifying; goal agents push
back rarely because the target is tractable. Sparseness and synthesis
are the load-bearing pair: the outcome they serve is the loop
converging well.

"""
parent_id = "creative-process"

