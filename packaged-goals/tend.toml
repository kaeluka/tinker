id = "goal-structure-standard"
reason = "Structural twin applied at write time: level-of-detail coherence, [[children]] id+reason, symmetric related-links, the `kind` field, and the natural-language `summary` form. Tend dispatches to it before writing (draft review) and after writing (edge re-validation), ensuring structural checks run in a fresh session free of drafting context."

