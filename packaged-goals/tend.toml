reason = "Structural twin of goal-craft, applied at write time: level-of-detail coherence, [[children]] id+reason requirement, symmetric related-links, and the `summary` field format. Tend reads this fresh before every write alongside goal-craft and goal-complementarity, and authors the summary by deferring to its spec."

