reason = "The content standard for feature goals. Its anchor test is the interview's termination bar — the interview ends when every claim the user has stated is anchored — and tend dispatches the draft to it for independent review before writing. Tend's WHY-directed questioning is the mechanism that gets the user there."

[[related]]
