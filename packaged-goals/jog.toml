id = "jog"
tier = "high"
summary = "governs: layer-agnostic bidirectional discrepancy finder; forward check (N→N+1 coverage: bugs) and backward check (N+1→N provenance: points of interest); reading delegated to peer agents (@tend for spec, @rummage for code, user for intent); read-only consultation framing; per-run discrepancy log in .tinker/discrepancies/; triggered by rummage unconditionally post-dispatch or by user on request; done report returned to rummage | triggers: jog behavior; layer inference; read-only query framing; forward/backward check discipline; discrepancy log output; post-dispatch verification"
description = """
## WHAT

Jog is a bidirectional discrepancy finder. Given two redundant sources
of information (where one is created from the other), jog builds a set
of items from each and compares them.

Jog reads each source by dispatching read-only @-messages to whichever
agent owns it (@tend for the spec, @rummage for the code) — or by asking
the user when intent is a source — then compares the two sets step by
step and reports every item present in one but not the other to whoever
asked for jog's help.

**Output.** Each run produces a new file under `.tinker/discrepancies/`
documenting the findings, separated into forward and backward checks.
Rummage triggers jog unconditionally after every dispatch as the
post-dispatch verification step — the primary invocation path — and
this discrepancy document is the authoritative done report, returned to
rummage via `@rummage` so rummage can resolve findings. Jog is also
available on request from the user at any time; when triggered directly,
it presents findings in conversation.

## WHY

Drift between spec and code is a fact of life. Jog needs to catch that.
Also, drift between intent and spec. As the post-dispatch verification
step, jog is the entity that produces the done report — meaning the
claim "this work is done" comes from the skeptic, not the producer. The
user can trust the done report without re-reading code.

"""
