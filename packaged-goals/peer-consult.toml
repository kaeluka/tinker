id = "peer-consult"
kind = "feature"
summary = "This goal owns the @-block agent-to-agent messaging channel: the detection of <@agent-or-goal-id>…</@agent-or-goal-id> envelopes in a finalised reply, tag-boundary scoping, fire-and-forget routing to the named agent's input channel, and the system message that surfaces each exchange to the user."
description = """
## WHAT
Any agent in the session registry can send a one-way message to any
other by placing a tag envelope in its output:

    <@agent-or-goal-id>
    message body — may span multiple lines
    </@agent-or-goal-id>

The message body is everything between the opening and closing tags.
The envelope content is delivered to the named agent, framed with a sender
attribution and a reply prompt; **prose outside the tags is not included**,
so each envelope must be self-contained. A message to an unrecognised ID
is dropped silently.

The system detects these envelopes after each reply finalises, routes
each to the named agent's input channel, and pushes a system message so
the user can see the exchange.

A reply may contain multiple envelopes; each is routed independently.
Messaging is fire-and-forget: the sender does not block or await a
return value. Replies come naturally but are not required. The sending
agent retains full autonomy over any response it receives: apply it,
ask a follow-up, or discard it. Consultations can nest freely.

The user can ask any agent to consult another; they are not required
to broker the exchange themselves.

## WHY
When an agent's reasoning depends on what another agent knows — code
reality, goal intent, investigation findings — the `@` channel lets
them exchange directly without the user acting as message router.
The protocol is uniform across the whole agent population: the same
syntax that lets tend consult rummage also lets a goal agent report
back to tend or ask jog a question. No agent is structurally excluded.

Tag-boundary scoping is load-bearing: the envelope makes the routing
signal unambiguous regardless of where it appears in the output, so
only an explicit envelope triggers dispatch.

The self-contained-block rule is the complement: a receiving agent has
no access to the sender's surrounding prose — it only sees the envelope
content. Without the rule agents would silently rely on context they
never actually delivered, producing incomplete or misleading consultations.

"""
