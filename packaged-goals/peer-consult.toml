id = "peer-consult"
kind = "feature"
summary = "This goal owns the @-block agent-to-agent messaging channel: the detection of @<agent-or-goal-id> blocks in a finalised reply, the multi-line body span and self-contained-block scoping, fire-and-forget routing to the named agent's input channel, and the system message that surfaces each exchange to the user."
description = """
## WHAT
Any agent in the session registry can send a one-way message to any
other using `@<agent-or-goal-id>` in its output. The message body
spans from that line through the end of the reply — or up to the next
`@`-line if the reply contains several. **Only the `@`-block itself is
delivered to the named agent**; any prose the sending agent wrote
before or after it is not included, so each `@`-block must be
self-contained.

The message text may begin inline on the `@`-line or on the line below. The system
detects these blocks after each reply
finalises, routes each to the named agent's input channel, and pushes
a system message so the user can see the exchange.

Messaging is fire-and-forget: the sender does not block or await a
return value. Replies come naturally but are not required. The sending
agent retains full autonomy over any response it receives: apply it,
ask a follow-up, or discard it. Consultations can nest freely: an agent
mid-reply can `@`-address a third agent.

The user can ask any agent to consult another; they are not required
to broker the exchange themselves.

## WHY
When an agent's reasoning depends on what another agent knows — code
reality, goal intent, investigation findings — the `@` channel lets
them exchange directly without the user acting as message router.
The protocol is uniform across the whole agent population: the same
syntax that lets tend consult rummage also lets a goal agent report
back to tend or ask jog a question. No agent is structurally excluded.

Multi-line delivery is load-bearing: a finding that can only be
expressed in a single line is rarely a finding.

The self-contained-block rule is the complement: a receiving agent has
no access to the sender's surrounding prose — it only sees the block.
Without the rule agents would silently rely on context they never
actually delivered, producing incomplete or misleading consultations.

"""
parent_id = ""

