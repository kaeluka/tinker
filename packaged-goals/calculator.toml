id = "calculator"
kind = "feature"
summary = "This goal owns the symbolic-math calculator web app as a whole — a browser tool for exact symbolic computation with named values, user-defined functions, and interactive plotting — held as a learning-by-doing hobby project whose scope serves the builder's learning across the full stack, grown one deliberate corner at a time."
description = """
## WHAT
A symbolic-math calculator in the browser. A person types a mathematical
expression and gets back an exact answer — fractions, roots, and algebraic
forms kept intact rather than rounded to decimals. They can give names to
values, define their own functions, build new expressions on those, and
watch a function come alive as an interactive plot.

These capabilities are the means, not a contract — each earns its place by
what it teaches.

## WHY
This is a hobby project. Its worth is in the building and the learning, not
in serving an audience or surpassing the tools that already exist. Two
learnings are the point: the whole technical stack end to end, with no
corner privileged over the others, and tinker's goal-driven way of working,
experienced first-hand by growing this product through it. Because the
learning is the aim, scope serves the builder — a capability stays while it
teaches and steps aside when it would only be busywork. But difficulty is
not busywork: a hard problem is taken on, and finished only as far as it
needs to be, not to perfection. The product grows one deliberate, visible
corner at a time.
"""
