id = "goal-structure-standard"
kind = "behavior"
summary = "This goal runs whenever tend creates or edits a goal: it holds the tree's structural rules — the five operations (merge/nest-down/nest-up/new-root/retire), level-of-detail coherence, parent-summary re-check, id+reason on every [[children]] and [[related]] link, related-link symmetry with the packaged↔local and ancestor-standard exceptions, the `kind` field, and the natural-language summary form — and re-validates them on every write."
description = """
## WHAT
A set of structural rules tend uses to organize goals
hierarchically instead of defaulting to flat lists.

Five operations shape the tree as intent evolves. **Merge** (modify
an existing goal — logically identical to merging new intent into
it). **Nest Down** (create a child) when the new intent would break
an existing goal's level-of-detail coherence. **Nest Up** (create a
new parent that existing goals are reparented under) when the new
intent is a broader justification or conceptual umbrella. **New
Root** (a sibling) when it's genuinely independent. **Retire** (delete
an existing goal) when a reframe has made it obsolete — subsumed,
contradicted, or no longer the right question; tend proposes the
retirement and the user confirms it, never unilaterally. For the four
integration operations, the governing heuristic is **level-of-detail
coherence**: if adding intent to a goal makes one section vastly
deeper or more technical than the rest, it breaks the zoom level and
must be extracted into a child.

Two TOML link primitives are kept distinct:
- `parent_id` / `[[children]]` capture **containment /
  specialization** (B is a sub-aspect of A). Like `[[related]]`
  entries, each `[[children]]` entry carries `id` and `reason`; the
  reason answers "why is this goal a sub-aspect of its parent?" and
  serves as the navigation index for an agent deciding whether to
  pull the child's full text. Parent goals must **summarize their
  children** well enough to support drill-down filtering during
  cross-goal alignment — alignment starts at parents and drills down
  only when warranted, instead of scanning every goal flat. If a
  parent can't meaningfully summarize its children, the structure is
  wrong: the children don't belong together, or the parent is
  misnamed. When nesting a new child, a reason is required.
- `[[related]]` captures **interaction** (B's behavior depends on or
  affects A's), as reasoned cross-cutting links. Related-links are
  **symmetric** — both goals must list each other — but the reason
  text on each side may differ, because the relationship reads
  differently from each end. Symmetry is enforced; **transitivity is
  not** (`a↔b` and `b↔c` does not imply `a↔c`; auto-transitivity
  would explode the graph back into flat scanning). Any goal can
  carry related-links, not just roots, because cross-cutting concerns
  don't respect tree level. Each reason states this goal's own
  interaction with the named neighbor — never a relationship between
  that neighbor and a third goal.

Every goal declares a **`kind`**: either `feature` — a standing,
untriggered claim, usually a region of the artifact (code) it owns but
equally a foundational rationale that simply holds, described by
`feature-craft`'s WHAT/WHY — or `behavior` — it is triggered and runs
at certain points, described by `behavior-craft`'s good prompt
engineering. The dividing question is whether the goal runs at a
trigger (behavior) or stands as an untriggered claim (feature). Tend
classifies the kind during the interview; the user never hand-labels it.

Every goal also carries a **`summary`** field: a single
natural-language sentence that is the navigation index for the goal as
a whole — the way a link reason is the navigation index for an edge —
so it tracks the goal's current scope. Its phrasing follows the kind:
a feature goal states what it owns (*"This goal owns…"*), a behavior
goal states its trigger (*"This goal runs when… / checks that… /
ensures…"*). For a behavior goal the trigger sentence does double
duty — it is both the run-condition tend reads to fire the goal and
the navigation hint an agent reads to find it.

The **write protocol** re-validates both coherence rules on every
edit: it rewrites the edited goal's own `summary`, re-checks the
parent summary whenever a child is created or edited, and
re-validates related-links on both sides. When an edit
needs to touch a partner goal (to add, remove, or rephrase a
back-pointing link), that partner edit happens in the **same write
turn** and appears as one bundle in the single placement sentence tend
states before writing, so the user
can redirect the whole change together rather than through
cascading multi-turn interviews.

**Symmetry and its two exceptions.** Same-scope related-links are
always symmetric — packaged↔packaged and project-local↔local pairs
both list each other. Asymmetric (one-way) links arise only here:
(1) a project-local goal links to a packaged one, since a packaged
goal cannot name a goal that exists in only one project; (2) a
broadly-referenced *ancestor standard* (e.g. `coding-standards`) is
linked by its many dependents but carries no back-links, to avoid
fan-in. A "produces code → coding-standards" link belongs only on a
goal that actually authors a source module.

Content quality is governed by the two standards split on `kind`:
`feature-craft` for feature goals (the WHAT/WHY schema and its
tactics) and `behavior-craft` for behavior goals (good prompt
engineering). These structural rules apply to both kinds; the content
twin is whichever the goal's kind selects.

## WHY
Defaulting to new, flat files for every request creates "cognitive
debt" that's hard to read, maintain, and apply. A structured, coherent tree of intent
makes the system's goals legible across levels of abstraction; this is
a collaborative guideline for defining value, not a mechanical forcing
rule.

The parent-summary and related-link rules extend that logic. Goals
are read on every tend turn and every fresh goal-session start but
written rarely, so paying coherence-maintenance cost at write time
keeps the common read path cheap and correct — including the per-link
reasons that let agents navigate from the compact index instead of
pulling full text.

"""
