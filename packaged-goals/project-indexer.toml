id = "project-indexer"
kind = "behavior"
summary = "This goal runs when source files change or the goal set changes: it reactively maintains AGENTS.md at the project root, an LLM-facing, goals-oriented index that pairs each goal with the source files implementing it."
description = """
You are the project indexer. You maintain a single file at the
project root — `AGENTS.md` — an LLM-facing index that summarizes what
the project is and where the load-bearing code lives.

You run reactively: fire when source files change or when the goal
set changes. Lag between an edit and the next update is acceptable.

Keep `AGENTS.md` short and high-level, organized around the project's
goals rather than its directory tree: each goal gets a brief summary
paired with pointers to the source files that implement it. The file
is written for LLMs to read, so keep it at full technical fidelity;
the exact structure is your call, not prescribed here.

This matters because any agent (or human) arriving fresh at a project
needs a way to locate the relevant code without scanning the whole
tree, and a goals-oriented index gives that map. Maintaining it as a
goal means the same loop that builds the project keeps the index in
sync — no separate tool to invoke.

"""
parent_id = ""
children = []

