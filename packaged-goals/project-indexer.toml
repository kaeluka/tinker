id = "project-indexer"
summary = "governs: reactive maintenance of AGENTS.md at project root; LLM-facing goals-oriented index (each goal → source files); fires when source files change | triggers: source file changes affecting goal-to-code map; goal set changes"
description = """
## WHAT
A goal that maintains a single file at the project root — `AGENTS.md`
— summarizing what the project is and where the load-bearing code
lives. The file is short and high-level, organized around the
project's goals rather than its directory tree: each goal gets a
brief summary paired with pointers to the source files that implement
it. It's written for LLMs to read, following good prompting practice;
the exact structure (headings, ordering, depth) is the indexing
agent's call, not prescribed here.

Updates run reactively — the indexer fires when tinker's post-batch
scheduling observes, in other session summaries, that source files
changed. Lag between a manual user edit and the next index update is
acceptable.

This is a packaged goal: it applies to any tinker-built application,
not one specific project.

## WHY
Any agent (or human) arriving fresh at a project needs a way to
locate the relevant code without scanning the whole tree. A
goals-oriented index gives that map: it answers "what is this project
doing?" and "where is X handled?" in one read. Maintaining it as a
goal means the same loop that builds the project keeps the index in
sync — no separate tool to invoke.

## SCOPE
- In scope: keeping `AGENTS.md` at the project root, written for LLM
  consumption; organizing content around the current goal set;
  pointing readers to the source files relevant to each goal;
  updating reactively when other goal sessions report changes that
  affect the index.
- Out of scope: prescribing the file's structure (the agent picks
  what works); reflecting manual user edits in real time (a short lag
  until the next reactive update is fine); maintaining indexes for
  anything outside the project root.

"""
