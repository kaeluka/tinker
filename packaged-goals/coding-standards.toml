id = "coding-standards"
summary = "governs: standing coding standards; five sections: capability-based DI (effects as traits at composition root); ladder of polymorphism (simplest rung); tests-as-guardrails (test_spec_/test_security_ marking); security.md threat model; tinkerability (observable internals + tinker-test-case: markers) | triggers: any source code write; spec-test coverage audit; security review; marker convention"
description = """
Apply these coding standards to any code in this project.

## When this goal fires

This is a standing constraint, not a feature that progresses toward
completion. It should fire whenever the batch produced changes to
source code — any write, edit, or new file outside `.tinker/`,
`target/`, `node_modules/`, and documentation paths. If the batch
contained no source-code changes, there's nothing to verify; reply
`no`. If the goal already ran in this batch and nothing further
changed since, also `no` — one run per batch is enough.

## What this goal session does when it runs

Two checks against the recent batch:

1. **Style conformance.** Read each modified source file and verify
   it conforms to sections 1–5 below. Fix violations, or surface
   them as a system message if the fix would require non-trivial
   refactoring.

2. **Spec-test coverage audit**, run in both directions. Goals no
   longer enumerate decisions in a `## DECISIONS` section —
   load-bearing commitments are woven into each goal's WHAT/WHY
   prose — so this is read-and-judge, not a mechanical list-walk.
   - *Forward (claims → tests):* read each goal's WHAT/WHY,
     identify its load-bearing behavioral commitments (the things a
     session implemented that a test could pin), and check at least
     one `fn test_spec_*` covers each. Grep `fn test_spec_` across
     the codebase; cross-reference against `.tinker/goals/*.toml` and
     `packaged-goals/*.toml`. A commitment with no covering test is a
     coverage gap.
   - *Reverse (tests → claims):* for each `fn test_spec_*`, confirm
     it still traces to a live commitment in some current goal. A
     test asserting behavior or wording no goal still calls for is a
     stale guardrail — flag it (it may be enforcing a removed
     mechanism, the way a renamed test can keep passing against dead
     behavior).
   Write missing tests where you can; surface a coverage gap or a
   stale test as a system message when fixing it needs a non-trivial
   structural change first.

If both checks pass with no gaps, stop and say so briefly.

## 1. Capability-based dependency injection

Effects (subprocess execution, filesystem, console, network, clock, etc.) are
declared as capability interfaces, never invoked directly by business logic.
Real implementations exist only at the binary's composition root. Tests inject
mocks. Business modules accept their capabilities as constructor arguments or
generic parameters and remain pure with respect to IO.

In the OCaml prior art for this project, capabilities were module signatures
consumed by functors. In Rust, the equivalent is trait objects (Arc<dyn Cap>)
or generic params bounded on traits. In any language, the rule is the same:
production-only IO at the edges, capabilities in the middle.

## 2. Ladder of polymorphism — pick the lowest rung that works

Choose the simplest mechanism that handles the case. Climb only when forced.

  Rung 0: NO polymorphism.
    A concrete function or value. Default. Use whenever the set of cases is
    truly fixed and not worth naming.

  Rung 1: Tagged unions with enum variants (closed world).
    Enums (Rust), sum types (OCaml), discriminated unions. The full set of
    cases is known and exhaustive matching is mechanically checked. Strongly
    preferred for finite domains.

  Rung 2: Tagged unions with string variants or similar (open world).
    String tags, integer codes, name-based dispatch. Cases can be added
    without touching the type, at the cost of losing exhaustiveness checks.
    Used when the set is genuinely open (e.g. user-defined plugins) or
    must be loaded from data files.

  Rung 3: Interface- or subtype-based polymorphism.
    Traits with dyn dispatch, OOP interfaces, virtual methods. Open world,
    structurally extensible, but heavy: implicit dispatch, hidden coupling,
    harder to reason about. Reach for it only when capability injection
    (which is itself rung 3) demands it, or when truly unbounded extension
    by external code is required.

Rationale: lower rungs are easier to read, to test, and to refactor. Higher
rungs win flexibility at the cost of locality. Premature climbing produces
abstractions that hide more than they reveal.

## 3. Tests as guardrails

In this regime the AI writes the code and humans rarely read it. Tests are
therefore not documentation for future humans — they are the guardrail that
constrains the AI toward spec-compliant and secure output, and the surface a
human reviewer actually reads.

The AI writes the tests, derived from the goal description (for spec) and
from security.md (for security). Because the AI is effectively marking its
own homework, the marking must be legible to a reviewer:

  - Tests that trace to a goal-description requirement MUST be marked
    spec-level (test name prefix or comment, e.g. test_spec_... or # spec:).
  - Tests that trace to a threat in security.md MUST be marked security
    (e.g. test_security_... or # security:).
  - Other tests (internal correctness, regression, sanity) stay unmarked
    and are the AI's discretion.

A reviewer reading a test file should be able to tell at a glance which
assertions are load-bearing for the spec, which for security, and which are
scaffolding.

## 4. Security (security.md)

Security threats are too project-specific for this standard to enumerate.
Every project has a security.md at the repo root with two parts:

  - A security context paragraph — what is trusted, what isn't, who can
    interact with what. The hardest part to write and the most useful.
  - A list of threats, each followed by the mitigation strategies
    appropriate for that threat in this context. There is no fixed
    strategy taxonomy. Testable strategies get a `→ test:` pointer back
    to the security-marked test that enforces them.

If security.md is absent or its threat model is unclear, the AI must
propose or update it before writing security-sensitive code.

## 5. Tinkerability

Code is tinkered with as well as built. Tinkering — interactive
investigation, fuzzing, instrumentation, running a function against
ad-hoc inputs — is how the system stays understood. These rules
optimize for that without sacrificing encapsulation.

  - Observable internals. Important decisions and intermediate
    values should be inspectable without modifying source — a debug
    flag, a structured log, or a return shape that lets a probe see
    what happened.

  - Investigation code carries a marker. Any code added to
    investigate behavior — an in-file test, an instrumentation
    print, a temporarily-exposed `pub`, a hacked constant, a
    standalone scratch binary — carries a comment of the form
    `tinker-test-case: <one-line reason>`. The trailing colon is
    load-bearing: it's the grep target the cleanup hook uses, and
    it keeps prose references to the marker name from self-matching.
    The marker may be inline (the test/region is what's temporary)
    or file-level (the whole file is what's temporary; place the
    marker in the file's first comment). Tinker's cleanup hook
    removes these before the next goal session runs. Tests in the
    regular suite (`test_spec_*`, `test_security_*`, or unmarked
    guardrail tests) never carry the marker.
"""
