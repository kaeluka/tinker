id = "feature-craft"
kind = "behavior"
tier = "high"
summary = "This goal runs when tend writes or edits a feature goal (a standing, untriggered goal — one that owns a region of the artifact, or a foundational rationale), and holds the content standard for those goals: the WHAT/WHY schema and six tactics — anchor test, positive framing, orthogonality, goals-are-prompts, synthesis over enumeration, synthesis-adds-form-only — plus brevity."
description = """
## WHAT
The content standard for **feature** goals — standing, untriggered
goals: usually one that owns a region of the artifact (code), but a
foundational rationale that simply holds true (rather than running at
a trigger) is a feature too. A feature goal is two synthesized
sections, **WHAT** and **WHY**, written as integrated prose rather
than an enumerated list of decisions. There is no DECISIONS, HOW, or SCOPE section:
user-vetted intent is woven into WHAT and WHY, and provenance lives in
`.tinker/notes/notes.md`, not in the goal.

Six tactics govern the content:

1. **Sparseness** (the anchor test). A claim belongs only if something
   outside the implementation anchors it: (a) user intent or
   preference, (b) an external dependency — facts about the world
   outside the codebase — or (c) a constraint where no positive
   reformulation captures the same boundary. A claim that is pure
   implementation opinion has no anchor and doesn't belong.

2. **Positive framing.** WHAT, not whatn't. Write the positive form
   wherever one exists, adjacent to the claim it qualifies. Keep a
   negative only when no positive form captures the same constraint —
   anchor (c) of the sparseness test.

3. **Orthogonality of content.** Feature goals are free-standing.
   Cross-cutting concerns are carried by the link mechanism
   (`parent_id`, `children`, `related`), not duplicated inside each
   goal's body. The edge carries the rule.

4. **Goals are prompts.** A feature goal does double duty as the
   prompt a session reads when it builds the feature. Five rules
   follow: (i) define terms before first use; (ii) use the same word
   for the same thing throughout the file and across sibling goals;
   (iii) reference other goals by id (`creative-process`, not "the
   dialectical-loop goal"); (iv) a concrete example earns its keep
   only when it anchors an abstract claim; (v) lead with the
   load-bearing point, supporting context after.

5. **Synthesis over enumeration.** User-vetted intent is integrated
   into WHAT/WHY prose, never accumulated as a list of decisions.
   Synthesis forces integration — contradictions surface where a list
   would hide them, and the goal reads as design rather than changelog.

6. **Synthesis adds form only.** Every claim traces to something the
   user stated; synthesis integrates form, never adds content or fills
   gaps.

Brevity compounds sparseness — prefer the shortest phrasing that
carries the intent; a shorter goal is a better prompt and a cheaper
read.

## WHY
These tactics serve the iteration loop in `creative-process`. Sparse,
synthesized feature goals carry only user-vetted intent — applying
`the-false-promise`'s antidote recursively at the goal layer — which
keeps autonomy with the session, the loop fast, and agent pushback
rare. A feature goal states what to build and why; the session owns
the how. Behavior goals are a different artifact with a different
prompt-shape, governed by `behavior-craft`.

"""
parent_id = "creative-process"

