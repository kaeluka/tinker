id = "readme-maintainer"
summary = "governs: reactive maintenance of README.md at project root; synthesizes goal tree into human-facing narrative (zero prior knowledge assumed); simple+precise prose style; required sections: status framing, installation, agent collaboration, actor-model architecture | triggers: goal tree changes affecting project narrative; README needing update"
description = """
## WHAT
A packaged goal that reactively maintains the human-facing
`README.md` at the project root by reading the project's current goal
tree. It synthesizes whatever foundational "why" and "what" the goals
contain into a cohesive narrative for a new developer — it does not
invent features or philosophy, it articulates exactly what the goals
hold.

The prose is simple, clear, and precise (think Vonnegut, Hemingway,
Erich Kästner): no ten-dollar words where simple ones suffice, but
precision always comes first. The README opens assuming zero prior
knowledge — using even less in-group shared language than tinker
itself does — because the top is a landing point that must pick up a
first-time reader exactly where they are. As the human-facing
counterpart to `project-indexer`, it defaults to conceptual
descriptions and avoids raw code identifiers except where they're
needed for setup.

## WHY
AI-built projects evolve rapidly and manual documentation rots. Every
project needs a human-facing entry point explaining its intent and
architecture. Making this a packaged goal means every tinker-built
project automatically gets a self-updating README derived directly
from its load-bearing intent (the goal files); the README doesn't
drift because it is just a reflection of the tree.

## SCOPE
- In scope: generating `README.md` at the project root; reading the
  goal tree to source the narrative; directing the LLM's prose
  style; tailoring the opening to a reader who knows nothing about
  the project. Required sections, in order:
  - **Status** (top of the README, before anything else): tinker is
    an early-stage experimental coding assistant. Bugs are expected.
    Features are in heavy flux. This is a design study and work is
    actively ongoing. This framing is fixed — it does not vary with
    the goal tree.
  - **Installation**: build from source with `cargo build --release`;
    add the release binary to PATH; symlink packaged goals into
    `~/.tinker` so the ancestor-merge picks them up.
  - **Agents**: how tend, rummage, and jog collaborate; how to switch
    between them; tend as the right starting point for any
    conversation.
  - **Architecture**: every goal is an addressable agent that can
    enforce its own constraints and consult peers — an actor model
    where specification documents converse to resolve conflicts and
    ensure compliance. This is how tinker minimizes cognitive debt:
    the user stays informed about the current feature set without
    ever having to read code.
- Out of scope: documenting internal module structure or low-level
  API details (handled by LLM-targeted artifacts like `AGENTS.md` or
  in-tree docs); hardcoding any specific philosophy beyond the status
  framing above (the agent synthesizes whatever the project's goal
  tree holds).

"""
