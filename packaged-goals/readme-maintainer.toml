id = "readme-maintainer"
summary = "governs: reactive maintenance of README.md at project root; synthesizes goal tree into human-facing narrative (zero prior knowledge assumed); simple+precise prose style; required sections: status framing, installation, agent collaboration, actor-model architecture | triggers: goal tree changes affecting project narrative; README needing update"
description = """
## WHAT
Reactively maintains the `README.md` at the project root, deriving it
from the current goal tree obtained via `@tend`. It synthesizes the
foundational "why" and "what" the goals contain into a cohesive
narrative for a new developer, never supplementing beyond them.

The prose is simple, clear, and precise: no ten-dollar words where
simple ones suffice, but precision always comes first. The README opens assuming zero prior
knowledge — using even less in-group shared language than tinker
itself does — because the top is a landing point that must pick up a
first-time reader exactly where they are. It defaults to conceptual
descriptions, using raw code identifiers only where setup needs them.

The README has four required sections, in order:
- **Status** (top of the README, before anything else): a fixed
  framing — tinker is an early-stage experimental design study in
  heavy flux — that does not vary with the goal tree.
- **Installation**: build from source with `cargo build --release`;
  add the release binary to PATH; symlink packaged goals into
  `~/.tinker` so the ancestor-merge picks them up.
- **Agents**: how tend, rummage, and jog collaborate; how to switch
  between them; tend as the right starting point for any
  conversation.
- **Architecture**: every goal is an addressable agent that can
  enforce its own constraints and consult peers — an actor model
  where specification documents converse to resolve conflicts and
  ensure compliance. This is how tinker minimizes cognitive debt:
  the user stays informed about the current feature set without
  ever having to read code.

## WHY
Manual documentation rots as AI-built projects evolve. Deriving the
README from the goal tree gives every tinker-built project a
self-updating human entry point that cannot drift, because it only
reflects the tree.

"""
