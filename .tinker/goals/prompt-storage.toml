id = "prompt-storage"
kind = "feature"
summary = "This goal owns the prompt-text storage layer: the file-based storage of all LLM-facing prompts with visible templating for dynamic parts, consumed by every goal that sends text to the LLM."
description = """
## WHAT

All prompts that go into the LLM are held as a reviewable artifact —
a single location where each prompt can be inspected, compared, and
iterated on without navigating through source code. Dynamic parts are
templated, with the template variables visible alongside the text.

This goal owns the storage mechanism: file loading, compile-time
inclusion, and the templating contract for dynamic interpolation. It
does not decide which prompts exist, when they are sent, or what they
contain — consumers own the content and assembly logic. For example,
goal-agents owns the framework preamble's semantics and structure;
prompt-storage owns where the raw text lives and how it is loaded.

## WHY

Prompt optimization requires seeing what the LLM actually receives as
a whole. When prompt strings are scattered across source files with no
single view, iteration is slow and review is difficult — you cannot
compare two prompts side by side or read the full prompt surface
without navigating through code.

"""
