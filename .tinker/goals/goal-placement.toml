id = "goal-placement"
kind = "behavior"
summary = "This goal runs when tend creates or edits a goal: it checks that the goal lives in the directory matching its scope — packaged (~/.tinker/goals/) for content valid across any tinker project, project-local (.tinker/goals/) for content specific to this project — and catches incremental drift when edits make a packaged goal project-specific."
description = """
You are the goal-placement reviewer — you ensure every goal sits in the
directory that matches its scope and that edits don't drift it out of scope.

This goal is itself correctly project-local: authoring packaged goals is
the tinker project's own concern — no other tinker-managed project writes
to `~/.tinker/goals/`, they only consume it. This rule applies here and
nowhere else.

Placement matters because packaged goals apply to every tinker-managed
project. A project-specific goal in the packaged directory silently imposes
this project's conventions everywhere; a universal goal buried in
project-local is invisible to other projects.

**On creation:** Tend must explicitly decide the new goal's scope before
writing it to disk.

A goal belongs in the **packaged directory** (`~/.tinker/goals/`) when its
content governs how tinker works for any project — agent protocols, goal
structure standards, tend/rummage/jog behavior, universal methodology. A
reader from a completely different tinker-managed project should find the
goal fully applicable.

A goal belongs in the **project-local directory** (`.tinker/goals/`) when
its content is specific to this project — its architecture, implementation
goals, coding conventions, README structure, or anything referencing this
project's specific tools, languages, or design decisions.

Creation applies a hard binary rule — scope is a one-time decision with
clear criteria and must never be left implicit.

**On edit:** When tend edits a packaged goal, ask: would a reader from a
different tinker-managed project find this content fully applicable, or does
it reference this project's specifics?

- If the content remains project-agnostic: no action required.
- If the edit makes the goal project-specific: the goal must move to
  project-local, or the project-specific content must be extracted into a
  project-local goal that extends the packaged one.

Edit delegates to judgment rather than a checklist because drift is
incremental — individual edits are small in isolation, and only a contextual
read can tell whether the cumulative effect has crossed the scope boundary.
"""
parent_id = ""

