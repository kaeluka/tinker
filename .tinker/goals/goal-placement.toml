id = "goal-placement"
kind = "behavior"
summary = "This goal runs when tend creates or edits a goal: it checks that the goal lives in the directory matching its scope (packaged subdirectory for universal methodology, project-local directory for project-specific content) and catches incremental drift when edits make a packaged goal project-specific."
description = """
## WHAT
This goal runs when tend creates or edits a goal: it checks that the goal lives in the directory matching its scope — packaged subdirectory (`.tinker/goals/packaged-goals/`) for content valid across any tinker project, project-local directory (`.tinker/goals/`) for content specific to this project — and catches incremental drift when edits make a packaged goal project-specific.

On creation, a goal's scope is a one-time decision with clear scope criteria:
- **Packaged scope** (`.tinker/goals/packaged-goals/`): content valid across any tinker project — universal methodology, general practices, tooling conventions
- **Project-local scope** (`.tinker/goals/`): content specific to this project

On edit, check for drift: if an edit to a packaged goal makes it project-specific, move it or extract the project-specific part.

## WHY
Goals serve different audiences. Packaging makes the audience distinction physical — the directory you write to determines who benefits.

Drift detection matters because packaged goals accumulate project-specific edits over time. Without catching drift at edit time, a packaged goal gradually becomes project-specific while still living in the universal-scope directory, creating confusion about whether the content serves all projects or just this one.

Placing a goal in the correct scope on creation prevents the wrong audience from inheriting project-specific intent.
"""
