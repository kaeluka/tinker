id = "intent-to-code"
summary = "governs: intent→spec→code three-layer stack; producer/skeptic axis encoded as tree (forward-generation vs divergence-investigation); adjacency ownership (intent↔spec: tinker+jog; spec↔code: sessions+rummage); human-coupling axis (layer-1=dialectical, layers-2/3=autonomous) | triggers: understanding where agents fit in stack; commissioning across adjacencies; framing new agents"
description = """
## WHAT
The map of tinker's agents onto the path from intent to running code.
The substrate is a three-layer stack: layer 1 is the user's **tacit
intent**, layer 2 the **written goal/spec**, layer 3 the **running
code**. Every agent works one *adjacency* of that stack — intent↔spec
or spec↔code — in one of two directions, which lays the agents out on
a 2×2.

One axis of that 2×2 **is encoded in this tree**: forward generation
versus divergence investigation. `forward-generation` holds the
**producers**, which move forward through the stack and treat the goal
as *authoritative* (`tinker` builds the spec from intent; the goal
sessions build code from the spec). `divergence-investigation` holds
the **skeptics**, which look across an adjacency for a gap and treat
the goal as *signal-with-noise* (`jog` audits intent↔spec; `rummage`
audits spec↔code).

Two further axes **cross-cut but are not encoded in the tree**,
because a node has only one parent:
- **Adjacency ownership.** Each adjacency is owned by one producer and
  one skeptic — intent↔spec by `tinker` + `jog`, spec↔code by the goal
  sessions + `rummage`. This pairing is where commissioning happens: a
  skeptic that finds the produced artifact wanting commissions its
  paired producer to fix it (`jog`→`tinker`, `rummage`→goal session).
- **Human coupling.** The agents that touch layer 1 (tacit intent) —
  `tinker` and `jog` — are dialectical and human-coupled; those that
  live in layers 2–3 — the goal sessions and `rummage` — run
  autonomously. The dividing line is exactly whether the agent touches
  intent.

## WHY
This model was the framing every agent was designed against, yet it
lived in no goal — it was folklore. Naming it gives the producer and
skeptic branches a parent they summarize up into, and turns the two
orthogonal slices (adjacency ownership, human coupling) into explicit
prose rather than tacit knowledge.

The tree encodes the producer/skeptic axis specifically because that is
the axis along which agents share **methodology**: producers move
forward and trust the goal, skeptics look for gaps and doubt it. The
adjacency and coupling slices are equally real but cannot also be
hierarchy, since each agent gets one parent — so they stay as
cross-cutting description here. The human-coupling line is the same one
`creative-process` draws when it makes the human the termination
condition wherever intent is in play.

## SCOPE
- In scope: the three-layer intent→spec→code stack; the producer/
  skeptic axis as the tree grouping (`forward-generation`,
  `divergence-investigation`); the adjacency-ownership and human-
  coupling axes as orthogonal, prose-only slices; the rationale for
  which axis the tree encodes.
- Out of scope: each agent's internal behavior (lives in its own goal);
  the should/is principle itself, of which this stack is the layered
  form (that is `user-system-interaction`); reshaping the principle
  goals (`the-false-promise`, `creative-process`, and the rest) under
  this node — they are principles, not agents.
"""
