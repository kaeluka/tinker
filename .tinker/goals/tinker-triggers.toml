id = "tinker-triggers"
description = """
## WHAT
When tinker wants a goal session to run — a goal it just created or
edited, a downstream goal that should react to a just-finished
batch, or any other reason to act on a goal — it announces the
trigger in its chat output as a line of the form
`/run <goal-id> <reason>`. After the reply finalizes, tinker scans
it for those lines and dispatches a goal session for each, threading
the reason through as the session's "what to do right now" context.
Multiple `/run` lines in one reply each fire a separate session (the
first runs, the rest queue). Anything that isn't a recognized `/run`
line is shown to the user as ordinary chat, so triggers and prose
coexist in the same reply. The same syntax is what the user types at
the input prompt to fire a goal manually.

The reasons tinker emits are **declarative pointers to spec deltas**
— what changed in the goal text, or what changed in the environment
the goal might react to — never imperatives about what to build. The
session reads the updated goal, sees the delta, and derives its work
from the spec itself. An imperative reason ("add modulo support")
would launder implementation intent through the dispatch channel and
bypass the spec process, where that intent legitimately belongs.
User-typed reasons (the TUI Enter modal, `/run` at the prompt) are
exempt as a pragmatic escape hatch.

This is the single channel for goal-session dispatch that doesn't
come from manual user input: the same `/run` mechanism serves both
edited goals and reactive post-batch scheduling. There is no
separate scheduler component.

## WHY
Earlier, goals carried a `change_log` array recording pending work
tinker wanted a session to act on. That had three problems: the name
implied a historic record rather than pending tasks; the field
accumulated cruft across runs; and it coupled spec storage to runtime
triggers. Moving the trigger out of the file and into a chat-line
slash command keeps the spec clean and ties each trigger to a
specific moment with a specific reason. The same move folded the old
separate cheap-model scheduler into tinker — reactive scheduling is
now just tinker emitting more `/run` lines in its post-batch reply,
where it has full batch context.

## SCOPE
- In scope: tinker emitting `/run <goal-id> <reason>` in chat to
  trigger sessions, for both edited goals and reactive post-batch
  scheduling; scanning the finalized assistant message for those
  lines; one session per matching line with the reason threaded
  through; multiple `/run` lines per turn each queuing a session;
  the same `/run` syntax usable by the user at the prompt.
- Out of scope: triggering commands other than `/run`; argument
  syntax beyond goal-id and reason; cross-project triggers.

"""
parent_id = "tinker"
children = []
related = [
  { id = "goal-sessions", reason = "Each `/run` line tinker emits becomes a dispatch into `goal-sessions`'s pending queue, with the parsed reason threaded into the session context. The trigger syntax has no effect without the dispatch mechanism on the other end." }
]
