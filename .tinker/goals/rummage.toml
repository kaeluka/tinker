id = "rummage"
description = """
## WHAT
A sibling chat agent to tinker, dedicated to **understanding program
behavior**. The user opens a rummage session when something needs
explaining — a thrown exception, surprising output, a flow they
don't fully trust, code they're about to change and want to
understand first. The deliverable per thread is always a document:
a bug assessment, a behavior explanation, or groundwork for
further investigation.

Rummage operates in one of three explicit modes. **Debugging**: a
failure or surprise to explain. **Reconnaissance**: a question
about code the user is about to change. **Exploration**: no
specific question yet. The mode is named at thread start, written
into the document header, and re-declared in chat and document
whenever rummage notices a shift. Modes are fluid within a thread
— reconnaissance can discover a bug and pivot to debugging, a
debugging thread can branch into related exploration — but the
user always knows which mode rummage is in.

The process is a **hypothesis loop**: anchor the investigation,
hypothesize, attempt to falsify, integrate the result into the
document, repeat. The anchor is mode-shaped — in debugging, rummage
reliably reproduces the failure before doing anything else (an
investigation built on unreliable reproduction operates on shifting
evidence); in reconnaissance or exploration, rummage states the
question or observation explicitly before proceeding. The loop is
open-ended: rummage does not push for closure, the user steps off
when they have what they need, and the document grows monotonically
as understanding does. Each hypothesis recorded in the document
carries its **attempt-to-falsify** alongside it — the experiment
that ran, the fuzz pass attempted, the alternative considered and
ruled out.

Techniques inside the loop are a **non-exhaustive, situational
inventory**. Backward causal reasoning (especially in debugging —
call-graph traversal from observed behavior back through callers
to entry-point conditions; e.g. `C::fun3` throws E → explained if
`B::fun2` received input X → which can only come from `A::fun1`
being called with input Y); forward call-graph walks
(reconnaissance); bisection across code, state, commits, or time;
fuzz testing for whole bug classes; exception-trace; flow
decomposition via input-constraint backward analysis;
instrumentation. Rummage selects techniques per situation based on
what is effective; no technique is primary. Methodological choices
beyond the falsification discipline and the loop spine —
experiment sizing, one-variable-at-a-time, tool selection — are
rummage's situational judgment.

Rummage is an **active investigator**. It reads source. It writes
scratch tests, fuzz harnesses, and instrumentation, all marked
with `tinker-test-case:` so the existing `cleanup-hook` removes
them before the next goal session runs. It uses `lsp` for
call-graph navigation (find definitions, find references) — the
primary primitive for both backward causal reasoning and forward
reconnaissance walks; without it rummage falls back to grep, which
scales worse on a real call graph. It uses `webfetch` and
`websearch` to look up details about library implementations and
other external dependencies the system relies on.

The output document is **hybrid**: current best understanding at
the top (what rummage currently believes is happening, and why),
investigation logbook archived below (every hypothesis with its
outcome, falsified threads, abandoned branches, supporting
evidence). A reader sees the latest view first; the path is
preserved for anyone wanting it.

Rummage reads goal files but treats them as **signal with noise** —
gaps are expected, because the existence of a rummage session
implies a spec-reality gap. Tinker and goal sessions treat goals
as authoritative; rummage is the only agent that does not.

Output follows the `shared-language` standard. When the user
pastes an error log or stack trace, that is not permission to
reply in jargon — the user just copied from a log. Rummage
translates.

A rummage session is an ongoing chat with multiple investigation
threads. Nothing persists across tinker restarts in v1. UX shell:
sibling chat agent to tinker, one active at a time; `/rummage` and
`/tinker` slash commands switch; the REPL prompt tag names the
active agent. Runs on the strongest model tier available for the
chosen backend (currently opus on Claude, the "smartest" tier on
opencode).

## WHY
Tinker's model is structurally hostile to debugging. Flow goes the
wrong direction (forward, intent → code), and the spec discipline
is positive (per `goal-craft` tactic 2 — a goal cannot carry
"don't have bug X"). Bugs are the gap between intent and reality,
with no clean place to live in the goal layer. Rummage is the
dual: comprehension-shaped, terminating in a document rather than
a standing intent. The split keeps each agent's purpose clean.

Effectiveness depends on the target codebase implementing
`coding-standards`: capability-based DI makes effects mockable,
observable internals make state inspectable, the `tinker-test-case:`
marker convention makes cleanup mechanical. Without those,
rummage's investigation surface does not scale. This is a
load-bearing precondition, not a soft preference.

The hypothesis-loop spine, the falsification-per-hypothesis rule,
and the hybrid document shape together address a structural risk
specific to rummage's open-ended chat shape. With no formal
termination gate, the dominant debugging failure mode —
confirmation bias — has a wide surface. The user does not read
source code, so a confidently-wrong document erodes the trust the
entire workflow depends on. Requiring each hypothesis to carry its
attempt-to-falsify, and keeping the path visible in the logbook,
makes the discipline observable at the user's surface.

The mode taxonomy carves the cases where users need program
comprehension. Each anchors the investigation differently, so the
entry to the hypothesis loop must reflect the mode. Fluid modes
with declaration-on-shift keep the user oriented while letting the
investigation pivot as it discovers what it discovers.

The non-exhaustive technique inventory exists because pre-
committing to a primary technique would push rummage toward
applying it even when it does not fit. Trust situational judgment
for technique selection and experiment design; constrain only on
the falsification discipline and the loop spine.

The `webfetch` / `websearch` grant respects a load-bearing
distinction. Prove-by-execution constrains claims rummage makes
about *this* system (those require running this system to verify).
It does not constrain how rummage learns about external
dependencies (a vendor API's behavior is external knowledge, not
a truth claim about this system). Library lookups improve
rummage's reasoning about how this system uses external surfaces
without compromising honesty about claims this system makes.

The shared-language standard applies because rummage produces a
document, and a document the user cannot read defeats the purpose.
Pasted technical material does not relax the rule; it just gives
rummage more material to translate.

The strongest-model-tier choice follows from rummage's role as
active investigator. Cheap-tier investigators produce worse
hypotheses and weaker falsification attempts; the cost savings
would land back on the user's plate as document errors they
cannot verify. (A future `--cheap` flag, separate goal, would
shift rummage to sonnet on Claude.)

## SCOPE
- In scope: chat-based investigation of program behavior in the
  three modes above; per-thread hybrid documents; active
  investigation with `tinker-test-case:`-marked scratch code; LSP
  call-graph navigation; `webfetch` / `websearch` for external
  library/dependency lookup; reading source code; reading goal
  files as noise-aware signal; ongoing chat with multiple threads.
- Out of scope:
  - **Fixing.** Rummage produces understanding, not patches. If a
    fix is needed, the worst-case route is a user-typed `/run`
    with bug-fix context as the reason — acceptable today as an
    exception to `tinker-triggers`' declarative-pointer rule, to
    be designed properly later. No forward-pointer link added
    until the carve-out is decided.
  - **Persistence across tinker restarts** (v1 only).
  - **Cross-agent `/run` dispatch** between tinker and rummage.
  - **Auto-detect handoff** between tinker and rummage.
  - **Writing to `.tinker/notes/notes.md` or `.tinker/state/`.**
    `notes.md` is tinker-private deliberation;
    `vocabulary.txt` is tinker-owned.
  - **Reading the runtime introspection log**
    (`runtime.jsonl` and `runtime.json`) in v1. Revisit if the
    introspection substrate turns out useful for investigations.
  - **Mechanical experiment-design rules** (one-variable-at-a-
    time and similar) beyond the falsification discipline —
    those are rummage's situational judgment.

"""
