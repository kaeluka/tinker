id = "tend-write-restriction"
kind = "feature"
summary = "This goal owns the rule that tend can write to any file under .tinker/goals/ recursively, with path-equivalence recognition so equivalent filesystem paths produce the same permission outcome."
description = """
## WHAT
This goal owns the rule that tend can write to any file under `.tinker/goals/` recursively, with path-equivalence recognition so equivalent filesystem paths produce the same permission outcome.

Tend can write to any file within the `.tinker/goals/` directory and all its subdirectories. The permission check recognizes equivalent filesystem paths: an absolute path, a relative path with parent-directory references, and a symlink-resolved variant all referring to the same file on disk must produce the same permission outcome. When the check cannot determine equivalence, it preserves prior permission behavior.

## WHY
The `.tinker/goals/` directory is tend's workspace — both packaged goals and project-local goals live there, so tend needs recursive write access.

Packaged goals live in a subdirectory of `.tinker/goals/`, so the write boundary must be recursive for tend to maintain them. Limiting tend to flat `.toml` files would have prevented tend from maintaining packaged goals once they lived in-tree (surfaced by concrete incident: structural audits identified issues in packaged goals that tend couldn't address).

Path-equivalence recognition matters because `backends` enforces the write boundary at the code level, and code sees filesystem paths, not directory intent. Without equivalence recognition, a relative path like `.tinker/goals/foo.toml` and an absolute path to the same file would produce different permission outcomes — the same write would succeed or fail depending on how the path was expressed.
"""
