id = "cost-reduction"
description = """
## WHAT
An ongoing investigative goal that finds cost-cutting opportunities
in how tinker uses LLMs and keeps a persistent record of
observations across sessions. When the goal session runs, it
inspects how tinker is built and run — prompt construction, cache
behaviour, context shipped per turn, model tiering, session
lifecycle, goal-session context injection, conversation-history growth —
looks for waste, and surfaces findings in its structured summary.
Tinker folds significant observations into
`.tinker/notes/cost-observations.md` so subsequent runs have
continuity. Those entries are observation-shaped (what was seen),
not TODO-shaped (what to do) — avoiding the drift that retired the
`change_log` (see `triggers`).

Findings never become new goal files on their own. They surface only
through the session's summary, which tinker folds into the
user-facing batch message; acting on any finding requires a fresh
interview, same as any goal creation. (This is partly enforced
mechanically — goal sessions cannot write to `.tinker/goals/`.)

The measurement substrate's purpose is **attribution**: tying spend
to its cause. The investigation must decompose token usage by prompt
component and attribute the cost to where it originates —
distinguishing the fixed scaffolding that ships every turn regardless
(the persona, the standing instructions) from the parts that grow per
turn (conversation history, the goal list shipped fresh each turn) —
and identifying which component dominates (e.g. which template input
is largest). Raw per-message totals cannot surface that pattern, and
the pattern is exactly what the user needs to judge whether a finding
is worth acting on. The first step is in place: the Claude CLI output
parser in `src/claude.rs` captures the per-message `usage` field
(input/output tokens plus cache reads/creations) that was previously
discarded, and the numbers render in the TUI. The decomposition and
attribution build on that capture.

## WHY
Tinker works well but is expensive to use — the user grounded this in
numbers from the Anthropic usage dashboard, divided by lines of code
shipped. The user wants to know where the spend goes and what's worth
cutting, on an ongoing basis rather than as a one-off audit.

Quality dominates cost as a constraint. Some thinking may be
sacrificed for cost, but not much; the dialectical interview (per
`creative-process`) is protected territory and must not be silently
squeezed.

Persistence across sessions matters because findings accumulate —
one batch may notice the tinker persona is large, a later batch that
the goal list ships fresh every turn, a third that the two interact.
Without continuity each investigation starts from zero. The
observation log is owned and written by tinker; the goal session
reads it at the start of each run for continuity but never writes to
it (consistent with the `.tinker/` write prohibition in
`goal-sessions`).

A Sonnet-tier goal session does the recon rather than tinker itself
because tinker runs on Opus and arbitrates between many overlapping
conventions every turn, so its per-turn cost is high. Pushing recon
onto a cheaper tier is itself a cost-aware move.

## SCOPE
- In scope: standing investigation of how tinker uses LLMs;
  decomposing token spend by prompt component and attributing it to
  fixed scaffolding versus per-turn growth (with the Claude CLI
  `usage` events as the primary data source); identifying and
  surfacing cuts (cache layout, prompt size, session lifecycle, model
  tiering, goal-session context injection, conversation-history growth);
  maintaining the measurement substrate; persisting observations to
  `.tinker/notes/cost-observations.md` (tinker writes, goal sessions
  surface in summaries).
- Out of scope: implementing cuts directly — each cut becomes a
  separate interviewed goal; enforcing a numeric budget or target
  ratio; changes that visibly degrade interview depth, playback
  fidelity, or goal-session quality; the opencode/openrouter backend
  path until it's confirmed that's where the user spends.

"""
