id = "batch-review"
summary = "governs: tend-invoked post-batch compliance review via @rummage; selective (tend decides); rummage checks spec satisfaction (test_spec_* + code vs goal), security (security.md + test_security_*), general scan; findings fed into tend's synthesis | triggers: post-batch rummage invocation; compliance review mode; spec/security check after goal sessions"
description = """
WHAT
After a goal-session batch finishes, tend may consult `@rummage` for
a compliance review before composing the user-facing summary. Tend
decides when the review is warranted — it is not automatic. Rummage's
review covers three areas: spec satisfaction (do the `test_spec_*`
tests and the changed code actually satisfy the goal's spec?),
security coverage (does `security.md` cover the new code, and are
`test_security_*` tests present where needed?), and a general scan.
Rummage reports findings back to tend via the `@` channel; tend
incorporates them into its synthesis before the user sees anything.

WHY
Goal sessions report what they did; they do not verify that what they
did actually satisfies the spec. Rummage, with the goal spec and the
changed code visible, can make that judgment. Routing the compliance
check to rummage keeps quality grounding in the agent whose profile is
built for code-reality assessment — and keeps tend's synthesis
downstream of an independent check rather than relying solely on the
session's self-report.

SCOPE
In scope: tend's selective invocation of `@rummage` for post-batch
review; rummage's compliance review mode covering spec satisfaction,
security, and a general scan; delivery of rummage's findings to tend
via the `@`-consultation channel; tend's incorporation of those
findings into the user-facing summary.
Out of scope: always-on automatic review after every batch; rummage
writing fixes or new tests in this mode (that belongs to the case-2
investigation path in `rummage`); rummage communicating directly to
the user in this mode.
"""
parent_id = "tend"
children = []

