id = "peer-consult"
summary = "governs: @<agent> one-way inter-agent messaging (tend/rummage/jog); multi-line body (next @-line or end of reply terminates); only the @-block is delivered (not surrounding prose); actor model (no call stack, no blocking, no return value); advisory; nesting allowed; goal sessions excluded | triggers: implementing @-message routing; agent-to-agent messaging; peer consultation in spec creation; deciding when to consult; @-block scope and delivery rules"
description = """
## WHAT
Any of the three interactive agents (tend, rummage, jog) can send a
one-way message to another using `@<agent-name>` in its output. The
message body spans from that line through the end of the reply — or
up to the next `@`-line if the reply contains several. **Only the
`@`-block itself is delivered to the named agent**; any prose the
sending agent wrote before or after it is not included. This means
a sending agent must make each `@`-block self-contained: everything
the receiving agent needs to act on must be inside the block.

The `@`-line may carry an inline opening (`@tend Here's the finding:`)
or stand alone (`@tend`) with all content on subsequent lines; both
forms are equivalent. The system detects these blocks after each reply
finalises, routes each to the named agent's input channel, and pushes
a system message so the user can see the exchange.

The model is an actor system, not RPC. No blocking, no formal return
value, no call stack. Replies come naturally — an agent receiving a
message will usually respond — but are not required. The sending agent
retains full autonomy over any response it receives: apply it, ask a
follow-up, or discard it. Either side can continue the exchange as long
as it is useful. Consultations can nest freely: an agent mid-reply can
`@`-address a third agent.

Initiation is symmetric. Tend can consult rummage, rummage can
consult tend, either can consult jog. The user can ask any agent to
consult another — which causes that agent to judge whether and how to
do so — but the user is not required to broker the exchange.

Goal sessions (the autonomous code-writing sessions) are not part of
this protocol. It covers only the three interactive chat agents.

## WHY
Tend currently must read code to write grounded specs. That
duplicates rummage's concern and divides tend's focus between intent
management and code comprehension, making it worse at both. The `@`
protocol cleanly separates the concerns: tend stays focused on intent
and consults rummage when code-reality grounding is needed; rummage
stays focused on code and consults tend when intent context is needed.
Neither must be competent at the other's job.

The alternative was `/tmp` files and manual agent switching — the user
acting as message router. That is coordination overhead the system
should absorb.

Multi-line delivery is load-bearing: a finding that can only be
expressed in a single line is rarely a finding. Restricting to one
line turns the channel into a ping mechanism, which defeats the
purpose.

The self-contained-block rule is the complement: a receiving agent has
no access to the sender's surrounding prose — it only sees the block.
Without the rule agents would silently rely on context they never
actually delivered, producing incomplete or misleading consultations.

## SCOPE
- In scope: `@<agent-name>` blocks with multi-line bodies; block
  termination at the next `@`-line or end of reply; delivery of only
  the block to the named agent; any-to-any messaging among tend,
  rummage, and jog; freely nesting consultations; agent-initiated and
  user-triggered initiation; the user observing the exchange in real
  time.
- Out of scope: goal sessions sending or receiving `@` messages;
  formal return values or blocking semantics; call stack tracking;
  blank-line termination; changes to the `/run` or `/jog-edit`
  channels (governed by `triggers`); TUI rendering details (left to
  `tui`).
"""
