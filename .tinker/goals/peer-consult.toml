id = "peer-consult"
summary = "governs: @<agent> one-way inter-agent messaging (tinker/rummage/jog); actor model (no call stack, no blocking, no return value); advisory; nesting allowed; goal sessions excluded | triggers: implementing @-message routing; agent-to-agent messaging; peer consultation in spec creation; deciding when to consult"
description = """
## WHAT
Any of the three interactive agents (tinker, rummage, jog) can send a
one-way message to another using `@<agent-name> <message>` in its
output. The system detects those lines, delivers the message to the
named agent's context, and the receiving agent processes it as an
incoming message alongside its normal work.

The model is an actor system, not RPC. No blocking, no formal return
value, no call stack. Replies come naturally — an agent receiving a
message will usually respond — but are not required. The sending agent
retains full autonomy over any response it receives: apply it, ask a
follow-up, or discard it. Either side can continue the exchange as long
as it is useful. Consultations can nest freely: an agent mid-reply can
`@`-address a third agent.

Initiation is symmetric. Tinker can consult rummage, rummage can
consult tinker, either can consult jog. The user can ask any agent to
consult another — which causes that agent to judge whether and how to
do so — but the user is not required to broker the exchange.

Goal sessions (the autonomous code-writing sessions) are not part of
this protocol. It covers only the three interactive chat agents.

## WHY
Tinker currently must read code to write grounded specs. That
duplicates rummage's concern and divides tinker's focus between intent
management and code comprehension, making it worse at both. The `@`
protocol cleanly separates the concerns: tinker stays focused on intent
and consults rummage when code-reality grounding is needed; rummage
stays focused on code and consults tinker when intent context is needed.
Neither must be competent at the other's job.

The alternative was `/tmp` files and manual agent switching — the user
acting as message router. That is coordination overhead the system
should absorb.

## SCOPE
- In scope: `@<agent-name> <message>` syntax in any interactive
  agent's output; system detection and routing to the named agent's
  context; any-to-any messaging among tinker, rummage, and jog; freely
  nesting consultations; agent-initiated and user-triggered initiation;
  the user observing the exchange in real time.
- Out of scope: goal sessions sending or receiving `@` messages;
  formal return values or blocking semantics; call stack tracking;
  changes to the `/run` or `/jog-edit` channels (governed by
  `triggers`); TUI rendering details (left to `tui`).
"""
