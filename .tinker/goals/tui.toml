id = "tui"
kind = "feature"
summary = "This goal owns the terminal interface rendering: the two-column layout, goal-list row format including ephemeral sub-sessions accurately nested under their immediate dispatcher at all depths with label-first display when a label is provided and pane-label normalization to the root permanent goal name, per-category visual styling, pane-label animation, the goal-detail header, goal-ID visual consistency, per-session conversation views, active-session switching, the options dialog, queue and trigger-reason display, token-usage cost-driver metrics, and scroll behavior."
description = """
## WHAT
Tinker presents a terminal interface in two columns. The **left
column** carries the live conversation. The **right column** stacks
two bands at fixed proportions: a selectable **goal list** (50%
height) and the full **goal text** of the currently selected goal
beneath it (50%).

In the conversation, an input-prompt tag names the active session
(e.g. `tend> `, `goal-id> `); input routes to that session.
Any session in the registry can be activated with `/<goal-id>` —
this includes tend, rummage, jog, and any goal agent. The active
session receives whatever the user types next. Each agent's messages
carry the goal-id as a label.

The conversation pane is a **per-session view**: each session has its
own history of inputs the user sent to it, the session's responses,
and system notifications. System notifications are global — they
appear in every session's view. User inputs and agent output belong
to the session they were exchanged with. Switching to a different
session with `/<goal-id>` immediately loads that session's full
accumulated conversation into the pane, then streams new output from
that session going forward.

Tend's startup output is not rendered in the conversation pane — the
TUI suppresses it. The model produces output eagerly on startup but
the user sees canned startup text instead. All other sessions start
lazily on first dispatch.

In the goal list, each row opens with a status prefix followed by the
goal id in bold and the goal's summary. Idle goals use a dash (`-`);
running goals use `▶`. Only the list is selectable — the text beneath is
read-and-scroll only. Keyboard navigation auto-scrolls the list so
the selected goal stays visible (edge scrolling).

The goal-text pane opens with a one-line header above the body: the
goal's summary in subdued text followed by a compact type tag
(`[kind · tier]`) in muted grey. The header makes the goal's scope
and model tier readable at a glance without parsing the body.

In the goal text, list items (markdown bullet points) render with a dash (`-`)
as the marker — the dash carries less visual weight and keeps the prose
as the surface.

Any text region scrolls with the mouse wheel — whichever region is
under the cursor. New content keeps the view pinned to the bottom;
scrolling up disables auto-follow until the user scrolls back down,
where it re-engages.

The REPL conversation pane must scroll smoothly regardless of how
many messages have accumulated. Currently, every frame rebuilds the
layout of the entire conversation, so rendering cost grows with total
text and eventually breaks interactive scrolling. The layout cost of
rendering accumulated messages must remain bounded.

**Queue visibility.** When goals have running or pending sessions,
the goal list marks them: a distinct glyph (`▶`) for the
currently-running goal, a bracketed integer (`[1]`, `[2]`) marking a
goal's next queued position; a goal with several pending invocations
shows only that next index. For tend, rummage, and jog, ▶ appears
when the user submits a message; for goal agents, at dispatch. It
clears on Done. The prefix character and queue integers render dim regardless of goal packaging,
so they don't compete with the goal name. The goal ID of a running goal renders in a distinct
colour. The goal list's pane label shows running IDs inline
(`Goals > id1, id2, …`); those IDs render bold and in the running
color, matching their list rows. When a marked goal is selected, the goal-text region
appends a section beneath the description listing every pending
invocation for that goal in queue order — running first, then queued
— each line carrying its glyph or index and trigger reason. The queue
surface is read-only.

**Ephemeral sub-sessions.** Ephemeral sub-sessions appear in the goal list as soon as they are dispatched — not deferred until the dispatching turn completes. Sub-sessions nest visually under their immediate dispatcher at all depths: `jog~1~3` appears indented beneath `jog~1`, which appears beneath `jog`. The pane label normalizes to the root permanent goal name. When a sub-session was dispatched with an explicit label, the goal-list row displays the label instead of the auto-generated `root~N` index; unlabeled sub-sessions continue to display as `root~N`.

**Token-usage metrics.** Each goal-list row shows three right-aligned
token-usage metrics in compact form: session count, average input
tokens per session, and average output tokens per session. The three
numbers replace a few characters of the summary preview — already
truncated — and each isolates one cost driver: session count flags
overtriggering, input per session flags prompt size, output per
session flags verbosity. The metrics render right-aligned so they
form neat columns across all goals. The detail pane shows the full
breakdown: totals, per-session averages, and cache-hit information
where the provider reports it.

**Options dialog.** Pressing Enter on a goal in the goal list opens
an options dialog with two fields: a trigger reason and the goal's
current tier. If the tier is changed and the goal has a running
session, the dialog warns that confirming will reset the session. On
confirm, the trigger reason is used, the updated tier is written to
the goal's source file, and the running session (if any) is reset.
The options dialog is the designated home for goal and model settings
— future settings land here, not on ad-hoc keybindings. The startup
message and the `/help` output both mention that Enter on a goal
opens options.

## WHY
Tinker is meant to be watched while it works. A single REPL would
hide too much — the user wants to see the conversation, the
standing intent, and what the goal sessions are actually doing, all
at once. The two-band
layout gives maximum space to the goal list — navigating goals,
reading their text, and seeing running activity at a glance — while
agent output is on-demand via session switching.

The per-session conversation view keeps the REPL focused: if output
from all background sessions accumulated together, the thread the
user is following would be buried. The conversation pane is a chat
with one agent at a time. Switching sessions loads the full history so
the user never loses context when returning to a previous thread.
User inputs belong to the session they were sent to — not to a global
transcript — because a message typed in the `tend>` context has no
meaning in a `rummage>` thread.

The `/<goal-id>` switching mechanism extends naturally from the
original three named agents to the whole registry — any goal is
directly addressable from the keyboard.

Tend's startup output is not rendered because it is internal
scaffolding, not conversation. The user opened tinker to type
something, not to read tend orienting itself.

Queue markers render dim for the same reason — they are ambient
status, and a bright marker would compete with the goal name. The goal
ID of a running goal is coloured instead: the name carries the meaning,
so the name gets the signal. Running goals are easy to scroll past when
only a dim glyph marks them; colour on the ID makes the active goal
stay visible at a glance. The queue surface is read-only by
deliberate choice: the user wanted to see what is running without
being able to cancel or reorder it. Queue control is a separate
concern, deferred until there is a real need.

List markers render as dashes for the same reason queue markers render dim —
when a surface is scanned, heavy markers compete with the content they mark.
The dash recedes.

Ephemeral sub-sessions appear at dispatch time, not at turn completion, for the same reason the system is meant to be watched while it works: the user needs to see that work is forming, not just that it landed. A burst of entries appearing alongside a finished result gives no signal about what happened in between. Nesting at accurate depth reflects the actual work hierarchy — a sub-session shown flat under the root misrepresents which coordinator owns it and obscures the structure of the running task. Label-first display extends the same reasoning to the row itself: if the dispatcher encoded what the sub-session is doing in the label, rendering an opaque index discards that signal.

Goal IDs render bold and state-colored everywhere they appear — list
rows, the pane label, and any future surface. A goal ID is a stable
identity; a different style in a different place forces mental
translation. Bold identifiers scan faster than plain ones on a
navigation surface. Rows show the summary rather than the first WHAT
line because the summary is the compact, purpose-built scope description.

The detail-pane header shows the summary again because a triggered
goal session may start outside the user's active focus — the detail
pane is what they turn to, and the summary delivers scope before the
body text arrives. The tier tag is there because a wrong tier degrades
output quality or inflates cost silently for the whole session; the
only check is seeing the assigned value while work runs.

"""
