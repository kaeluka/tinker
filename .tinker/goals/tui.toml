id = "tui"
summary = "governs: three-pane TUI (conversation left; goal-list/text/session-log right at 25/50/25%); per-session conversation view; queue visibility (dim ▶ running; dim [N] queued; coloured goal ID for running goal; no exemptions — tend/rummage/jog ▶ starts at message submission; goal agents ▶ starts at dispatch; both clear on Done; full listing in goal-text region); auto-follow scroll; active-agent tag (<goal-id>>); /<goal-id> switches active session; each agent's messages labeled with goal-id; modal trigger-reason dialog | triggers: TUI layout/rendering changes; queue display; scroll behavior; agent-switch UX; message label rendering; per-session filtering; ▶ timing trigger; goal ID colour"
description = """
## WHAT
Tinker presents a terminal interface in two columns. The **left
column** carries the live conversation. The **right column** stacks
three bands at fixed proportions: a selectable **goal list** (25%
height), the full **goal text** of the currently selected goal
beneath it (50%), and the **session log** at the bottom (25%).

In the conversation, an input-prompt tag names the active session
(e.g. `tend> `, `goal-id> `); input routes to that session.
Any session in the registry can be activated with `/<goal-id>` —
this includes tend, rummage, jog, and any goal agent. The active
session receives whatever the user types next. Each agent's messages
carry the goal-id as a label.

The conversation pane is a **per-session view**: each session has its
own history of inputs the user sent to it, the session's responses,
and system notifications. System notifications are global — they
appear in every session's view. User inputs and agent output belong
to the session they were exchanged with. Switching to a different
session with `/<goal-id>` immediately loads that session's full
accumulated conversation into the pane, then streams new output from
that session going forward.

Tend's startup output — produced in response to its startup-silence
init message, before the user has typed anything — is not rendered
in the conversation pane. The first entry the user sees is their own
first message.

In the goal list, only the list is selectable — the text beneath is
read-and-scroll only. Keyboard navigation auto-scrolls the list so
the selected goal stays visible (edge scrolling).

In the session log, the reason a session was triggered renders in
bold at the top. The session log is independent of the active
conversation: it shows passive output from whichever goal is
selected in the goal list, even when the left-pane conversation is
active on a different session.

Any text region scrolls with the mouse wheel — whichever region is
under the cursor. New content keeps the view pinned to the bottom;
scrolling up disables auto-follow until the user scrolls back down,
where it re-engages.

**Queue visibility.** When goals have running or pending sessions,
the goal list marks them: a distinct glyph (`▶`) for the
currently-running goal, a bracketed integer (`[1]`, `[2]`) for each
goal's next queued position. Every session in the registry is subject
to this indicator without exception. For tend, rummage, and jog,
▶ appears the moment the user submits a message and
clears on Done — the agent is actively working from submission, not
from when the first response chunk arrives. For goal agents, ▶
appears at dispatch time and clears on Done. A goal with several pending invocations
shows only its *next* index — never multiple numbers — so the list
stays uncluttered. Markers render dim/grey so they don't dominate
the goal name. The goal ID of a running goal is rendered in a distinct
colour, making it visually salient while scrolling; the ▶ marker stays
dim. When a marked goal is selected, the goal-text region
appends a section beneath the description listing every pending
invocation for that goal in queue order — running first, then queued
— each line carrying its glyph or index and trigger reason. In the
idle state (empty queue, nothing running) no markers appear and the
goal-text region shows only the description. The queue surface is
read-only: the user observes running and pending work without any
controls to cancel or reorder.

**Manual triggers.** When the user triggers a goal by hand — Enter
in the goal list — a modal text-input dialog collects the trigger
reason.

## WHY
Tinker is meant to be watched while it works. A single REPL would
hide too much — the user wants to see the conversation, the
standing intent, and what the goal sessions are actually doing, all
at once. The three-region layout keeps all of that visible without
configuration.

The per-session conversation view keeps the REPL focused: if output
from all background sessions accumulated together, the thread the
user is following would be buried. The conversation pane is a chat
with one agent at a time; the session log pane is where background
activity is observable. Switching sessions loads the full history so
the user never loses context when returning to a previous thread.
User inputs belong to the session they were sent to — not to a global
transcript — because a message typed in the `tend>` context has no
meaning in a `rummage>` thread.

The `/<goal-id>` switching mechanism extends naturally from the
original three named agents to the whole registry — any goal is
directly addressable from the keyboard. The session log pane stays
independent so the user can monitor a goal agent passively while
conversing with a different session.

Tend's startup output is not rendered because it is internal
scaffolding, not conversation. The user opened tinker to type
something, not to read tend orienting itself.

Queue markers render dim for the same reason — they are ambient
status, and a bright marker would compete with the goal name. The goal
ID of a running goal is coloured instead: the name carries the meaning,
so the name gets the signal. Running goals are easy to scroll past when
only a dim glyph marks them; colour on the ID makes the active goal
stay visible at a glance. The queue surface is read-only by
deliberate choice: the user wanted to see what is running without
being able to cancel or reorder it. Queue control is a separate
concern, deferred until there is a real need.

"""
parent_id = ""
