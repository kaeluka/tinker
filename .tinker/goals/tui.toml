id = "tui"
description = """
## WHAT
Tinker presents a terminal interface in two columns. The **left
column** carries the live conversation. The **right column** stacks
three bands at fixed proportions: a selectable **goal list** (25%
height), the full **goal text** of the currently selected goal
beneath it (50%), and the **session log** at the bottom (25%).

In the conversation, an input-prompt tag names whichever agent will
receive the next message (`tinker> `, `rummage> `, or `jog> `); input
routes to that agent, and the `/tinker`, `/rummage`, and `/jog` slash
commands switch it (the switching mechanism and the first two are
defined in `rummage`, `/jog` in `jog`). Tinker's tool calls (bash, read,
edit, etc.) render in dim grey with payloads cropped to their first
line, so multi-line output doesn't flood the thread. When tinker
triggers follow-up goals via `/run` lines in its reply, the system
message listing those goals and their reasons also renders in grey.

In the goal list, only the list is selectable — the text beneath is
read-and-scroll only. Keyboard navigation auto-scrolls the list so
the selected goal stays visible (edge scrolling).

In the session log, the reason a session was triggered renders in
bold at the top.

Any text region scrolls with the mouse wheel — whichever region is
under the cursor. New content keeps the view pinned to the bottom;
scrolling up disables auto-follow until the user scrolls back down,
where it re-engages.

**Queue visibility.** When goals have running or pending sessions,
the goal list marks them: a distinct glyph (`▶`) for the
currently-running goal, a bracketed integer (`[1]`, `[2]`) for each
goal's next queued position. A goal with several pending
invocations shows only its *next* index — never multiple numbers —
so the list stays uncluttered. Markers render dim/grey so they
don't dominate the goal name. When a marked goal is selected, the
goal-text region appends a section beneath the description listing
every pending invocation for that goal in queue order — running
first, then queued — each line carrying its glyph or index and
trigger reason. In the idle state (empty queue, nothing running) no
markers appear and the goal-text region shows only the description.

**Manual triggers.** When the user triggers a goal by hand — Enter
in the goal list, or `/run` without arguments — a modal text-input
dialog collects the trigger reason.

## WHY
Tinker is meant to be watched while it works. A single REPL would
hide too much — the user wants to see the conversation, the
standing intent, and what the goal sessions are actually doing, all
at once. The three-region layout keeps all of that visible without
configuration.

The rendering choices serve legibility under live streaming. Tool
calls and tinker-triggered system messages render dim because
they're scaffolding, not the conversation the user is following;
cropping tool payloads to one line keeps multi-line output from
burying the thread. Trigger reasons render bold in the session log
because they're the one piece of context explaining why a session
is doing what it's doing. Queue markers render dim for the inverse
reason — they're ambient status, and a bright marker would compete
with the goal name that carries the actual meaning.

The queue surface is read-only by deliberate choice: the user
wanted to see what's queued without being able to cancel, reorder,
or pause it. Queue control is a separate concern, deferred until
there's a real need — today not even tinker can manipulate the
queue.

## SCOPE
- In scope: the two-column layout at fixed 25%/50%/25% right-side
  proportions; live streaming of conversation and session output;
  mouse-wheel scrolling with auto-follow; keyboard goal-list
  navigation with edge scrolling; dim/cropped tool-call rendering;
  grey rendering of the triggered-goals system message; the modal
  trigger-reason dialog; bold trigger reasons in the session log;
  queue markers in the goal list and pending-invocation listing in
  the goal-text region; the active-agent input-prompt tag and
  message routing; recognizing the `/tinker`, `/rummage`, and `/jog`
  slash commands that switch the active agent.
- Out of scope: themes, syntax highlighting, layout
  configurability, syncing the interface to a remote viewer; any
  interactive manipulation of the queue (cancel, reorder, pause,
  clear) — the queue surface is read-only.

"""
