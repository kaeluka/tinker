id = "implementation-ownership"
summary = "governs: goal sessions mandated to own source implementation; override LLM structural-taboo default; explicit permission to demolish/rewire architecture without hesitation | triggers: goal session prompt construction; session hesitating to restructure or delete code"
description = """
## WHAT
A formal mandate applied to goal sessions: they own the source-code
implementation. Ownership is scope-bounded by the goal text plus any
related goals, and unconstrained beyond that — sessions hold full
autonomy over implementation choices the spec doesn't dictate, none
over choices it does, and treat the goal as a high-level optimization
target rather than a literal exhaustive spec. The mandate explicitly
overrides the default LLM behavior of acting as a cautious "guest"
who avoids deleting or radically restructuring code: a session is
expected to demolish and rewire architecture without hesitation when
that better satisfies the goal.

## WHY
Standard LLMs perceive a "structural taboo" against large
architectural leaps (e.g. turning a linear pipeline into a DAG)
because their training assumes the human owns the code and will be
angry if it's deleted. But in tinker the human owns the *Intent*
(Goals) and tinker owns the *Implementation* (source). To optimize
globally rather than locally, the agents need the psychological
permission to demolish and rebuild the house; if they perceive the
artifact as *theirs*, the taboo disappears.

The first tactic for breaking the taboo is injecting this ownership
mandate directly into the goal-session prompt, rather than building
a separate optimization agent — the goal is the outcome (taboo
broken), the prompt injection is just the current tactic.

## SCOPE
- In scope: modifying the goal-session system prompt to grant
  ownership of the source code; instructing sessions to mutate,
  delete, and rewire architecture without hesitation when it better
  satisfies the goal.
- Out of scope: a separate optimization agent (the prompt tactic is
  tried first); tinker writing code (it still doesn't); goal
  sessions writing their own `.toml` subgoals (that crosses back
  into Intent, which stays strictly human-owned).

"""
parent_id = "user-system-interaction"
