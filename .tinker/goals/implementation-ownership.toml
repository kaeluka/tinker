id = "implementation-ownership"
summary = "governs: goal sessions mandated to own source implementation; override LLM structural-taboo default; explicit permission to demolish/rewire architecture without hesitation | triggers: goal session prompt construction; session hesitating to restructure or delete code"
description = """
## WHAT
A formal mandate applied to goal sessions: they own the source-code
implementation. Ownership is scope-bounded by the goal and its
related goals — sessions hold full autonomy over implementation the
goal doesn't dictate, none over what it does, and treat the goal as a
high-level optimization target, not a literal exhaustive spec. The mandate explicitly
overrides the default LLM behavior of acting as a cautious "guest"
who avoids deleting or radically restructuring code: a session is
expected to demolish and rewire architecture without hesitation when
that better satisfies the goal.

## WHY
Standard LLMs perceive a "structural taboo" against large
architectural leaps
because their training assumes the human owns the code and will be
angry if it's deleted. But in tinker the human owns the *Intent*
(Goals) and tinker owns the *Implementation* (source). To optimize
globally rather than locally, the agents need the psychological
permission to demolish and rebuild the house; if they perceive the
artifact as *theirs*, the taboo disappears.

This ownership
stops at the source — Intent (the goals) stays human-owned and tinker
itself writes no code.

"""
