id = "fresh-agents"
kind = "feature"
summary = "This goal owns the fresh-dispatch mechanism: goal agents dispatch to ephemeral sub-sessions of themselves to distribute tasks with inherent parallelism across bounded, focused contexts, with sub-sessions retiring when the next batch begins."
description = """
## WHAT

Goal agents can dispatch to ephemeral sub-sessions of themselves. A spawning agent addresses a fresh dispatch to its own goal id and an optional label; the label lets the dispatcher correlate incoming replies. The fresh sub-session receives the same startup context as the dispatcher and replies via ordinary @-messages. Decomposition is one level deep — fresh sub-sessions carry standard startup context, not fresh-dispatch capability. Completed sub-sessions remain inspectable until the next batch starts; at batch-start they are silently removed (any period during which at least one session is active or a message is pending delivery constitutes a batch).

## WHY

When a task has inherent parallelism — independent sub-tasks that don't need to share context — the right default is to distribute the work. The existing dispatch model gives agents no way to do this: all work accumulates in one session, degrading quality as context grows and keeping the dispatching session burdened with content it doesn't need. Fresh dispatches make parallelism the default path: each sub-session starts clean and focused, the dispatching session stays tight, and results return via the normal reply channel.

"""
parent_id = ""

