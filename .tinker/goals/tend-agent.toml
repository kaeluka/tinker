id = "tend-agent"
summary = "governs: tend opencode agent profile (tend.md installed at startup); static persona+procedures in file, dynamic goal list via stdin; task/todowrite denied (uniform across all interactive agents); webfetch and lsp allowed; VCS mutation forbidden in prompt | triggers: tend persona/tool-permission changes; opencode agent file content; claude backend parity"
description = """
## WHAT
Tend enforces its own boundaries by running under a custom
`opencode` agent profile (`tend`). The profile replaces opencode's
default software-engineer persona with the strict tend persona and
denies the autonomous multi-step tools `task` and `todowrite`. Tend
installs this agent file into `~/.config/opencode/agents/tend.md`
silently on startup if it's missing, and launches with `--agent tend`.

The split between static and dynamic: the persona and procedures
live in the agent file as a formal system prompt; the current goal
list is passed in fresh over `stdin` each run (tend should not *be*
the goals). Tend keeps `allow` permission for `write` / `edit` /
`bash` globally rather than locking those down — the
`tinker-test-case:` marker requirement is enforced by prompt, not by
permission. Tend may read version-control state but is forbidden in
its system prompt from mutating it.

**Uniform tool permissions.** The denied set (`task`, `todowrite`) is
identical across all interactive agents — tend, rummage, and jog. No
tool distinction is made between them. `webfetch`, `lsp`, and
`websearch` are all available to every interactive agent; no agent
has a permission another lacks.

## WHY
By default, opencode acts as an autonomous software engineer. Run
under that default profile, the underlying agent would sometimes
ignore tend's rules (like "don't write production code") and
autonomously edit source to fix bugs. Isolating tend in a custom
profile strips out that base identity and makes the boundary
mechanical rather than prompt-only.

`task` and `todowrite` are denied because they create autonomous
multi-step actions without user visibility — the only category of
tool that warrants mechanical denial across all interactive agents.
Everything else is available: distinctions between agents on tool
access create structural privilege that has no justification and
makes the system fragile when agent responsibilities shift.

## SCOPE
- In scope: silently creating `~/.config/opencode/agents/tend.md`
  on startup if missing; holding the static persona/procedures in
  that file while passing the dynamic goal list over `stdin`;
  denying `task` and `todowrite` (same set as rummage and jog);
  passing `--agent tend` at launch; enforcing the no-VCS-mutation
  boundary in the system prompt.
- Out of scope: custom agent profiles for goal sessions or the
  cleanup runner; managing `opencode` config outside the `agents/`
  directory; denying `write` / `edit` / `bash` (the marker
  requirement is prompt-enforced instead); per-agent tool distinctions.

"""
