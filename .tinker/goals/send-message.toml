id = "send-message"
kind = "feature"
summary = "This goal owns the send-message tool available to every agent session — a schema-enforced, target-validated outbound message that delivers into the same routing substrate as @-block envelopes but fires the recipient immediately during the turn rather than at turn completion, lazily spawning permanent goals on first contact and failing outright on invalid targets."
description = """
## WHAT
All agent sessions have a send-message tool that dispatches a message to a named target. The tool lazily spawns permanent goals the same way @-dispatch does: when the target is a known goal in the goal tree (the full set of goals registered in the system, whether or not currently running) but has no active session, the tool requests the runtime spawn the recipient's session and delivers the message into it. The recipient fires immediately once spawned, during the turn — not deferred to turn completion.

The tool validates that the target is not the sender itself. It returns an error when self-send is detected (to prevent unbounded recursion), or when the target is unknown (not recognized as a goal and not present as a running session). From the recipient's view, a tool-delivered message is indistinguishable from an envelope-delivered one: both paths deposit the same message type into the same routing substrate.

The envelope mechanism (@-block tags) continues working alongside the tool until its retirement — send-message is the successor, and envelopes are temporary.

## WHY
Envelopes serve their role but leave gaps the tool closes. Three failure modes in the envelope path:

- **Format fragility.** Envelopes embed address and content in free-form output. Agents forget the tag format or malform it, and the message is lost. A structured tool with schema-enforced parameters removes the failure mode.

- **Discoverability.** Envelopes are an implicit convention. Agents conflate the reply envelope (unnamed, wraps the outgoing reply) with outbound sends, and try to embed named addresses in envelope text that the harness does not parse. When the send is an explicit tool, the capability is legible in the tool schema.

- **Turn-end latency.** Envelopes extract at turn completion. The recipient sits idle until the sender finishes. A tool call fires during the turn — the recipient dispatches immediately, increasing parallelism between sessions.

The tool validates target identity. Self-targeting would spawn an unbounded chain of turns; the explicit error cues the agent to course-correct. Unknown targets would be silent loss; the error prevents it. Envelopes already guarantee "never silently drops" at the extraction layer; the tool extends that to target resolution in schema.

"""
parent_id = ""

