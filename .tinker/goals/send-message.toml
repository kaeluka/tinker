id = "send-message"
kind = "feature"
summary = "This goal owns the send-message tool — the sole agent-to-agent communication mechanism, available to every agent session. A schema-enforced, target-validated message that fires the recipient immediately during the turn, lazily spawning permanent goals on first contact, failing outright on invalid targets. The self-send restriction is session-scoped so sub-sessions can reply to their parent."
description = """
## WHAT
All agent sessions have a send-message tool that dispatches a message
to a named target. The tool lazily spawns permanent goals on first
contact: when the target is a known goal in the goal tree but has no
active session, the tool requests the runtime spawn the recipient's
session and delivers the message into it. The recipient fires
immediately once spawned, during the turn.

The tool validates that the target is not the sender's own session.
The self-send restriction is session-scoped: a sub-session may send to
its parent (same goal, different session), and a parent may send to a
sub-session. This is the reply path for dispatched agents and
sub-sessions. The tool returns an error only when the sender and
recipient are the same session (to prevent unbounded recursion), or
when the target is unknown (not recognized as a goal and not present
as a running session).

## WHY
Agent-to-agent communication needs to be reliable, discoverable, and
immediate. Schema enforcement makes every send well-formed by
construction — no text convention to forget or malform. The
capability is legible in the tool list every agent already reads, and
the recipient fires during the caller's turn. The self-send
restriction is session-scoped: a sub-session may reply to its parent
(same goal, different session), and a parent may address its
sub-sessions. This prevents unbounded recursion without blocking the
parent-child reply path that all dispatched work depends on.
"""
