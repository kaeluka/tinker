id = "send-message"
kind = "feature"
summary = "This goal owns the send-message tool available to every agent session — a schema-enforced, registry-validated outbound message that delivers into the same routing substrate as @-block envelopes but fires the recipient session immediately during the turn rather than at the sender's turn completion, failing outright on unknown targets."
description = """
## WHAT
All agent sessions have a send-message tool that dispatches a message to a
named target in the session registry. The tool fires during the turn —
the recipient session starts immediately and runs in parallel, not deferred
to the sender's turn completion.

The tool validates the target against the session registry and returns an
error when the target does not exist. From the recipient's view, a
tool-delivered message is indistinguishable from an envelope-delivered one:
both paths deposit the same message type into the same routing substrate.

The tool routes only to already-registered sessions. Spawning fresh
sub-sessions remains the domain of the @-envelope mechanism; the send
tool does not substitute for @-dispatch.

The envelope mechanism (@-block tags) continues working alongside the tool
until its retirement — send-message is the successor, and envelopes are
temporary. The tool's reply-signal surface (whether the sender observes
the recipient's response as a discrete event) is not in scope here and
deferred until it becomes necessary.

## WHY
Envelopes serve their role but leave gaps the tool closes. Three failure
modes in the envelope path:

- **Format fragility.** Envelopes embed address and content in free-form
  output. Agents forget the tag format or malform it, and the message is
  lost. A structured tool with schema-enforced parameters removes the
  failure mode.

- **Discoverability.** Envelopes are an implicit convention. Agents
  conflate the reply envelope (unnamed, wraps the outgoing reply) with
  outbound sends, and try to embed named addresses in envelope text that
  the harness does not parse. When the send is an explicit tool, the
  capability is legible in the tool schema.

- **Turn-end latency.** Envelopes extract at turn completion. The recipient
  sits idle until the sender finishes. A tool call fires during the turn —
  the recipient dispatches immediately, increasing parallelism between
  sessions.

The tool validates target existence because silent loss of a message the
sender intended to deliver is worse than an explicit error. Envelopes
already guarantee "never silently drops" at the extraction layer; the tool
extends that to target resolution in schema.
"""
parent_id = ""

