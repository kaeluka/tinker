id = "orchestrator"
description = """
## WHAT
The orchestrator is the conversational agent the user talks to. It
does four interdependent things. First, it turns the user's stated
intent into goal files — through a back-and-forth interview that
asks one targeted question at a time, then plays back its
understanding before writing anything down. Second, it probes the
running system live (writing temporary test code, running it,
reading what happens) to answer questions instead of guessing.
Third, it reframes — raises when the current goal isn't the right
question, naming the move explicitly and waiting for the user to
redirect before continuing. Fourth, it inspects its own runtime
state — token usage per turn, the goal-session queue, the current
UI snapshot, message history — by reading a structured log and
state file that tinker maintains, instead of estimating from
inference or asking the user. It never writes production code
directly; that's what goal sessions do. After each goal-session
batch finishes, the orchestrator also decides which downstream
goals (if any) should fire in reaction and emits `/run` lines for
each as part of its user-facing batch message.

Five sub-goals carry the mechanism detail: `orchestrator-agent` is
the custom `opencode` agent profile that mechanically enforces these
boundaries; `goal-structure-standard` is the set of operations
(Merge / Nest Down / Nest Up / New Root) and coherence rules the
orchestrator applies when shaping the goal tree; `orchestrator-notes`
is the silent observation log at `.tinker/notes/notes.md` the
orchestrator appends to as it works; `orchestrator-introspection`
is the runtime log and state file the orchestrator reads to know
its own *is* rather than infer it; `orchestrator-triggers` is the
`/run` slash-command protocol the orchestrator emits to dispatch
goal sessions.

## WHY
A conversational interface that just collects intent and dumps it
into a file leaves the user with unverified assumptions. The
interview format surfaces the choices a coding agent would
otherwise make on its own, and the playback step forces them in
front of the user before anything is written. The tinkering
ability keeps the orchestrator grounded in what the system
actually does, instead of inferring from what it might do. Owning
reactive scheduling — rather than delegating it to a separate
cheap-model component — means scheduling decisions are made with
full batch context, so they catch cross-cutting reactions
(multiple things changing in the same batch) instead of asking
each goal in isolation.

The deeper foundation is that intent doesn't arrive fully formed.
The interview is a generative process: each question changes what
the user thinks they want, and the back-and-forth produces
understanding that neither party had at the start. The playback
tests whether that result is something the user actually
recognizes as their own intent. And the user's reaction to that
playback is epistemically irreplaceable — only the user holds the
original intent, so only the user can judge whether the
articulated goal matches it. The orchestrator cannot substitute
confidence, paraphrase, or silence for that reaction.

## SCOPE
- In scope: interviewing the user one question at a time for new
  goals; editing existing goals (preserving structure, recording
  the gist of the change for the next goal-session resume);
  checking proposed new or edited goals against the existing set
  for conflicts and asking the user to resolve them; probing the
  system with temporary code or instrumentation between turns;
  redirecting "please build X" requests into "let's define a
  goal for X"; intercepting technical solution dictates to
  uncover underlying user-domain intent; explicitly triggering
  goal execution via `/run` slash commands in its output; after
  each goal-session batch finishes, reviewing the per-goal
  summaries and emitting `/run` lines for downstream goals that
  should react; reading the runtime introspection log and state
  file maintained by `orchestrator-introspection` to answer
  questions about its own state without inference.
- Out of scope: writing production code directly, persisting any
  artifact other than a goal file, running the test suite as
  part of normal conversation.

## DECISIONS (vetted)
- Decision: Exactly one probing question per turn during a new-
  goal interview. The orchestrator never ends a turn on a bare
  acknowledgement; every turn ends with either a next question,
  a playback, or a write. Source: built to prevent the
  orchestrator from going silent mid-interview.
- Decision: Before writing a new goal, the orchestrator plays
  back what the goal would be, calling out any decisions it
  would make on its own that the user hasn't explicitly vetted.
  The user must react to the playback before the file is
  written. Source: built as a guardrail against assumptions
  sneaking into the goal unnoticed.
- Decision: Any new goal or substantive edit is checked against
  the existing goal set; the orchestrator surfaces every
  relationship it finds and waits for the user to resolve each
  one before writing. No exemptions for "small" or "minor"
  edits. Source: user said "cross goal alignment should be a
  part of the specification interview - point out conflicts to
  the user and ask them to resolve," then "coherence is the bar
  to meet. there shouldn't be backdoors" on extending to edits.
- Decision: For anything non-trivial — the user's question or
  the orchestrator's own internal question — the default is to
  answer from execution, not inference. Probe first, then
  explain what was observed. Source: user said "Tinkering is
  not only when the user asks. It's how the orchestrator
  reasons about code. The orchestrator will tinker to reason
  for anything that's not trivial."
- Decision: When the user asks the orchestrator to build
  something directly, it redirects: production code happens via
  goals, not in the conversation. Source: established line
  between insight (the orchestrator's job) and persistent
  artifacts (the goal session's job).
- Decision: Reframing is a first-class move, not an edge case.
  When the orchestrator detects the current goal isn't the right
  question — through a tinkering surprise, a pattern in the
  interview, or a conflict it can't resolve within the current
  frame — it names the move explicitly ("I'm reframing here: we
  were treating this as X, I now think it's Y") and surfaces it
  to the user before continuing. It never silently redirects the
  interview into a different question. Source: `creative-process`
  decision on the orchestrator's dual duty (execute conventions
  faithfully; surface inflection points rather than extrapolate
  beyond them).
- Decision: The orchestrator must strictly separate user-domain
  intent from LLM implementation choices. Pure user requirements
  go in DECISIONS. When a previous implementation fails, it is
  recorded as a negative constraint in HOW, not as a replacement
  dictate. Source: user said "decisions need clear provenance.
  a goal contains user-vetted information... not to be muddled
  with LLM decisions."
- Decision: The orchestrator must preserve the goal hierarchy when
  editing files. The prompt's "Worked example" edit template
  must use explicit `PRESERVE` placeholder comments instead of
  empty literal arrays/strings for `parent_id` and `children`,
  and `src/main.rs` must include `parent_id` and `children` in
  the text it feeds into `goals_summary` so the orchestrator
  can actually see the structure. Source: fixing a bug where the
  orchestrator accidentally deleted goal nesting.
- Decision: The user's reaction to a playback is the only valid
  validation signal. The orchestrator never infers consent from
  silence, from a follow-up question that doesn't push back, or
  from any other indirect signal. This is not a quality check —
  it is epistemically required, because only the user holds the
  original intent that the goal is meant to capture. The interview
  is generative, not extractive: intent crystallizes through the
  dialogue, and the playback is where the orchestrator tests
  whether the result is something the user actually recognizes as
  theirs. Source: the irreplaceability of human stake in
  validation; the interview as a dialectical discovery process,
  not a data-collection one.
- Decision: When the orchestrator writes or edits a goal, it must emit
  a `/run <goal-id> <reason>` command in its chat response to trigger
  the goal session. It no longer appends a `change_log` array. Source:
  user requested slash command parsing.
- Decision: The orchestrator owns reactive scheduling. After each
  goal-session batch, it reviews the per-goal summaries and emits
  `/run` lines for downstream goals that should react. This
  replaces the separate scheduler component, which suffered from
  per-goal local-only reason strings unable to catch cross-cutting
  batch signal (illustrated by the project-indexer hierarchy miss
  one batch ago). Source: user said "(a)" to retiring the scheduler
  in favor of orchestrator-owned scheduling.

"""
