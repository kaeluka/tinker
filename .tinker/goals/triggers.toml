id = "triggers"
summary = "governs: /run <goal-id> <reason> dispatch protocol; two non-user emitters (tend, rummage); declarative-pointer reason rule (user-typed exempt); jog→tend spec-edit channel (/jog-edit, prescriptive, user-sourced, terminal for thread) | triggers: /run parsing; dispatch mechanics; reason format enforcement; jog-edit channel behavior"
description = """
## WHAT
`/run <goal-id> <reason>` is the dispatch protocol for goal
sessions. An agent announces a trigger as a line of that form in its
chat output; after the reply finalizes, the system scans it for
those lines and dispatches a goal session for each, threading the
reason through as the session's "what to do right now" context.
Multiple `/run` lines in one reply each fire a separate session (the
first runs, the rest queue). Anything that isn't a recognized `/run`
line is shown to the user as ordinary chat, so triggers and prose
coexist in the same reply. The same syntax is what the user types at
the input prompt to fire a goal manually.

The protocol has two non-user emitters, and the system scans both
their finalized outputs:
- **Tend** (per `tend`) is the primary emitter — the same
  mechanism serves edited goals and reactive post-batch scheduling,
  and there is no separate scheduler component.
- **Rummage** (per `rummage`) emits `/run` to commission a fix on a
  confirmed code-vs-spec bug.

Emitted reasons are **declarative pointers to spec deltas** — what
changed in the goal text, or what changed in the environment the
goal might react to — never imperatives about what to build. The
session reads the updated goal, sees the delta, and derives its work
from the spec itself. An imperative reason ("add modulo support")
would launder implementation intent through the dispatch channel and
bypass the spec process, where that intent legitimately belongs.
Rummage's reason complies natively: it points at the durable failing
test rummage wrote, which is exactly the "change in the environment"
the rule allows. User-typed reasons (the TUI Enter modal, `/run` at
the prompt) are exempt as a pragmatic escape hatch.

A second dispatch channel serves a different target. **`jog`→`tend`**:
when `jog`'s intent↔spec audit finds the user knows better than the
goal, jog dispatches `tend` (not a goal session) to fix, clarify, or
enrich it. This channel differs from `/run` in both target and rule —
its instruction is **prescriptive** (the spec change to make), and it
is exempt from the declarative-reason rule because its content is
**user-sourced intent** gathered in jog's conversation, not laundered
implementation. `triggers` owns dispatch as such — `/run` to goal
sessions, the jog→tend channel to tend — and scans the finalized
output of every non-user emitter for the lines each channel
recognizes.

## WHY
Earlier, goals carried a `change_log` array recording pending work
an agent wanted a session to act on. That had three problems: the
name implied a historic record rather than pending tasks; the field
accumulated cruft across runs; and it coupled spec storage to runtime
triggers. Moving the trigger out of the file and into a chat-line
slash command keeps the spec clean and ties each trigger to a
specific moment with a specific reason. The same move folded the old
separate cheap-model scheduler into tend — reactive scheduling is
now just tend emitting more `/run` lines in its post-batch reply,
where it has full batch context.

The protocol is its own goal, owned by neither agent, because `/run`
is now a shared concern: both tend and rummage emit it. Nesting it
under one emitter would assert that emitter owns the mechanism, which
is no longer true. Each emitter's decision about *when* to emit lives
in that emitter's goal; the protocol they share lives here.

## SCOPE
- In scope: the `/run <goal-id> <reason>` syntax; scanning the
  finalized output of every non-user emitter (tend and rummage)
  for those lines; one session per matching line with the reason
  threaded through; multiple `/run` lines per turn each queuing a
  session; the same `/run` syntax usable by the user at the prompt;
  the declarative-reason rule with the user-typed escape hatch; the
  jog→tend channel (prescriptive, tend-targeted, exempt from the
  declarative-reason rule because its content is user-sourced intent).
- Out of scope: dispatch channels beyond `/run` and jog→tend;
  argument syntax beyond what each channel needs; cross-project
  triggers; each emitter's decision about *when* to emit (tend's
  reactive scheduling lives in `tend`; rummage's case-2 dispatch and
  jog's intent↔spec audit live in `rummage` and `jog`).
"""
