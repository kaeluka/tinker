id = "compact-goal-context"
summary = "governs: compact goal index in tend context, summary TOML field, on-demand full-text pull, pull-when-in-doubt strategy, --tend-full-goal-context fallback flag | triggers: tend context model, goal TOML schema, cost of goal list in context"
description = """
## WHAT
Tend's context holds a compact goal index rather than full goal text. The index is LLM-legible, token-efficient, represents parent/child hierarchy via nested data, and represents related-link edges as id arrays with reason strings. Each goal TOML has a `summary` field — written for LLM consumption, not human readability; terse, grammar-stripped, keyword-dense; answering what domain the goal governs and what situations warrant pulling the full text; prose filler carries no signal for a language model navigating by relevance. The `summary` field is the only per-goal content in the index. Full goal text is available on demand via tend's existing file tools. Pull strategy: pull when in doubt; summaries make "clearly irrelevant" goals identifiable so tend skips them confidently; everything else is pulled; a pulled goal stays in context for the session (goals are static — only tend writes them). The system prompt describes this behavior explicitly. Tend writes or updates `summary` on every goal creation and substantive edit.

A `--tend-full-goal-context` startup flag provides a fallback: when set, tend receives full goal text in its context (the pre-compact behavior) and the system prompt section describing the compact index and pull-when-in-doubt behavior is suppressed. The flag is startup-only and not persisted. The `summary` write protocol remains active regardless — summaries are maintained whether or not the compact index is in use at runtime.

## WHY
Full goal text in tend's context every turn is wasteful — most turns don't need most goals, the list grows with the tree, and its cost compounds into the conversation history regardless of backend. A compact index pays only for what's actually navigated.

The fallback flag exists because the compact-index change is a meaningful behavior change to tend's context model. A startup flag lets the user revert to the known-good behavior instantly if the compact index causes problems in practice, without code changes.

## SCOPE
- In scope: compact index format requirements (LLM-legible, token-efficient, nested hierarchy, related as id arrays with reasons); the `summary` TOML field and its content rules; write protocol (tend writes/updates `summary` on every goal creation and substantive edit); system prompt instructions for pull behavior; the `--tend-full-goal-context` startup flag (restores full-text injection, suppresses compact-index prompt section).
- Out of scope: goal session context model (sessions already use the neighborhood table); exact index format or schema (implementation-owned); session history reset (separate concern); automated summary generation; persisting the flag choice.
"""
