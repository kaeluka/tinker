id = "parallel-goal-agents"
summary = "governs: concurrent goal agent execution in shared main working directory; conflict avoidance via agent-collaboration consultation mandate; cleanup-hook runs in main tree before each agent's first turn | triggers: parallel agent execution; conflict avoidance between concurrent agents; dispatch throughput"
description = """
## WHAT

Goal agents run directly in the main working directory. Multiple agents can be active concurrently. Conflict avoidance is the responsibility of the agents themselves: before making significant changes, each agent announces its work to neighboring goals via `@`-messages and awaits input, per the `agent-collaboration` mandate. Agents resolve file-level and goal-level conflicts collaboratively; unresolvable conflicts surface to the dispatcher and ultimately to the user.

The cleanup hook runs in the main working tree before each agent's first turn.

## WHY

Worktree isolation solves the parallel-write problem with filesystem infrastructure — isolation, a merge step, and a merge agent. Coordination via `@`-messages solves the same problem with communication. The communication model is simpler: no merge step, no merge agent, and the conflict-resolution protocol (`agent-collaboration`) is already the mechanism agents use for goal-level coordination.

"""
