id = "reply-compliance"
kind = "feature"
summary = "This goal owns the guarantee that every reply to a dispatched message arrives at its destination: the prompting strategy that makes the reply format salient, and the recovery mechanism that re-sends the original message when a reply doesn't arrive."
description = """
## WHAT

This goal owns the guarantee that every reply to a dispatched message
arrives at its destination. When an agent receives a message and
produces a response, that response reaches the dispatcher. The
guarantee covers both the format requirement (replies must be wrapped
in the correct envelope) and the recovery mechanism (when a reply
doesn't arrive, the system re-sends the original message).

## WHY

A dispatched message expects a reply. When the reply doesn't arrive,
the dispatcher stalls and the chain breaks. The user is the only one
who can notice — and that is tinker's operational burden leaking onto
the person it serves. The dispatch was sent for a reason; losing its
reply loses work the system was asked to do.
"""

