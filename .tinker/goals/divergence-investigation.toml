id = "divergence-investigation"
summary = "governs: shared skeptic role (rummage, jog); goal-as-signal-with-noise; anchor→hypothesize→falsify→integrate loop; commission-from-wanting-layer's-producer vs resolve-without-commissioning; observability splits autonomous(code=rummage) vs dialectical(intent=jog) | triggers: framing skeptic methodology; loop spine; when to commission vs resolve"
description = """
## WHAT
The shared role of tinker's two **skeptical** agents, `rummage` and
`jog`. A divergence investigator finds and explains a gap between two
adjacent layers of the intent↔spec↔code cycle that are supposed to
agree: layer 1 is the user's tacit intent, layer 2 the written
goal/spec, layer 3 the running code. `rummage` works the spec↔code gap
(does the code do what the goal says?); `jog` works the intent↔spec
gap (does the goal still say what the user means?).

Both treat the goal as **signal with noise** rather than as
authoritative — the one stance the system's *producer* agents
(tend and the goal sessions) never take, since the very existence
of an investigation implies a gap somewhere.

Both run the same **loop spine**: anchor the investigation,
hypothesize, attempt to falsify the hypothesis, integrate the result,
repeat. The loop is open-ended — neither investigator pushes for
closure; the user steps off when satisfied — and each recorded
hypothesis carries its falsification attempt alongside it.

Both share a **disposition** for a confirmed divergence: commission a
fix from the producer that owns the layer found wanting, or — when the
gap sits on the *referent* side rather than the produced artifact —
resolve it without commissioning. `rummage` finding the code wanting
commissions a goal session; `jog` finding the goal wanting commissions
`tend`. When instead the referent is what is off — `rummage`'s case
where correct behavior needs a fresh intent decision, `jog`'s case
where the user's own memory had drifted — no producer fix is
commissioned: the human decides, or the act of investigating itself
re-aligns the user.

The two children **specialize on instrument and adjacency**, and the
split is driven by one fact: the **observability of the layer being
checked against**. `rummage` checks against running code, which is
observable and executable, so it investigates autonomously — running
code, instrumenting, fuzzing, walking the call graph. `jog` checks
against tacit intent, which can be neither executed nor read, so its
only instrument is questioning the user without leading them, which
couples the investigation to the human. Each child's outputs and
cleanup needs follow from that difference.

## WHY
Tinker's producer agents are built to move **forward** — intent into
spec, spec into code — and to treat the goal as authoritative.
Detecting where two layers have *diverged* is the opposite
orientation, and folding it into a producer corrupts the producer's
stance. This is why debugging could not live inside tend, and why
spec-drift auditing cannot either. So the skeptical role is its own
branch. Because both skeptics share a methodology — the loop spine,
goal-skepticism, the commission-or-resolve disposition — that
methodology lives here once, rather than being restated in each child.

The autonomous-versus-dialectical split is not arbitrary: it falls out
of the same observability fact `creative-process` uses to make the
human the **termination condition** wherever intent is in play. A
layer you can execute against can be investigated without the human in
the loop; a tacit layer can be investigated only by asking — which is
why `jog` is dialectical and `rummage` is not.

## SCOPE
- In scope: the shared skeptical role across `rummage` and `jog`; the
  divergence frame over adjacent layers of the intent↔spec↔code cycle;
  goal-as-signal-with-noise; the loop spine with per-hypothesis
  falsification; the commission-from-the-wanting-layer's-producer-else-
  resolve disposition; the observability-driven split between
  autonomous and dialectical investigation.
- Out of scope: the producer agents and their forward generation
  (tend and the goal sessions, which treat goals as authoritative);
  the specific modes, instruments, outputs, and cleanup behavior of
  each investigator (those live in `rummage` and `jog`); any third
  investigator beyond these two until one is actually needed.
"""
