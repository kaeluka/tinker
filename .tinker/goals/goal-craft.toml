id = "goal-craft"
description = """
## WHAT
Operational rules for writing the content of a goal so it works as
both a standing intent file and as the prompt tinker and goal
sessions read.

A goal is three synthesized sections — **WHAT**, **WHY**, **SCOPE** —
written as integrated prose, not an enumerated list of decisions.
Hard-won negative constraints that survive synthesis live as
out-of-scope items under SCOPE. There is no DECISIONS section and no
HOW section: user-vetted intent is woven into WHAT and WHY, and
provenance (who said what, when) lives in `.tinker/notes/notes.md`,
not in the goal. These rules apply to every goal file and are
consumed by tinker (during interviews, edits, and cross-goal
alignment) and by goal sessions (through sibling-goal injection).

Five tactics govern the content:

1. **Sparseness** (the anchor test). A claim belongs in a goal only
   if something outside the implementation anchors it: (a) user
   intent or preference, (b) an external dependency — facts about the
   world outside the codebase, like existing systems, vendor
   contracts, regulation, hardware — or (c) a hard-won negative
   constraint, gated by the positive-reformulation test below. A
   claim that is pure implementation opinion has no anchor and
   doesn't belong.

2. **Positive framing.** WHAT not whatn't, WHY not whyn't. Negatives
   aren't forbidden but are discouraged: a hard-won negative is kept
   only when no positive reformulation captures the same constraint
   ("UI needs to breathe" beats "don't do X because the UI loses
   breathing room").

3. **Orthogonality of content.** Goals are free-standing. Cross-
   cutting concerns are carried by the link mechanism (`parent_id`,
   `children`, `related`), not duplicated inside each goal's body.
   The work of "fitting" between goals is done by the link graph, not
   by retrofitting one goal's content with another's constraints.

4. **Goals are prompts.** Every goal does double duty as the prompt
   tinker and goal sessions read. Five rules follow: (i) define terms
   before first use; (ii) use the same word for the same thing
   throughout the file and across sibling goals; (iii) reference
   other goals by id (`creative-process`, not "the dialectical-loop
   goal"); (iv) a concrete example earns its keep only when it
   anchors an abstract claim — decorative examples add density;
   (v) lead with the load-bearing point, supporting context after.

5. **Synthesis over enumeration.** User-vetted intent is integrated
   into WHAT/WHY/SCOPE prose, never accumulated as a list of
   decisions. An enumerated decision list is a worse prompt than
   synthesized prose: it accumulates (each interview turn appends a
   bullet, nobody re-integrates), reads as a changelog rather than
   intent, lets contradictions coexist silently (bullet 4 conflicts
   with bullet 11, both still apply), and triggers list-scanning
   instead of reading comprehension. Synthesis forces integration —
   if claims don't fit together, the prose fails and the
   contradiction surfaces where a list would have hidden it.

These rules are enforced read-time, not by a mechanical write step.
Tinker cites this goal when it surfaces a candidate violation during
an interview or cross-goal alignment — a claim without a clear
anchor, a negative with a clean positive reformulation, content that
belongs in a related-link, a decision-list creeping back in. The
structural rules in `goal-structure-standard` (parent-summary,
related-link symmetry) catch what breaks the moment it's written;
content-quality rules degrade gracefully and rely on conversational
application. Drift is handled the same way: when tinker edits a goal
and notices an anchor has dissolved, it surfaces and proposes
rewriting or retiring the claim.

## WHY
These tactics serve `creative-process`'s iteration loop. When goals
are written well by them, five things follow:

1. The goal layer carries only user-vetted intent — no laundered
   implementation. This applies `the-false-promise`'s antidote
   recursively at the goal layer.
2. Goal sessions retain meaningful implementation autonomy per
   `implementation-ownership`; goals stay high-level optimization
   targets, not literal specs.
3. The iteration loop stays fast and the user stays rested. Less time
   spec'ing means more time tinkering with results.
4. Pushback from goal sessions stays exceptional, per `goal-sessions`
   — a sparse goal gives the session a tractable optimization target
   it rarely needs to question.
5. New orthogonal goals slot in cleanly — "UI needs to breathe" added
   later doesn't collide with over-specified incidentals — and the
   session reading the union of goals keeps maximum collective leeway.

Sparseness and synthesis are the load-bearing pair, and both are
tactics rather than goals in themselves: the outcome they serve is
the iteration loop converging well, which is `creative-process`'s
WHY.

## SCOPE
- In scope: the five tactics; the anchor test that operationalizes
  sparseness; the positive-reformulation rule that gates hard-won
  negatives; the five prompt-quality rules under goals-are-prompts;
  the WHAT/WHY/SCOPE schema with carve-outs in SCOPE and no DECISIONS
  or HOW section; read-time application of all rules during
  interviews and cross-goal alignment.
- Out of scope: automated tooling that scans goals for density,
  negative framing, or missing anchors; retroactive mass cleanup as a
  one-shot (each cleanup is a deliberate hand-picked move); defining
  prompt-quality rules beyond the five listed (lean on shared
  prompt-engineering practice otherwise); a mechanical write-time
  re-validation step (enforcement is read-time, per WHAT).

"""
parent_id = "creative-process"
