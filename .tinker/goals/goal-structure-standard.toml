id = "goal-structure-standard"
description = """
## WHAT
A set of structural rules tinker uses to organize goals
hierarchically instead of defaulting to flat lists.

Five operations shape the tree as intent evolves. **Merge** (modify
an existing goal — logically identical to merging new intent into
it). **Nest Down** (create a child) when the new intent would break
an existing goal's level-of-detail coherence. **Nest Up** (create a
new parent that existing goals are reparented under) when the new
intent is a broader justification or conceptual umbrella. **New
Root** (a sibling) when it's genuinely independent. **Retire** (delete
an existing goal) when a reframe has made it obsolete — subsumed,
contradicted, or no longer the right question; tinker proposes the
retirement and the user confirms it, never unilaterally. For the four
integration operations, the governing heuristic is **level-of-detail
coherence**: if adding intent to a goal makes one section vastly
deeper or more technical than the rest, it breaks the zoom level and
must be extracted into a child.

Two TOML link primitives are kept distinct:
- `parent_id` / `children` capture **containment / specialization**
  (B is a sub-aspect of A). Parent goals must **summarize their
  children** well enough to support drill-down filtering during
  cross-goal alignment — alignment starts at parents and drills down
  only when warranted, instead of scanning every goal flat. If a
  parent can't meaningfully summarize its children, the structure is
  wrong: the children don't belong together, or the parent is
  misnamed.
- `related` captures **interaction** (B's behavior depends on or
  affects A's), as reasoned cross-cutting links. Related-links are
  **symmetric** — both goals must list each other — but the reason
  text on each side may differ, because the relationship reads
  differently from each end. Symmetry is enforced; **transitivity is
  not** (`a↔b` and `b↔c` does not imply `a↔c`; auto-transitivity
  would explode the graph back into flat scanning). Any goal can
  carry related-links, not just roots, because cross-cutting concerns
  don't respect tree level.

The **write protocol** re-validates both coherence rules on every
edit: it re-checks the parent summary whenever a child is created or
edited, and re-validates related-links on both sides. When an edit
needs to touch a partner goal (to add, remove, or rephrase a
back-pointing link), that partner edit happens in the **same write
turn** and appears in the playback as one bundle, so the user
confirms or overrides the whole thing together rather than through
cascading multi-turn interviews.

**Symmetry exception:** a packaged goal (shared across projects)
cannot symmetrically link to a project-local goal, because it can't
carry knowledge of an internal goal that exists in only one project.
Symmetry is enforced only between goals at the same scope level; a
project-local goal may link to a packaged one as an asymmetric
(one-way) reference.

The section schema each goal is written in — WHAT/WHY/SCOPE, no
DECISIONS section — and the content-quality tactics are governed by
`goal-craft`, the content twin of these structural rules.

## WHY
Defaulting to new, flat files for every request creates "cognitive
debt" — a flat soup of spaghetti intentions that's hard to read,
maintain, and apply. A structured, coherent tree of intent
accumulates value by making the system's goals legible at different
levels of abstraction. This is a collaborative definition of value,
not a rigid mechanical constraint — a guideline for creating value by
defining what value means, not a forcing rule.

The parent-summary and related-link rules extend that logic. Goals
are read on every tinker turn and every fresh goal-session start but
written rarely, so paying coherence-maintenance cost at write time
keeps the common read path cheap and correct. Parent summaries let
cross-goal alignment start at parents and drill down only when
warranted. Related-links capture the cross-cutting interactions (e.g.
`shared-language` affecting many user-facing surfaces outside its
branch) that the containment hierarchy alone can't express.

## SCOPE
- In scope: the five tree operations (four integration plus Retire)
  and the level-of-detail coherence heuristic; the parent-summary
  coherence rule; the
  symmetric reasoned related-links primitive; write-time re-validation
  of both rules on every edit, with partner edits bundled into the
  same write turn; the packaged-vs-project-local symmetry exception.
- Out of scope: automated background refactoring of goal files (tinker
  applies these rules interactively during conversation); one-shot
  mass backfilling of parent summaries or related-links across
  existing goals (each is a deliberate hand-picked step); TUI
  rendering of related-links.

"""
parent_id = "tinker"
children = []

[[related]]
id = "goal-craft"
reason = "Content-quality counterpart to this goal's structural rules, and owner of the WHAT/WHY/SCOPE section schema. Structure ensures tree integrity (parent-summary coherence, symmetric related-links, merge/nest operations); content ensures each file is a clean prompt (anchored claims, positive framing, orthogonality, goals-as-prompts, synthesis over enumeration). Both apply on every edit."
