id = "shared-language"
description = """
## WHAT
Tinker uses shared vocabulary in every user-facing surface it produces —
the orchestrator's conversation, structured summaries goal sessions emit
to the user, and any human-readable documentation tinker writes into the
tree (READMEs, in-tree docs, human-targeted code comments). All of these
default to conceptual descriptions — business logic, architectural
concepts, external systems, active goals — rather than file paths,
function names, or internal state variables. Documentation may go more
technical in deeper sections, but every technical term is anchored to a
known concept on first use. The rule assumes the user does not read
source code.

The rule does not apply to artifacts explicitly authored for LLM
consumption — for example, `AGENTS.md` produced by `project-indexer`.
Those keep full technical fidelity because their audience is another
agent, not the user.

## WHY
If tinker assumes the user knows the internal codebase layout, it sounds
condescending ("obviously this is in app.rs"). If it over-explains
things the user explicitly created, it sounds obtuse. Applying the rule
only to the orchestrator's chat would leave documentation as a side
channel where code-identifier soup slips through. By covering every
user-facing surface, tinker stays legible to a user who does not read
source. LLM-targeted artifacts are deliberately excluded because LLMs
benefit from full technical fidelity.

This goal is the operational mechanism for one of the two exposure
surfaces defined by its parent, `user-system-interaction`. The parent
says the user may be exposed to internals only when filtered through
shared language; this goal defines what that filtering looks like —
the vocabulary file, the anchoring rule, the per-surface application.

## SCOPE
- In scope: orchestrator chat; user-facing batch messages the
  orchestrator composes from goal session summaries; READMEs, guides,
  and other human-readable documentation goal sessions write into the
  project tree; code comments written for a human audience; tracking
  user knowledge in a persistent `.tinker/state/vocabulary.txt` file;
  ensuring `.tinker/state/` is created on startup; allowing deeper-
  technical sections inside a document provided each technical term is
  anchored to a known concept on first use.
- Out of scope: artifacts explicitly authored for LLM consumption
  (e.g. `AGENTS.md`); implementation comments aimed at future LLM
  agents; goal file contents themselves (those are LLM-consumed by
  goal sessions); background processes or automated hooks to manage
  the vocabulary file (the orchestrator manages it manually); per-
  session internal summaries before the orchestrator composes them
  into a user-facing batch message.

## DECISIONS (vetted)
- Decision: The shared-language rule applies to every user-facing
  surface tinker produces — orchestrator chat, user-facing batch
  messages, and human-readable documentation written by goal sessions.
  Source: user said "when tinker writes documentation, it should follow
  the shared language approach - use shared language, or at least
  connect technical concepts to shared language."
- Decision: Artifacts explicitly authored for LLM consumption (e.g.
  `AGENTS.md` from `project-indexer`) are exempt from the rule. They
  retain full technical fidelity because their audience is another
  agent, not the user. Source: confirmed in playback as the AGENTS.md
  carve-out.
- Decision: This goal is a downstream application of
  `user-system-interaction` — specifically, the filtering mechanism
  for the second exposure surface defined there (internals filtered
  through what the user is known to know). Its parent is
  `user-system-interaction`, not the orchestrator, because it applies
  to both the orchestrator (chat) and goal sessions (documentation),
  and because the broader principle that justifies it is articulated
  in the parent goal. Source: user confirmed "ii feels right"
  selecting the structural option that creates a new root above this
  goal and `user-persona`.
- Decision: Tinker defaults to conceptual/architectural explanations
  rather than code identifiers. Source: user said "the user never looks
  at the code - it makes no sense using function names, file names, etc..."
- Decision: A persistent state file (`.tinker/state/vocabulary.txt`)
  tracks known files and concepts. Source: agreed in playback.
- Decision: The orchestrator fully owns this file, silently updating it
  manually via `Read`/`Write` tools when the user demonstrates knowledge
  of a new technical term. It never asks permission to update it and
  never mentions the file to the user. Source: user said "orchestrator
  fully owns ./tinker/state/vocabulary.txt. it never asks permission to
  update it, it never mentions it."
- Decision: A technical term goes into the file if the user explicitly
  mentions it, or if it is formally written into a goal file. Source:
  user said "if i ask you to use sqlite -> doesn't go in there. but
  once you write the goal: goes in there immediately".
- Decision: Goal sessions writing documentation read the vocabulary file
  but do not write to it. If a goal session needs a term not in the
  vocabulary, it anchors that term to a known concept on first use,
  same rule as orchestrator chat. Source: confirmed in playback.
- Decision: If tinker *must* use a technical term that isn't in the
  vocabulary file, it must have a strong reason, and it must explicitly
  anchor it to a known concept. Source: user said "when using a
  technical code term in conversation there must be a reference to the
  architectural/feature/whatever known concept alongside it."
- Decision: Documentation may go more technical in deeper sections,
  provided every technical term is anchored to a known concept on first
  use. Source: user said "documentation that tinker writes should use
  the same shared language standard as the orchestrator by default.
  it's ok to go more technical eventually, but always connect to shared
  language."
- Decision: The same vocabulary file is the source of truth across all
  in-scope surfaces. There is no separate "doc vocabulary." Source:
  orchestrator default in playback; no second file warranted.

"""
