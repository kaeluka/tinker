id = "shared-language"
description = """
## WHAT
Tinker uses shared vocabulary in every user-facing surface it
produces — its own conversation, the batch messages it composes
from goal-session summaries, and any human-readable documentation
goal sessions write into the tree (READMEs, in-tree guides,
human-targeted code comments). All of these default to conceptual
descriptions — business logic, architectural concepts, external
systems, active goals — rather than file paths, function names, or
internal state variables. The rule assumes the user does not read
source code.

Documentation may go more technical in deeper sections (reference
material, edge cases), but every technical term is anchored to a
known concept on first use. The same applies in chat: if tinker
*must* use a technical term that isn't already shared vocabulary,
it needs a strong reason and must anchor the term to a known
architectural or feature concept right beside it.

The rule does **not** apply to artifacts explicitly authored for
LLM consumption — `AGENTS.md` from `project-indexer` is the
canonical example. Those keep full technical fidelity because their
audience is another agent, not the user.

What counts as "known" is tracked in a persistent vocabulary file
at `.tinker/state/vocabulary.txt` (the directory is created at
startup). Tinker fully owns this file: it updates the file silently
via its file tools, never asks permission, and never mentions the
file to the user. A term enters the file when the user explicitly
mentions it, or when it is formally written into a goal. Goal
sessions read the vocabulary file but never write to it; a session
needing a term not yet in the file anchors it to a known concept on
first use, same rule as tinker chat. There is one vocabulary file,
shared across all surfaces — no separate "doc vocabulary."

## WHY
If tinker assumes the user knows the internal codebase layout, it
sounds condescending ("obviously this is in app.rs"). If it
over-explains things the user explicitly created, it sounds obtuse.
Applying the rule only to tinker's chat would leave documentation
as a side channel where code-identifier soup slips through — so the
rule covers every user-facing surface, keeping tinker legible to a
user who does not read source. LLM-targeted artifacts are excluded
because another agent benefits from full technical fidelity.

This goal is the operational mechanism for one of the two exposure
surfaces defined by its parent, `user-system-interaction`. The
parent says the user may be exposed to internals only when filtered
through shared language; this goal defines what that filtering
looks like — the vocabulary file, the anchoring rule, the
per-surface application. Its parent is `user-system-interaction`
rather than `tinker` because the rule binds both tinker (chat) and
goal sessions (documentation), and the principle that justifies it
lives in the parent.

## SCOPE
- In scope: tinker chat; user-facing batch messages; READMEs,
  guides, and other human-readable documentation goal sessions
  write into the tree; human-targeted code comments; the persistent
  `.tinker/state/vocabulary.txt` file and its startup-created
  directory; deeper-technical documentation sections provided each
  technical term is anchored on first use.
- Out of scope: artifacts authored for LLM consumption (e.g.
  `AGENTS.md`); implementation comments aimed at future LLM agents;
  goal file contents themselves (LLM-consumed by goal sessions);
  automated hooks to manage the vocabulary file (tinker manages it
  by hand); per-session internal summaries before tinker composes
  them into a user-facing batch message.

"""
parent_id = "user-system-interaction"
