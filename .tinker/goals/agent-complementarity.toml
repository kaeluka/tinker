id = "agent-complementarity"
summary = "governs: profile-complementarity design principle for tinker's agents; quality routing (tasks go to the agent whose profile best handles them); intentional overlap documentation; audit mandate when profiles change | triggers: adding or reshaping an agent; deciding which agent handles a workload; reviewing consultation patterns; overlap audit"
description = """
WHAT
Tinker's agents are not interchangeable. Each has a profile suited to
a specific kind of work, and tasks go to the agent whose profile gives
the highest likelihood of a high-quality response. Where profiles
overlap, the overlap is intentional and the authoritative agent is
named.

The current profile assignments:

- **Tend** (intent arm, ecosystem-wide): optimised for intent
  synthesis, dialectical interviewing, and goal management. The
  intent-layer advisor for every agent — any agent that needs to
  understand the *should* consults tend.
- **Rummage** (technical arm, ecosystem-wide): optimised for skeptical
  technical analysis — pre-dispatch spec validation, grounded code
  investigation, hypothesis loops, falsification, LSP traversal.
  The technical advisor for every agent. Validates specs before
  dispatch and sequences goal agents to minimise conflicts.
- **Goal sessions** (spec↔code, forward): optimised for code
  generation from a written spec. Handle workloads that require
  turning a precise, authoritative goal into working code.
- **Jog** (intent↔spec, backward): optimised for Socratic deepening
  and no-cue questioning. Handles workloads that require surfacing
  tacit intent drift without leading the user.

At shared boundaries, profile complementarity is what makes peer
consultation (`peer-consult`) effective. Routing to an agent with a
weaker profile for the workload produces worse output than staying put.

Intentional overlap exists at the intent/technical boundary: tend and
rummage are both ecosystem-wide advisors, each the counterpart of the
other. Tend owns the *should*; rummage owns the *is*. When they
consult each other, the boundary is clean — neither substitutes for
the other's domain.

**Audit mandate.** When an agent's profile changes, a new agent is
added, or a new recurring consultation pattern emerges, the profile
assignments must be reviewed: does the routing still send each workload
to the best-suited profile? Where has overlap appeared, and is it
intentional? The mechanism is cross-goal alignment: when tend edits any
agent goal, it pulls this goal as part of the alignment step and
verifies the assignments still hold before writing.

WHY
A system where each agent attempts every workload produces average
quality everywhere. Specialised profiles let each agent operate in its
strength zone, and the closed cycle ensures no workload is
unattended. The consultation channel is only as valuable as the quality
gap it crosses.

SCOPE
In scope: the complementarity principle as a design constraint on
agent profiles and consultation patterns; the assignment of workloads
to profiles; documenting intentional overlap and naming the
authoritative agent where profiles share territory; the audit mandate.
Out of scope: each agent's internal behaviour (lives in the agent's
own goal); the cycle structure and producer/skeptic axis (live in
`the-cycles`); the consultation mechanism itself (lives in
`peer-consult`).
"""
