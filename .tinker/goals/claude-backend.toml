id = "claude-backend"
description = """
## WHAT
A `--claude` CLI flag that makes tinker shell out to `claude -p`
instead of `opencode`. It is a boolean startup flag with no
config-file persistence — the user chooses the backend when
launching.

Under `--claude`, the model tiers map to Claude aliases: Opus for
tinker, Sonnet for goal sessions.
The tinker persona is passed via `--system-prompt` rather than the
opencode agent-file installation. Session resumption uses
`--resume <session-id>` (the Claude equivalent of opencode's `-s`).
Tool calls render in the TUI as compact one-liners, matching the
opencode style.

Because the Claude path bypasses the opencode agent file — where
`tinker-agent` and `rummage` define their identity-level tool
denials (`task`, `todowrite`) in YAML frontmatter — those denials
must be re-imposed mechanically on this path, through whatever the
`claude` CLI offers for tool restriction (`--disallowedTools` or
equivalent). If no such mechanism exists, that gap is surfaced
rather than shipping a silently weaker boundary: the denials are
mechanical-by-design per `tinker-agent`, and a prompt-only boundary
on one backend would break that parity.

## WHY
Users may prefer Claude models over the default OpenRouter-backed
models. A flag-based toggle lets them choose at startup without
configuration overhead.

## SCOPE
- In scope: the boolean `--claude` flag; a Claude runner
  implementing the existing runner trait; streaming-JSON parsing of
  Claude's output (which requires `--output-format stream-json
  --verbose`); the opus/sonnet tier mapping; `--resume`
  session resumption; compact one-liner tool-call rendering;
  `--system-prompt` persona passing; mechanical `task`/`todowrite`
  denial parity on the Claude path.
- Out of scope: persisting the backend choice in config; backends
  beyond opencode and claude; auto-detecting which CLI is
  available.

"""
