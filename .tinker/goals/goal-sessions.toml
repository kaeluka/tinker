id = "goal-sessions"
description = """
## WHAT
When a goal is created or edited, the system launches a dedicated
LLM session whose job is to act on that goal — reading code,
writing code, running tests. Only one goal session runs at a time.
When a session is dispatched, it is given an explicit "reason"
string that focuses its attention (e.g. "make sure to implement X").
Before each one starts, investigation code from the previous
orchestrator turn (see `cleanup-hook`) is removed. After each one
finishes, the session reports a structured summary of what it did
and what it decided beyond what the goal explicitly stated. When
a batch of sessions has all finished, the orchestrator composes a
single message for the user covering the whole batch and a "try
it now" invitation.

## WHY
Goals would be useless without something that acts on them.
Splitting the actor from the orchestrator lets the actor use a
cheaper model focused on execution while the orchestrator stays
on a smarter model for judgment. One-at-a-time keeps the user's
mental model simple: they always know which goal is the current
one and what it's doing. Passing an explicit reason gives the agent
a targeted mission instead of making it guess what detail changed
in a huge goal file.

## SCOPE
- In scope: dispatching exactly one goal session at a time;
  giving a freshly-started session the full text of every
  sibling goal so coding standards and other standing concerns
  are in its context; resuming an existing in-memory session
  during a run; producing per-goal and per-batch summaries;
  blocking when cleanup of investigation code fails; passing
  an explicit trigger reason to the agent; forcing goal
  sessions to explicitly list `test_spec_` functions in
  their summary; preserving every pending invocation as a
  separate queue entry, even when several point at the same
  goal-id.
- Out of scope: parallel goal sessions, partial-session resume
  after a crash, mid-session cancellation, mutating state in
  Git or any other version control system, persisting the
  pending-session queue across tinker restarts.

## DECISIONS (vetted)
- Decision: One goal session at a time. Source: simpler mental
  model for the user; parallel sessions explicitly out of
  scope.
- Decision: Every goal session dispatch must be accompanied by a
  reason string. For created/edited goals AND for reactive runs
  after a goal-session batch, the orchestrator provides the
  reason via `/run` lines in its chat output. For manual runs
  (user typing `/run` at the input prompt, or pressing Enter in
  the TUI), the reason is collected from the user. This reason
  must be passed explicitly into the agent's prompt/context.
  Source: user requested "whenever a goal agent is triggered,
  it needs to be passed a reason"; updated when the user folded
  reactive scheduling into the orchestrator and retired the
  scheduler component.
- Decision: On a fresh start, the goal session receives the
  full text of every sibling goal too — so coding standards
  and other standing concerns are part of its context without
  the user or orchestrator copying snippets. Source: built
  this way to avoid spec drift across sessions.
- Decision: After each goal session finishes, the orchestrator
  produces a structured summary covering what was done, design
  decisions made beyond the goal, and how to try the result.
  After a batch drains, those summaries are folded into a
  single user-facing message. Source: tighter feedback loop
  than dumping raw session output into the interface.
- Decision: Goal sessions may read version control state (e.g.
  `git status`, `git diff`) to orient themselves, but are
  strictly prohibited from mutating it (no commit, push, checkout).
  Source: user requested to "clarify the role of the goal agents
  to not do git operations" and "not to mutate".
- Decision: The structured summary format MUST require the goal
  session to explicitly list the `test_spec_` functions it created
  or modified. This systemically forces the LLM to account for
  the "Tests as guardrails" standard. Source: user directed
  "yes, do that" to the idea of enforcing testing via the summary.
- Decision: Goal sessions only persist in memory for the duration
  of the Tinker process. On restart, any previously active session
  is forgotten. This ensures the goal files are the ultimate single
  source of truth. Source: user agreed to drop disk persistence
  because "total amnesia is maybe a good thing - tinker is driven
  by specifications in goals".
- Decision: The same goal can appear in the pending-session queue
  multiple times. When the orchestrator emits several `/run`
  lines for one goal across turns, or when a user-typed `/run`
  lands behind a pending orchestrator `/run`, each invocation is
  preserved as a separate queue entry with its own reason. The
  queue does not deduplicate by goal-id; sessions run in FIFO
  order regardless of repetition. Source: user picked option (A)
  for multi-queueing during the queue-visibility interview.
- Decision: The pending-session queue is in-memory only, like
  the sessions themselves. It dies on tinker restart. Source:
  extends the existing no-persistence stance to the queue
  itself; confirmed in the queue-visibility playback.
- Decision: Goal sessions must not write to `.tinker/goals/`,
  `.tinker/notes/`, or `.tinker/state/`. These directories are
  owned by the orchestrator; goal sessions read them at startup
  (through sibling-goal injection) but must never modify them.
  Writing to goals would let a session silently mutate the spec
  it is executing under; writing to notes or state would bypass
  the orchestrator's exclusive ownership of those surfaces.
  Source: two consecutive batches saw goal sessions modify
  `.tinker/goals/*.toml` files when dispatched with narrow scope
  — a constraint violation that stretched beyond the trigger reason.

"""
parent_id = ""
children = ["cleanup-hook"]
related = [
  { id = "coding-standards", reason = "Goal sessions write code, so they're subject to this standard. In particular, the decision that the structured summary must list `test_spec_*` functions exists specifically to enforce coding-standards' 'Tests as guardrails' requirement." },
  { id = "orchestrator-triggers", reason = "Goal sessions are dispatched by `/run` lines defined in `orchestrator-triggers`. The per-entry reason string, the multi-queueing semantics, and the manual-vs-orchestrator dispatch distinction all originate in the trigger syntax." }
