id = "goal-sessions"
description = """
## WHAT
When a goal is created or edited — or when tinker triggers it
reactively after a batch — the system launches a dedicated LLM
session to act on that goal. The session reads code, writes code,
runs tests. It treats the goal as a **high-level optimization
target, not a literal exhaustive spec**: the goal describes the
problem and the constraints on the solution, related goals add to
that picture, and beyond that the session is completely
unconstrained in the implementation domain and optimizes toward the
best solution.

Only **one session runs at a time**. Each dispatch is a **fresh
session** — no resumption across triggers. State that needs to
survive between runs lives in code, git, and the spec; the trigger
reason carries any transient context the spec doesn't. (Within a
single dispatch, the structured-summary request continues the same
conversation as the main work — that intra-dispatch continuity is
necessary for the summary to refer to what just happened, and is
distinct from cross-trigger resumption.)

Every dispatch carries an explicit **reason string** pointing at
what's new — typically what changed in the goal text since the last
run. Tinker supplies it via `/run` lines (for edited goals and
reactive runs); the user supplies it for manual runs (`/run` at the
prompt, or Enter in the goal list). The reason is passed explicitly
into the session's context.

On a fresh start the session also receives the **full text of every
sibling goal**, so coding standards and other standing concerns are
in context without anyone copying snippets.

Before each session starts, investigation code from the previous
tinker turn is removed (see `cleanup-hook`); if cleanup cannot
complete, the session is blocked rather than run on half-cleaned
code.

The **pending queue** is FIFO and does not deduplicate: the same
goal can appear multiple times, each entry with its own reason, and
they run in order. The queue is in-memory only and dies on tinker
restart.

After each session finishes it reports a **structured summary** —
what it did, what it decided beyond what the goal stated, and how to
try the result. The summary MUST explicitly list every `test_spec_`
function the session created or modified. When a batch drains,
tinker folds the per-session summaries into a single user-facing
message with a "try it now" invitation.

## WHY
Goals would be useless without something that acts on them.
Splitting the actor from tinker lets the actor run on a cheaper
model focused on execution while tinker stays on a smarter model
for judgment. One-at-a-time keeps the user's mental model simple —
they always know which goal is current and what it's doing.

The fresh-session design is a forcing function, not just a cost
saving. A session that cannot remember "what we agreed last turn"
can only act on what's in the spec right now, so an incomplete spec
produces visible misbehavior that drives iteration toward a
complete spec. Spec gaps become unhideable. If mid-task continuity
ever proves a real problem, the answer is richer trigger reasons,
not session memory.

Requiring the summary to list `test_spec_` functions systemically
forces the session to account for `coding-standards`' "tests as
guardrails" requirement — the one surface a human reviewer actually
reads to confirm spec compliance.

Pushback from a session is exceptional, not forbidden. A session
may raise a concern through its summary, but the system is designed
so the situation almost never arises. The mechanism is goal
sparseness (per `goal-craft`): a goal that records only what's
actually relevant to the user, with no laundered implementation
detail, gives the session a tractable optimization target it rarely
needs to question.

## SCOPE
- In scope: dispatching exactly one session at a time; fresh
  sessions with no in-process resumption; injecting the full text
  of every sibling goal; per-goal and per-batch summaries that list
  `test_spec_` functions; blocking when cleanup fails; passing an
  explicit trigger reason; the non-deduplicating FIFO queue
  (multiple entries per goal-id, each with its own reason); reading
  version-control state to orient.
- Out of scope:
  - Parallel sessions, partial-session resume after a crash,
    mid-session cancellation.
  - **Mutating version control** — sessions may read `git status` /
    `git diff` to orient, but never commit, push, or checkout.
  - **Writing to `.tinker/goals/`, `.tinker/notes/`, or
    `.tinker/state/`** — these are tinker-owned. A session reads
    goals at startup (via sibling injection) but writing there would
    let it silently mutate the spec it executes under, or bypass
    tinker's ownership of notes and state. (Sourced from two batches
    where narrow-scope sessions edited goal files anyway.)
  - **Reading `.tinker/notes/notes.md`** — tinker's private
    chain-of-thought; reading it would leak tinker deliberation into
    session context that should be guided only by goals, trigger
    reasons, and source.
  - Persisting the pending queue across tinker restarts.

"""
parent_id = ""
children = ["cleanup-hook"]
