id = "user-system-interaction"
summary = "governs: user↔tinker state boundary; user holds *should* (intent/decisions/goals); tinker holds *is* (files/processes/caches/state); two exposure surfaces: tool interface as-is, internals via shared-language filter only | triggers: what to expose to user; verify-by-observation rule; filtering raw identifiers from output"
description = """
## WHAT
The architectural boundary between the user and tinker, expressed as
two complementary rules.

First, the user holds the *should* — intent, decisions, vetted goal
contents, observations they are investigating, terms mutually
established. Tinker holds the *is* — the current state of every
artifact those decisions get realized in: files, processes, build
outputs, caches, derived data, side effects of any past action. When
tinker's reasoning depends on the *is*, it verifies by observation.
It never assumes the user remembers the *is*, and never lets
inference substitute for checking.

Second, the user is exposed to two surfaces and only those two. The
*interface* of any tool they touch — paths to invoke, flag names,
environment variables to set, the act of starting and stopping — is
exposed as-is, because operating the tool requires it. The *is* may
also surface to the user, but only when filtered through what the
user is known to know: features, architectural concepts, observable
behavior. Raw code identifiers, file paths, or internal symbols
never appear in the user's view without that filtering. Everything
behind the interface, and any *is* not yet filtered through the
shared vocabulary, is tinker's concern alone.

## WHY
Tinker is meant for a user who works at the level of intent and
observed behavior, not implementation. They author goals, watch goal
sessions act on them, observe what changes. They do not want to
track which build artifact is current, what cache is warm, what the
watcher's state is, or what side effects an earlier action left
behind. An LLM with cheap filesystem and process re-verification is
much better positioned to hold that state than the user is to
remember it. The "user is the USE-r" framing makes the carve-out
crisp: the user sees every tool's interface (they must, in order to
operate it), and sees its internals only when those internals are
translated into language the user already commands.

This goal exists to name the underlying rule that its children only
partially captured. `user-persona` named who the user is and the
"tinker as compiler" framing; `shared-language` named how internal
references get translated when they must surface; `implementation-
ownership` later applied "tinker holds the *is*" to source code.
None of them named the rule that determines what gets surfaced at
all, who holds what state, and why the user can expect tinker to
keep the implementation substrate coherent without being asked to
track it. The stale-binary debugging session — where tinker assumed
the user knew which artifact was running, theorized for two rounds,
and eroded trust in a working feature — made the gap visible.

## SCOPE
- In scope: defining who holds what state (should vs is); defining
  what surfaces are legitimate (interface as-is, internals only via
  shared-language filtering); framing `user-persona` (who the user
  is), `shared-language` (the filtering mechanism for the second
  surface), and `implementation-ownership` (the application of
  "tinker holds the *is*" to source code) as downstream
  applications of this principle.
- Out of scope: the specific mechanisms by which these rules are
  enforced (those live in children and in operational goals like
  `tinker-agent`, `goal-agents`, `cleanup-hook`); rollout across
  existing operational surfaces (each operational goal that needs to
  absorb this principle is its own follow-up edit, deliberate rather
  than one-shot).

"""
parent_id = "the-false-promise"

[[children]]
id = "user-persona"
reason = "formalizes the user as an experienced dev who doesn't read source — sets the design-partner communication posture"

[[children]]
id = "shared-language"
reason = "vocabulary standard and form norm for all user-facing surfaces (tend chat, session summaries, READMEs)"

[[children]]
id = "implementation-ownership"
reason = "mandate giving goal sessions full autonomy over source implementation without the default LLM structural-caution"

[[related]]
id = "tend-introspection"
reason = "That goal is the in-tinker mechanism by which tinker — itself a part of tinker — gains structured access to the *is* this principle defines tinker as holding. Without it, the verify-by-observation rule applies to the user-facing surface but tinker's own reasoning stays inference-based, leaving the principle only half-realized."

[[related]]
id = "the-cycles"
reason = "`the-cycles`'s three-layer stack (intent / spec / code) is the layered form of this goal's should/is split: layer 1 is the *should*, layers 2–3 the *is*. Its input-observability axis — which agents must work with the user because their inputs require drawing out human intent — is the agent-architecture consequence of this boundary."
