id = "the-cycles"
summary = "governs: intent↔spec↔code cycle (forward: generation; backward: verification); producer/skeptic axis (tend+goal-agents vs rummage+jog); adjacency ownership (intent↔spec: tend+jog; spec↔code: goal-agents+rummage); input-observability axis; goal-complementarity as design principle | triggers: understanding where goals fit in cycle; commissioning across adjacencies; framing new goals; auditing domain complementarity"
description = """
## WHAT
The map of tinker's agents onto the intent↔spec↔code cycle. The
substrate is a three-layer stack: layer 1 is the user's **tacit
intent**, layer 2 the **written goal/spec**, layer 3 the **running
code**. The cycle runs in both directions.

**Forward (generation):** intent→spec→code. Tend builds the spec from
the user's intent; goal agents (governed by `goal-agents`) build code
from the spec. The produced artifact at each step must be explainable
in terms of the step before it: code is justified by its spec, the
spec is justified by the user's intent.

**Backward (verification):** code→spec→intent. Rummage audits whether
the code satisfies the spec; jog audits whether the spec still
reflects the user's intent. The cycle is closed: every artifact
produced in the forward direction is a candidate for scrutiny in the
backward direction.

Two axes cross-cut all agents:

- **Producer/skeptic.** Producers (tend, goal agents) move forward
  and treat the goal as *authoritative*. Skeptics (rummage, jog) move
  backward and treat the goal as *signal-with-noise* — the gap under
  investigation may be in the goal itself. Commissioning bridges the
  axis: a skeptic that finds a produced artifact wanting commissions
  its paired producer to fix it (jog→tend, rummage→a goal agent).

- **Input observability.** Tend and jog work with inputs that cannot
  be read or executed — tacit intent can only be drawn out through
  dialogue, so these agents must work with the user to do their job.
  Goal agents and rummage work with directly observable inputs — the
  written spec and running code respectively — and don't require user
  input to operate. The dividing line is whether the agent's input
  layer requires drawing out human intent.

The design principle governing how goal domains are assigned and kept
complementary lives in `goal-complementarity`. The session registry
making every goal uniformly addressable lives in `goal-agents`.

## WHY
This model was the framing every agent was designed against, yet it
lived in no goal — it was folklore. Naming it turns the two
orthogonal axes (producer/skeptic, input-observability) into explicit
prose, makes commissioning legible, and gives each agent a clear
position in the cycle.

The bidirectional cycle framing makes the skeptic agents first-class:
they are not error-correction bolted onto a pipeline but the return
path of the same motion. Code that cannot be explained in terms of its
spec, or a spec that cannot be explained in terms of the user's
intent, is a failure of the cycle — and the backward pass is what
catches it.

The name "the-cycles" pairs with `the-false-promise`: the false
promise is the diagnosis; the cycles are the structural answer — a
closed loop where every artifact produced can be verified, explained,
and traced back to the intent that justified it.

## SCOPE
- In scope: the three-layer intent↔spec↔code cycle and both
  directions; the producer/skeptic and input-observability axes as
  cross-cutting prose; adjacency ownership (which agent pair owns
  each adjacency); the rationale for the flat agent tree.
- Out of scope: each agent's internal behaviour (lives in its own
  goal); the should/is principle itself, of which this stack is the
  layered form (that is `user-system-interaction`); reshaping the
  principle goals (`the-false-promise`, `creative-process`, and the
  rest) under this node — they are principles, not agents; profile
  complementarity as a design constraint (lives in
  `goal-complementarity`).
"""
