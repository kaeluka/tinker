id = "goal-agents"
summary = "governs: uniform session registry — every goal is a structurally identical process-scoped addressable agent; @goal-id universal dispatch; two tend-only exceptions (eager start + startup-silence message + TUI suppression; parse-correction loop); framework preamble (incl. dispatcher-report rule and agent-collaboration requirement); dispatcher-provided init sections (spec diff + code inventory when rummage dispatches); tier field in goal TOML; structured summary requirement; .tinker/ write prohibition | triggers: session registry; @-dispatch routing; agent init; tier field; tend exception boundaries; session output requirements"
description = """
## WHAT
Tinker's agent architecture follows one rule: **every goal is a
structurally identical, process-scoped, addressable agent.** The
session registry maps each goal-id to a `SessionEntry` holding a
message channel, the captured LLM session ID, and the associated
goal. The `@goal-id` syntax is the single universal dispatch
mechanism — any agent activates any other by emitting an `@`-block;
the runtime routes it to the named entry.

Tend has exactly **two structural exceptions**, and no others are
justified:
1. **Starts eagerly, with startup-silence.** Tend starts on process
   init so it is ready before the user types anything. Immediately
   after init, tend receives a startup-silence message: a single
   prompt telling it this is a regular startup and to produce no
   output — just await the user's first instruction. The TUI does not
   render tend's response to this message in the conversation pane.
   All other sessions start lazily on first `@goal-id` message and
   receive no startup message.
2. **Handles goal-file parse corrections** — when a goal write
   produces a malformed file, tend is re-queued with correction
   instructions (up to two attempts). No other agent triggers this
   loop because no other agent writes goal files.

Everything else is identical across all agents: the same event types,
the same routing, the same lifecycle, the same `@`-dispatch protocol.

**Framework preamble.** Before its goal description, every session
receives a standard runtime-injected preamble:

---
You are the agent for goal `<id>`. Your goal description follows.

**Goal tree navigation.** The compact index below lists every goal
with summaries and parent/child relationships. To read a goal's full
text: `Read .tinker/goals/<id>.toml`. The goal IS the agent's role
and operating instructions.

**Messaging other agents.** To reach another agent:

```
@goal-id
Your message here.
```

- Everything you write **before** an `@`-block is your own thinking.
  It renders in your session log but is not delivered to anyone.
- Only the `@`-block is delivered to the named agent.
- Actor model: no blocking, no call stack, no formal return value.
  Replies arrive in your normal conversation stream.
- **Before sending `@goal-id`, read `.tinker/goals/<goal-id>.toml`.**
  The goal is the agent's role. You cannot write a useful message
  without knowing what that agent does and what it needs.

**Two shared resources available to all agents.**
- `@tend` — for intent and *should*: what the user wants, what a
  goal means, whether a behavior is intentional.
- `@rummage` — for code reality and *is*: what the code actually
  does, how a flow works, whether an implementation matches a spec.

**Reporting completions.** When you complete significant work, report
to your dispatcher — the agent whose `@`-message initiated your
current task (this can be the user). In your report: what you did,
what you decided beyond the goal, how to try the result, every
`test_spec_` function you created or modified, and how you
collaborated with other agents in fulfilling the task.

---

The agent's role in the intent↔spec↔code cycle is part of its
`description`, not injected by the runtime.

**Dispatcher-provided init sections.** When rummage dispatches a goal
agent, it augments the init message with two additional sections
beyond the standard preamble and goal text:

- **Spec diff** — what was removed from the goal text and what was
  added, computed from the old spec and new spec that tend provides
  at handoff.
- **Code inventory** — what currently exists in the goal's scope,
  read by rummage from files named in the goal description and
  related links.

Agents receiving a rummage dispatch use both artifacts to determine
what existing code implements the removed spec (and must be deleted)
and what new code to write for the added spec. This is the mechanism
that makes large refactors reliable: agents are given both sides of
the diff, not just the desired end state.

**Structured summary.** When a session completes significant work, it
reports to its dispatcher (see preamble) with a structured summary
covering: accomplishments, decisions made beyond the goal, how to
try the result, every `test_spec_` function created or modified
(enforces the `coding-standards` tests-as-guardrails requirement),
and agent collaboration during the task.

**Tier.** Every goal TOML may carry an optional `tier` field:
`"high"`, `"mid"`, or absent (defaults to `"mid"`). Resolved at
session start via `model-config`. Tend, rummage, and jog declare
`tier = "high"`.

**Unified event enum:**
```
enum SessionEvent {
    LlmSessionId { goal_id: String, session_id: String },
    Chunk        { goal_id: String, text: String },
    Done         { goal_id: String },
    CleanupBlocked { goal_id: String, dirty_files: Vec<PathBuf>, error: Option<String> },
}
```
A single `mpsc::Receiver<SessionEvent>` in the run loop handles
events from all sessions, dispatching on `goal_id`.

## WHY
A uniform registry eliminates the distinction between "named agents"
(tend, rummage, jog) and "goal sessions." Every goal is a peer:
reachable by the same syntax, governed by the same lifecycle,
producing output in the same event stream.

The two tend exceptions are real: the user must have something to
talk to on startup, and goal-file integrity requires a corrective loop
after writes. The startup-silence message is part of the first
exception — tend starts eagerly precisely because the user needs it
ready, but without a silence instruction it would produce unsolicited
output before the user has typed anything. No other exceptions are
justified and none should be added without explicit user confirmation
that they belong in the architecture.

The dispatcher-provided init sections (spec diff + code inventory)
close the information gap that makes large refactors fail: without
them, agents receive only the desired end state and must infer what to
remove — inference that fails systematically for deletions and the
deletion half of every change. With them, agents hold both sides of
the diff and can act with confidence.

The structured summary and `test_spec_` listing exist because a
session is an unreliable narrator about its own work — the summary
is the one surface a reviewer actually reads to confirm spec
compliance. Requiring the session to account for every
`test_spec_` function systemically enforces the tests-as-guardrails
standard without relying on the session's general good behavior.

## SCOPE
- In scope: the session registry and `SessionEntry` type; `@goal-id`
  as the universal dispatch; the exactly-two tend exceptions (eager
  start + startup-silence message + TUI suppression of startup output;
  parse-correction loop) and their boundaries; framework preamble
  injected before every session's goal description; the
  dispatcher-provided init sections (spec diff + code inventory) and
  their role in diff-aware dispatch; `tier` field in goal TOML; the
  unified `SessionEvent` enum and single run-loop receiver dispatching
  on `goal_id`; the structured summary requirement and `test_spec_`
  listing mandate; pre-session cleanup via `cleanup-hook`.
- Out of scope: cross-process session persistence; concurrent sessions
  for the same goal-id; per-agent tool distinctions beyond what
  applies uniformly to all agents.
- Sessions must not write to `.tinker/goals/`, `.tinker/notes/`, or
  `.tinker/state/` — these directories are tend-owned. Reading goal
  files is allowed and expected; writing would let a session silently
  mutate the spec it executes under or bypass tend's ownership of
  notes and state.
"""
