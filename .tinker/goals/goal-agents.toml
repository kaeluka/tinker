id = "goal-agents"
summary = "governs: unified session registry where every goal is a process-scoped addressable agent; @goal-id universal dispatch replacing /run; lazy session start (tend eager); framework preamble (identity + navigation + message-passing); tier field in goal TOML; tend/rummage/jog prompts moved to TOML WHAT/WHY/SCOPE; batch-summary machinery removed | triggers: session registry; @-dispatch routing; agent init; tier field; Rust prompt source deletion; batch flow removal; TUI queue rewrite"
description = """
## WHAT
A unified session registry where every goal is a process-scoped,
addressable agent. The registry is a `HashMap<GoalId, SessionEntry>`,
where each entry holds a message channel, the captured LLM session ID
(for resumption), and the associated goal. Sessions start lazily on
first `@goal-id` message and stay alive for the process lifetime. The
one exception is tend: it starts eagerly on process init (it must be
ready before the user types anything).

`@goal-id message` is the universal dispatch — the mechanism through
which any agent in the system activates any other. `/run` is retired
entirely: `parse_run_commands` is deleted and all goals updated to
drop `/run` references. The `/jog-edit` channel is unaffected.

When an agent's reply contains `@`-blocks, the runtime extracts them
via `parse_at_commands` (updated to accept any registry-known session
ID rather than the hardcoded `["tend", "rummage", "jog"]` constant)
and routes each block to the named recipient's channel via
`dispatch_peer_consultations` (updated to look up the registry rather
than matching three named channels). Non-`@`-block output from any
agent renders in its session's log pane as before.

Every goal TOML may carry an optional `tier` field: `"high"`, `"mid"`,
or absent (defaults to `"mid"`). Resolved at session start via
`model-config` for the current backend. Tend, rummage, and jog declare
`tier = "high"`.

Every agent session receives a standard runtime-injected **framework
preamble** before its goal description. The preamble is short and
behavioral — not an orientation document. The exact text to inject:

---
You are the agent for goal `<id>`. Your goal description follows.

**Goal tree navigation.** The compact index below lists every goal
with summaries and parent/child relationships. To read a goal's full
text: `Read .tinker/goals/<id>.toml`. The goal IS the agent's role
and operating instructions.

**Messaging other agents.** To reach another agent:

```
@goal-id
Your message here.
```

- Everything you write **before** an `@`-block is your own thinking.
  It renders in your session log but is not delivered to anyone.
- Only the `@`-block is delivered to the named agent.
- Actor model: no blocking, no call stack, no formal return value.
  Replies arrive in your normal conversation stream.
- **Before sending `@goal-id`, read `.tinker/goals/<goal-id>.toml`.**
  The goal is the agent's role. You cannot write a useful message
  without knowing what that agent does and what it needs.

**Two shared resources available to all agents.**
- `@tend` — for intent and *should*: what the user wants, what a
  goal means, whether a behavior is intentional. Tend holds the
  goal tree and conversation history.
- `@rummage` — for code reality and *is*: what the code actually
  does, how a flow works, whether an implementation matches a spec.

---

The compact goal index follows the preamble separator, then the
agent's own goal description. The agent's role in the
intent↔spec↔code cycle — if it has one — is part of its
`description`, not injected by the runtime.

The agent's own goal description follows the preamble. For tend,
rummage, and jog, that description is their full operational protocol,
restructured as WHAT/WHY/SCOPE prose. For any other goal, it is the
existing WHAT/WHY/SCOPE prose. The framework preamble + description
together constitute the complete agent prompt.

There is a single init-message construction path: `session_init_message
(goal, reason, compact_index)` used for all sessions. Rust source
functions `tend_agent_content_impl`, `rummage_system_prompt`, and
`jog_system_prompt` are deleted; their content migrates to the `description`
fields of `tend.toml`, `rummage.toml`, and `jog.toml` respectively,
rewritten as WHAT/WHY/SCOPE.

The batch-summary machinery is removed: `Phase::RunningGoal`,
`SummarizingBatch`, `batch_had_goals`, `batch_summaries`, and
`build_batch_summary_request` are all deleted. Goal agents `@tend`
when they complete significant work; tend synthesises and responds to
the user through normal conversation. The `Phase` enum and
`goal_queue: VecDeque` are removed from `App`. The TUI queue markers
(`▶`, `[N]`) and pending-entries display that were driven by
`goal_queue` are replaced or removed in the same session — `tui.rs`
is a required change surface.

The unified event enum:
```
enum SessionEvent {
    LlmSessionId { goal_id: String, session_id: String },
    Chunk        { goal_id: String, text: String },
    Done         { goal_id: String },
    CleanupBlocked { goal_id: String, dirty_files: Vec<PathBuf>, error: Option<String> },
}
```
A single `mpsc::Receiver<SessionEvent>` in the run loop replaces the
three separate named-agent handler channels. The three handler
functions (`handle_orch_event`, `handle_rummage_event`,
`handle_jog_event`) collapse into one generic handler dispatching on
`goal_id`.

Cleanup hook scope: fires before the first message to a new session
(session not yet in registry). Does not fire on subsequent messages to
an already-live session.

## WHY
The two-tier architecture (persistent named agents vs ephemeral goal
sessions) prevented any goal session from joining an ongoing exchange
with tend, rummage, or jog. Agents could not think together —
everything was routed through tend as a hub. The session registry
eliminates the distinction: every goal is a peer, reachable by the
same protocol. The collaboration that became possible among the three
named agents is now available to any goal in the tree.

Moving tend, rummage, and jog's operational content into TOML
descriptions makes agent behavior modifiable without a recompile, and
keeps a single schema across all goals. Retiring the batch-summary
machinery removes a flow that was only necessary because goal sessions
had no way to reach tend directly; `@tend` from a goal agent is both
simpler and more expressive.

## SCOPE
- In scope: session registry and `SessionEntry` type; unified
  `SessionEvent` enum; single `session_init_message` construction
  path; framework preamble (identity, navigation, message-passing
  semantics — cycle role stays in the agent's description, not
  injected by the runtime); lazy start for all sessions except tend
  (eager on process init); `parse_at_commands` accepting any
  registry-known session ID; `dispatch_peer_consultations` routing to
  registry; `tier` field in goal TOML; rewriting tend, rummage, and
  jog `description` fields as WHAT/WHY/SCOPE and deleting the
  corresponding Rust source functions; retiring `/run` and
  `parse_run_commands`; removing `Phase`, `goal_queue`,
  `batch_had_goals`, `batch_summaries`, `SummarizingBatch`,
  `build_batch_summary_request`; updating `tui.rs` to remove
  queue-marker and pending-entries rendering that depended on
  `goal_queue`; updating `goal-storage` schema for `tier` field;
  updating `triggers`, `peer-consult`, `goal-sessions` goals to
  reflect the new model.
- Out of scope: cross-process session persistence; concurrent sessions
  for the same goal-id; multi-session conversation view in the TUI;
  retiring `/jog-edit`.
"""
