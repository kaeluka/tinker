id = "goal-agents"
summary = "governs: uniform session registry — every goal is a structurally identical process-scoped addressable agent; @goal-id universal dispatch; two tend-only exceptions (eager start + startup-silence message + TUI suppression; parse-correction loop); execution model delegated to child parallel-goal-agents; progress guarantee delegated to child agent-liveness; neighbor consultation mandate delegated to child agent-collaboration; framework preamble (incl. dispatcher-report rule, progress guarantee, neighbor consultation mandate); dispatcher-provided spec diff (tend dispatches after goal write); tier field in goal TOML; structured summary requirement; .tinker/ write prohibition | triggers: session registry; @-dispatch routing; agent init; tier field; tend exception boundaries; session output requirements"
description = """
## WHAT
Tinker's agent architecture follows one rule: **every goal is a
structurally identical, process-scoped, addressable agent.** The
session registry maps each goal-id to the sending half of that
agent's message channel; the agent's goal and its resumable LLM
session id live in the persistent per-goal loop the runtime spawns,
not in the registry. The `@goal-id` syntax is the single universal dispatch
mechanism — any agent activates any other by emitting an `@`-block;
the runtime routes it to the named entry.

Tend has exactly **two structural exceptions**, and no others are
justified — everything else is identical across all agents:
1. **Starts eagerly, with startup-silence.** Tend starts on process
   init so it is ready before the user types anything. Immediately
   after init, tend receives a startup-silence message: a single
   prompt telling it this is a regular startup and to produce no
   output — just await the user's first instruction. The TUI does not
   render tend's response to this message in the conversation pane.
   All other sessions start lazily on first `@goal-id` message and
   receive no startup message.
2. **Handles goal-file parse corrections** — when a goal write
   produces a malformed file, tend is re-queued with correction
   instructions (up to two attempts). No other agent triggers this
   loop because no other agent writes goal files.

**Framework preamble.** Before its goal description, every session
receives a standard runtime-injected preamble; its authoritative text
lives in the runner, not here. It covers goal-tree navigation (the
compact index plus `@tend` for full text — the goal IS the agent's
role and operating instructions); the `@goal-id` message-passing
protocol and actor-model semantics (`peer-consult`); the
`@tend`/`@rummage` split along intent/*should* vs code/*is*
(`the-cycles`' producer/skeptic axis); the progress guarantee
(`agent-liveness`); and the neighbor-consultation mandate
(`agent-collaboration`). The one rule this goal owns directly: on
completing significant work an agent reports to its dispatcher — what
it did, decisions beyond the goal, how to try the result, and every
`test_spec_` function it touched.

**Dispatcher-provided init section.** When tend dispatches a goal
agent after a goal write, it augments the init message with one
additional section beyond the standard preamble and goal text:

- **Spec diff** — what was removed from the goal text and what was
  added, computed from the old spec and new spec tend holds.

Goal agents needing a code inventory of what currently exists in
their scope should consult `@rummage`.

**Tier.** Every goal TOML may carry an optional `tier` field:
`"high"`, `"mid"`, or absent (defaults to `"mid"`). Resolved at
session start via `model-config`. Tend, rummage, and jog declare
`tier = "high"`.

**Unified event stream.** Every session emits three kinds of event:
a streamed output chunk, a done signal, and a cleanup-blocked signal
carrying the dirty files.

Sessions never read or write `.tinker/goals/`, `.tinker/notes/`, or
`.tinker/state/` (tend-owned); goal content reaches a session via
`@tend` and the init message (see `no-peek`).

## WHY
A uniform registry eliminates the distinction between "named agents"
(tend, rummage, jog) and "goal sessions." Every goal is a peer:
reachable by the same syntax, governed by the same lifecycle,
producing output in the same event stream.

The two tend exceptions are real: the user must have something to
talk to on startup, and goal-file integrity requires a corrective loop
after writes. The startup-silence message is part of the first
exception — tend starts eagerly precisely because the user needs it
ready, but without a silence instruction it would produce unsolicited
output before the user has typed anything. No other exceptions are
justified and none should be added without explicit user confirmation
that they belong in the architecture.

The spec diff closes the information gap that makes large refactors
fail: without it, agents receive only the desired end state and must
infer what to remove — inference that fails systematically for
deletions and the deletion half of every change. Code inventory is
available on demand via `@rummage`.

The structured summary and `test_spec_` listing exist because a
session is an unreliable narrator about its own work — the summary
is the one surface a reviewer actually reads to confirm spec
compliance. Requiring the session to account for every
`test_spec_` function systemically enforces the tests-as-guardrails
standard without relying on the session's general good behavior.

"""
