id = "spawn-session"
kind = "feature"
summary = "This goal owns the spawn-session tool available to every agent session — a schema-enforced tool-call harness surface for spawning fresh sub-sessions of the caller's own goal, taking a subgoal parameter and an optional label, firing the sub-session immediately during the turn rather than at turn completion."
description = """
## WHAT

Every agent session has a `spawn-session` tool that spawns a fresh
sub-session of the caller's own goal. The tool takes two parameters:
`subgoal` (the task description, self-contained as if the sub-session
starts cold) and an optional `label` (a short correlation tag the
caller uses to route replies). The tool fires the sub-session
immediately during the caller's turn. A sub-session spawned this way
may itself act as a coordinator, dispatching further sub-sessions and
remaining reachable for replies until the batch ends.

## WHY

Sub-session dispatch needs to be reliable and immediate. Schema
enforcement makes dispatch reliable; the tool list makes the
capability discoverable; the sub-session fires immediately and
concurrently with the caller's remaining reasoning.
"""
