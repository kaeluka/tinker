id = "spawn-session"
kind = "feature"
summary = "This goal owns the spawn-session tool available to every agent session — a schema-enforced tool-call harness surface for spawning fresh sub-sessions of the caller's own goal, taking a subgoal parameter and an optional label, firing the sub-session immediately during the turn rather than at turn completion."
description = """
## WHAT

Every agent session has a `spawn-session` tool that spawns a fresh sub-session of the caller's own goal. The tool takes two parameters: `subgoal` (the task description, self-contained as if the sub-session starts cold) and an optional `label` (a short correlation tag the caller uses to route replies). The tool fires the sub-session immediately during the caller's turn. A sub-session spawned this way may itself act as a coordinator, dispatching further sub-sessions and remaining reachable for replies until the batch ends.

From the sub-session's view, tool-spawned and envelope-spawned sessions are indistinguishable — both paths deposit into the same dispatch substrate.

The @-envelope path continues working alongside the tool during the transition — spawn-session is the eventual successor, and @-envelopes for spawning will be retired once the tool is established (same trajectory as send-message / @-message).

## WHY

The @-envelope syntax for spawning sub-sessions shares limitations with the outbound messaging envelope that send-message succeeded: it embeds the dispatching goal id, a label delimiter, and the sub-task body in free-form output, producing fragility (malformed envelopes that fail to spawn or get silently dropped), low discoverability (an implicit convention that lives in prompt documentation rather than appearing in the tool list), and turn-end latency (the sub-session waits for the caller's full response before dispatch fires).

The tool removes the text-convention failure mode by enforcing parameters in schema, surfaces the capability through the same tool list every agent already uses, and makes sub-session dispatch concurrent with the caller's remaining reasoning rather than deferred to turn end.
"""
