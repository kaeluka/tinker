id = "goal-storage"
description = """
## WHAT
Goals are persistent files associated with a project. They live in a
project-local subdirectory and survive across tinker runs. Goals
from ancestor directories of the current working directory also
apply, merged with the project's own — so a shared standard defined
once in the user's home directory takes effect in every project.
When the same goal id appears in both an ancestor and the current
project, the project-local version wins (more specific intent beats
inherited). A malformed goal file is reported as an error but never
blocks its siblings from loading. Symlinks into goal directories are
followed transparently, so a shared goal directory can live in a
separate repo and be linked into the user's home.

Goal files store intent only — not session state. Session IDs and
history are never persisted to disk, so the goal file is the single
source of truth across restarts.

## WHY
Goals are the user's standing intent. They have to survive restarts,
be human-editable, and diff cleanly in version control. Sharing
across projects matters because some intent (coding standards,
security rules) is global; the user shouldn't have to copy-paste it
into every project. Storing intent without session state keeps the
file authoritative — there's no parallel session-history artifact
that could drift from or override what the goal says.

## SCOPE
- In scope: a human-editable text format for goals; recovery from a
  single malformed file (the rest still load); ancestor-directory
  merge with the project's copy winning on duplicates; following
  symlinks transparently.
- Out of scope: nested goal subdirectories; runtime format
  migrations; persisting session state or history; a per-file
  `change_log` (pending work is triggered via `/run`, per
  `triggers`, not recorded on the spec).

"""
parent_id = ""
