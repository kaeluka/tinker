id = "the-false-promise"
kind = "feature"
summary = "This goal owns tinker's foundational diagnosis — the rationale that coding assistants launder AI implementation guesses into a quasi-specification and force a vet-or-trust choice, which justifies extracting intent into a durable Goals layer separate from code."
description = """
## WHAT
The foundational diagnosis that justifies tinker's architecture.
Current coding assistants promise developers they no longer have to
write code, but their architecture forces developers to keep reading
it.

## WHY
Because traditional assistants only output source code, they launder
their own ad-hoc implementation guesses into a "quasi-specification."
Source code conflates human intent with AI scaffolding, and once a
session restarts the two are indistinguishable. This forces a fatal
choice on the user: either vet every line and lose the speedup, or
trust blindly and accumulate paralyzing cognitive debt. Tinker
rejects the choice by extracting intent into a separate, durable
layer — Goals — kept distinct from implementation.

"""
