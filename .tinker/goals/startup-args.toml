id = "startup-args"
summary = "governs: CLI arg validation (unknown flag/positional → error+help+exit 1); --help/-h handler; help text content (flag list + repo link https://github.com/kaeluka/tinker) | triggers: adding new flags; changing help text; arg parsing behavior changes"
description = """
## WHAT
When tinker receives an unrecognized argument — flag or positional — it prints an error naming the bad argument, prints help text listing all valid flags with a link to the repo (https://github.com/kaeluka/tinker), and exits with code 1. The same help text is shown for `--help`/`-h`. Error message and help text both go to stdout.

## WHY
Silently ignoring unknown arguments makes typos invisible: tinker starts anyway and may misbehave. The help is a single flat flag listing.
"""
