reason = "backends defines the recognised backend-selection flag set (--claude, --native, --tend-full-goal-context, --default-model); this goal validates incoming args against that set and renders them in the help text. backends also owns the post-validation startup guards (--claude/--native mutual exclusion, --native's OPENROUTER_API_KEY check), which run after this goal's unknown-arg check. When a new flag is added to backends it must also be registered here. (--help/-h is this goal's own handler, not backends'.)"

