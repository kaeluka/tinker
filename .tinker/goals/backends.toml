id = "backends"
summary = "governs: pluggable LLM backend abstraction (runner trait at composition root); opencode default (agent files for tend/rummage/jog, uniform task/todowrite denials) vs claude --claude (--system-prompt, --disallowedTools parity); per-backend model-tier defaults overridable via model-config | triggers: backend implementation; persona/tool-denial parity between backends; adding third backend; startup flag changes"
description = """
## WHAT
Tinker runs against a **pluggable backend** — the LLM CLI it shells
out to — chosen at startup. Two backends exist today: **opencode**
(the default) and **claude** (selected with the `--claude` flag).
Both are co-equal implementations of the same runner trait, wired to
real instances only at the composition root; business logic depends
on the trait, not on any vendor's CLI. Adding a third backend (e.g.
codex) means implementing that trait, not threading vendor specifics
through the system.

Each backend maps tinker's roles to its own models and delivers agent
personas its own way:

- **opencode** (default): runs its own configured model defaults. At
  startup installs agent files for tend, rummage, and jog
  (`~/.config/opencode/agents/tend.md` etc.), always overwriting so
  the installed copies stay in sync. Each agent file replaces
  opencode's default software-engineer persona with the agent's own
  operational protocol. All three files carry the same YAML
  frontmatter tool denials — `task` and `todowrite` — the autonomous
  multi-step tools that bypass user visibility. Tend's agent file uses
  a static/dynamic split: the persona lives in the file; the current
  goal list is passed in fresh over stdin each run so tend's context
  stays current without rebuilding the file.

- **claude** (`--claude`): maps roles to Opus (tend) and Sonnet
  (goal sessions); passes each persona via `--system-prompt` instead
  of an agent file; resumes sessions with `--resume <session-id>`;
  parses streaming JSON (`--output-format stream-json --verbose`);
  and, because it bypasses the agent files, re-imposes the same
  `task`/`todowrite` denials mechanically via `--disallowedTools` —
  keeping the permission boundary identical across both backends.
  The backend choice is a boolean startup flag and is not persisted.

Which model fills each tier, per backend, is overridable at runtime
through `model-config`, a `.tinker/config.toml` file; the per-backend
mappings above are the built-in defaults each tier falls back to when
the config leaves a slot unset.

Tool calls from either backend render in the TUI as compact
one-liners.

Startup argument handling (unknown-arg detection, help text, exit
behaviour) is governed by `startup-args`. Recognised flags passed to
this goal's backends are `--claude` (select the claude backend) and
`--tend-full-goal-context` (restore full goal text in tend's context
instead of the compact index).

## WHY
Tinker's business logic should depend on a backend abstraction, not
on one vendor's CLI: the user picks the models they prefer at
startup, and a new backend slots in by implementing the runner rather
than by editing the system around it. Capturing the abstraction as
intent also keeps both backends legible — before this goal only the
claude path was written down, so the opencode backend kept going
invisible as the silent default. Naming opencode and claude as
co-equal implementations fixes that and makes the cost of a third
backend explicit and small.

## SCOPE
- In scope: the runner-trait abstraction with real implementations
  wired only at the composition root; the two current backends
  (opencode default, claude via `--claude`); per-backend model-tier
  mapping (the built-in defaults, overridable per tier via
  `model-config`) and persona delivery; agent file installation for
  tend, rummage, and jog on the opencode path; `--resume` session
  resumption and streaming-JSON parsing on the claude path; compact
  one-liner tool-call rendering; mechanical `task`/`todowrite` denial
  parity on the claude path, which bypasses the opencode agent files.
- Out of scope: persisting the backend *choice* (`--claude` is a
  startup flag — per-tier model overrides, by contrast, are persisted
  in `model-config`); auto-detecting which CLI is installed; backends
  beyond opencode and claude until one is actually added; unknown-arg
  detection and help text (see `startup-args`).

"""
