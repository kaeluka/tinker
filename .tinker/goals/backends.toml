id = "backends"
kind = "feature"
summary = "This goal owns the pluggable LLM backend abstraction — the runner trait wired at the composition root and its two implementations (opencode default with path-scoped agent files, and claude via --system-prompt and streaming JSON), including per-backend model-tier defaults, the claude high-tier pin to claude-opus-4-8, persona delivery, and re-injection of CLI error output into the session."
description = """
## WHAT
Tinker runs against a **pluggable backend** — the LLM CLI it shells
out to — chosen at startup. Two backends exist today: **opencode**
(the default) and **claude** (selected with the `--claude` flag).
Both are co-equal implementations of the same runner trait, wired to
real instances only at the composition root; business logic depends
on the trait, not on any vendor's CLI.

Each backend maps tinker's roles to its own models and delivers agent
personas its own way:

- **opencode** (default): runs its own configured model defaults. At
  startup writes two agent files to `~/.config/opencode/agents/`,
  always overwriting so the installed copies stay in sync. `tend.md`
  carries the full tend description and an allowlist restricting tend
  to `.tinker/goals/**` only (reads and writes). `tinker.md` carries
  generic frontmatter and a denylist blocking reads and writes to all
  `.tinker/` subdirectories. Both files enforce path-scoped access rules at the backend
  level, not just via prompt instructions.

- **claude** (`--claude`): maps roles to `claude-opus-4-8` (tend, high
  tier) and `sonnet` (goal sessions, mid tier); the high tier uses a
  pinned full model ID rather than the `opus` short alias because the
  alias can silently resolve to an unvalidated model version. Passes
  each persona via `--system-prompt` instead of an agent file; resumes
  sessions with `--resume <session-id>`; parses streaming JSON
  (`--output-format stream-json --verbose`).

  *Persona delivery split.* Session-invariant content arrives via
  `--system-prompt`: for tend, its role description and write-scope
  constraint; for goal agents, the
  framework preamble (message passing protocol, progress guarantee,
  rules, neighbor consultation mandate). Per-session content arrives in
  the init message: for goal agents, the goal spec, trigger reason, and
  neighbor table. This mirrors the opencode split between the stable
  agent file (`tinker.md`) and the per-dispatch trigger.

  **Path-scope enforcement is softer here than in the opencode path**:
  the claude CLI has no equivalent to opencode's `permission:` block,
  so there are no harness-level path restrictions. `--disallowedTools`
  is not a substitute — it denies named tools, but Bash bypasses it
  entirely, so the invariant does not hold. Both tend and goal agents
  rely on system-prompt-level compliance rather than runner
  enforcement.

Which model fills each tier, per backend, is overridable at runtime
through `model-config`, a `.tinker/config.toml` file; the per-backend
mappings above are the built-in defaults each tier falls back to when
the config leaves a slot unset.

**Error feedback.** When a CLI process exits with an error, the runner
captures the error output and re-injects it as a message into the
active session before the session closes, so the agent can read it
and decide how to respond. Under opencode a permission-denied error
signals the agent crossed the agent-file path boundary; the expected
response is to route through a peer `@`-message rather than retry the
blocked action.

Startup argument handling is governed by `startup-args`. Recognised
flags for this goal's backends are `--claude` (select the claude backend) and
`--tend-full-goal-context` (restore full goal text in tend's context
instead of the compact index).

## WHY
Tinker's business logic should depend on a backend abstraction, not
on one vendor's CLI: the user picks the models they prefer at
startup, and a new backend slots in by implementing the runner rather
than by editing the system around it.

Re-injecting the error closes the enforcement loop — an out-of-scope
path denial becomes a signal the agent can hear and course-correct
from, rather than a silent process death.

"""
parent_id = ""

