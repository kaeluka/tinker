id = "backends"
kind = "feature"
summary = "This goal owns the pluggable LLM backend abstraction — three implementations (opencode via ephemeral agents/-directory file, claude via its system-prompt mechanism, and native via direct OpenRouter API calls with an in-process tool loop) that deliver identical system prompt content (the goal's spec plus the framework preamble defined by goal-agents) with the trigger reason as the first turn message, per-backend model-tier defaults, the claude high-tier pin to claude-opus-4-8, re-injection of CLI error output into the session, and the native backend's in-process ToolPolicy enforcement."
description = """
## WHAT
Tinker runs against a pluggable backend chosen at startup. Three
backends exist today: **opencode** (the default), **claude** (selected
with `--claude`) — both CLIs tinker shells out to — and **native**
(selected with `--native`), which talks to the OpenRouter API directly
with no CLI in between. All are implementations of the same backend
abstraction, wired at the application entry point; business logic
depends on the abstraction, not on any vendor's CLI or API.

The native backend is the designated successor: once `--native` works
well, both CLI backends are slated for removal and native becomes the
sole backend.

**System prompt.** All three backends deliver an identical system prompt to
every goal agent session — the framework preamble (owned by
`goal-agents`) plus the goal's full description and neighbor table.
The trigger reason is sent as the first turn message. The assembled
system prompt string is identical across backends for goal agents;
only the delivery mechanism differs (ephemeral agent file for
opencode, --system-prompt flag for claude, first system message of
the in-memory session for native). Tend is intentionally excepted:
it takes a different system prompt path on each backend.

**opencode** writes the system prompt to an ephemeral file in the
project-local `agents/` directory for each session, invokes opencode
with that file as the agent, and deletes the file when the session
ends (via drop). Session IDs returned by opencode are stored for
subsequent turns.

**claude** maps roles to `claude-opus-4-8` (tend, high tier) and
`sonnet` (goal sessions, mid tier) — the high tier uses a pinned full
model ID rather than the short alias, which can silently resolve to an
unvalidated version. It delivers the system prompt via claude's
system-prompt flag, resumes sessions by session ID, and parses
streaming output.

**native** runs the agent loop in-process: it calls OpenRouter's
chat-completions API (key from `OPENROUTER_API_KEY`, never stored in
config) and executes tool calls itself — exactly six tools: bash,
read, write, edit, glob, grep. Because tinker owns the tool executor,
file-access boundaries are enforced in code via a per-role
`ToolPolicy`: tend gets no bash and may write only under
`.tinker/goals/`; goal sessions (including cleanup — a goal session,
not a special case) get the full unrestricted tool set. A policy
denial is returned to the model as a tool error it can adapt to.
Sessions are in-memory only — a restart starts all sessions fresh.
Context overflow fails visibly: the session is dropped and the next
dispatch starts fresh.

The CLI backends rely on prompt-level compliance with the file-access
boundaries their personas state; the native backend replaces that with
mechanical in-process enforcement.

Which model fills each tier is overridable at runtime through
`model-config`; the per-backend mappings above are the built-in
defaults.

**Error feedback.** When a CLI process exits with an error, the backend
captures its output and re-injects it as a message into the active
session, so the agent can read and respond — route to a peer, retry a
transient failure, or report the obstacle rather than dying silently.
The native backend needs no re-injection: tool errors flow back to the
model in-loop as tool results, and API errors surface as ⚠ chunks.

Startup argument handling is governed by `startup-args`. Recognised
flags: `--claude` (select the claude backend), `--native` (select the
native backend; requires `OPENROUTER_API_KEY` and is mutually
exclusive with `--claude` — both misconfigurations fail fast before
the TUI starts), `--default-model` (opencode only), and
`--tend-full-goal-context` (restore full goal text in tend's context
instead of the compact index).

## WHY
Tinker's business logic should depend on a backend abstraction, not on
one vendor's CLI: the user picks models at startup, and a new backend
slots in by implementing the abstraction rather than by editing the
system around it.

Delivering the same system prompt on every backend ensures agents
behave consistently regardless of backend choice — goal instructions
in system-prompt position carry the authority the model treats as
foundational, rather than being reasoned away from as a user message.

Re-injecting errors closes the loop — a CLI failure becomes a signal
the agent can hear and course-correct from, rather than silent process
death.

The native backend exists because controlling what agents can do
through CLI permission systems was a constant hassle: those systems
are built for interactive approval, so tinker had to bypass them
(`--dangerously-skip-permissions`) and re-enforce boundaries through
prompts. Owning the tool loop makes the boundary a code path instead.
It also removes the external CLI dependency and reduces setup to one
environment variable.

"""
parent_id = ""

