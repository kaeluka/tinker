[[related]]
id = "agent-liveness"
reason = "agent-liveness defines the progress guarantee this goal's harness mechanisms enforce: tool-error surfacing makes backend errors — CLI or native tool — visible so agents can reason about them; silence detection prompts agents that produce no output to take a step."

[[related]]
id = "goal-agents"
reason = "goal-agents defines the uniform session registry and unified runner task this goal's backend abstraction must support; per-tier model resolution for every goal agent is wired through the backend at the application entry point. Changes to the registry or the tier field affect what the abstraction must provide. goal-agents also owns the framework preamble text that forms part of the system prompt all backends deliver."

