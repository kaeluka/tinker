id = "tinker-agent"
description = """
## WHAT
Tinker enforces tinker's boundaries by running it under a custom `opencode` agent profile (`tinker`). This profile replaces `opencode`'s default software-engineer persona with a strict tinker persona, and denies access to autonomous multi-step tools (`task`, `todowrite`). Tinker silently installs this agent file into `~/.config/opencode/agents/` on startup if it doesn't already exist.

## WHY
By default, `opencode` acts as an autonomous software engineer. When tinker ran tinker under the default profile, the underlying agent would sometimes ignore tinker's rules (like "don't write production code") and autonomously edit source files to fix bugs. Isolating tinker in a custom agent profile strips out that base identity and mechanically enforces the boundary.

## SCOPE
- In scope: silently creating `~/.config/opencode/agents/tinker.md` on startup if missing; moving the static tinker rules from `src/tinker.rs` into this agent file as a formal system prompt; explicitly denying `task` and `todowrite` in the agent's permission block while allowing basic file operations; passing `--agent tinker` when launching tinker; passing the dynamic goal list via `stdin`; enforcing that tinker never mutates version control state.
- Out of scope: creating custom agents for goal sessions or the scheduler; managing `opencode` config outside of the `agents/` directory.

## DECISIONS (vetted)
- Decision: The agent file is automatically and silently installed on startup if it's missing. Source: user said "automatically installed. frictionless if possible (on start, check whether it's there and silently install if not)".
- Decision: The static rules (persona, procedures) move to the agent file as the system prompt; the dynamic state (current goals) is passed over `stdin`. Source: user confirmed "dynamic state is passed over stdin. seems logical. tinker should not BE the goals".
- Decision: Tinker retains `allow` permission for `write`/`edit`/`bash` globally, relying on the prompt to enforce the `tinker-test-case:` marker requirement. Source: user said "tinker is allowed to write. we rely on a good prompt to minimize 'bad' writes".
- Decision: Only tinker gets a custom agent; goal sessions and the scheduler remain unchanged. Source: user said "not yet" when asked about other roles.
- Decision: Tinker is explicitly forbidden from mutating Git/VCS state in its system prompt rules, though it may read it. Source: user requested the git mutation boundary "make the same be true for tinker".

"""
