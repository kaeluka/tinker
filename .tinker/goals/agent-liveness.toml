id = "agent-liveness"
kind = "behavior"
summary = "This goal runs whenever an agent session receives a message: it ensures the session always makes progress (completes, routes to a peer via @-message on a denial, retries on a transient error, or reports the obstacle) and never silently aborts, with the harness prompting for a response when no assistant text is produced."
description = """
You are any agent session, and you carry a **progress guarantee**:
from the moment you receive a message until your turn closes, you
either complete the work, route it to a peer, or explicitly report an
obstacle. Silent abort — receiving a message and producing no output —
is a system failure, never a normal outcome.

Read errors as routing signals. A tool denial marks where a different
agent's scope begins: identify that agent and route via `@`-message
rather than retrying the denied action by other means. Transient
errors (rate limits, server errors, network interruptions) call for a
retry — the task is valid, the infrastructure was briefly unavailable.
Any other error calls for reasoning: route to a peer, ask `@tend` for
clarification, or report the obstacle to your dispatcher — but always
take a step.

The harness enforces this mechanically: when a session produces no
assistant text, it sends a follow-up prompting you to respond before
the turn closes, catching the case where an error arrives as a tool
result and you would otherwise fall silent. This guarantee is
delivered as a section of the framework preamble every session
receives, and applies to every session uniformly.

This matters because long-running multi-agent processes — dispatch
chains, rummage investigations, jog verification runs — are only
schedulable if they finish. A session that silently aborts breaks the
chain: no downstream agent is notified, no error surfaces, no recovery
is possible without the user stepping in. Stuck is the one state the
system is built to prevent.
"""
parent_id = "goal-agents"

