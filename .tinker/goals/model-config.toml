id = "model-config"
summary = "governs: .tinker/config.toml model overrides; six slots (high/mid/low × claude/opencode); optional slots fall back to built-in defaults; self-documenting starter template written only when file absent (never overwrites) | triggers: model tier override behavior; config file parsing; starter template generation"
description = """
## WHAT
A `.tinker/config.toml` file that overrides which model each tier
uses, independently per backend. There are six slots: the three model
tiers — `high` (the smartest tier, used by `tend`, `rummage`, and
`jog`), `mid` (the tier goal sessions run on), and `low` (the cheapest
tier, used by cleanup) — each settable separately under a `[claude]`
and an `[opencode]` section. The tiers are named by capability level
rather than by consuming role, because the top tier already serves
three agents: a role label would name only one of them, while a
capability label names what the slot is. The file is TOML so it
carries `#` comments: the user parks alternate model names on
commented lines and switches which model is live by toggling which
line is commented.

Every slot is optional. An absent or commented-out slot falls back to
the model compiled in as that tier's built-in default, so an empty or
missing config file changes nothing about how tinker runs. Commenting
a line out is therefore a clean revert to default behavior.

When no config file exists, tinker writes a self-documenting starter
template: both backend sections present, every slot listed but
commented out. Each slot is annotated inline with which agents consume
that tier — `high` notes tend, rummage, and jog; `mid` notes goal
sessions; `low` notes cleanup — so the user knows what each rename
affects without reading source, and with the current built-in default
value shown on the commented line itself. The user uncomments and
edits rather than looking up model names or slot identifiers. The
starter file is written only when none exists; a config file the user
has already edited is never overwritten.

## WHY
The user wants to choose the model for each tier — to experiment and
to control cost — without editing source code or memorizing model
identifiers. Comments are the switching mechanism: keeping several
candidate models in the file and toggling which is active is faster
than rewriting a value each time. Per-tier rather than per-backend
granularity is the point, because mixing tiers — a strong model for
`high`, a cheap one for `mid` — is exactly the kind of experiment the
user runs. Falling back to built-in defaults for any unset slot keeps
the file as sparse as the user wants it: they write only the slots
they currently care about.

Capability-level slot names (`high`/`mid`/`low`) rather than
role-level names keep the config honest: the top tier is shared by
tend, rummage, and jog, so a role name on it would mislead. The
starter-template annotations carry the role information instead, where
it documents what a rename affects without pretending the slot belongs
to a single agent.

## SCOPE
- In scope: the `.tinker/config.toml` file with `[claude]` and
  `[opencode]` sections; the three per-backend capability-tier slots
  (`high`, `mid`, `low`); per-slot fallback to the built-in default
  when a slot is absent or commented out; the self-documenting,
  fully-commented starter template generated only when the file is
  absent, with each slot annotated by which agents consume that tier.
- Out of scope: persisting the backend choice itself (`--claude`
  stays a startup flag, per `backends`); validating model names
  against a known list (an unrecognized name surfaces as whatever the
  backend CLI does with it); per-agent slots that split the `high`
  tier shared by tend, rummage, and jog; overwriting or migrating a
  config file the user has already edited; backwards-compatible
  aliasing of the former role-based slot names (`tinker`,
  `goal_sessions`, `cleanup`) — the rename is a clean break, as no
  configs using the old names exist.
"""
parent_id = "backends"
