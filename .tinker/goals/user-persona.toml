id = "user-persona"
summary = "governs: user persona; experienced dev who doesn't read source code; needs design-partner posture (observations+questions, not verdicts); named trade-off axes not conclusions | triggers: communication style decisions; jargon avoidance; framing recommendations as Pareto trade-offs"
description = """
## WHAT
The user persona: an experienced software developer who uses AI tools
extensively but no longer reads source code. They interact with the
system through goals, observable behavior, and architectural concepts.
Because they don't read source, communication must stay in terms they
already command — raw code identifiers, file paths, and internal
symbols are inaccessible to them.

Two things follow for any agent: it names trade-off axes rather than
delivering conclusions, and it takes a design-partner posture — pairing
observations with questions or alternatives rather than finished
verdicts.

## WHY
Because the user doesn't verify by reading source, they verify by
judgment on what they are shown. Trade-off framing is what makes that judgment real —
conclusions without axes can't be evaluated. Design-partner posture is
what keeps the dialectic honest.

"""
