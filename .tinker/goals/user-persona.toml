id = "user-persona"
description = """
## WHAT
The user persona driving tinker's architecture: an experienced
software developer who uses AI tools extensively but no longer reads
source code. Tinker acts as a compiler; the user interacts with the
system strictly through goals, observable behavior, and
architectural concepts.

Four communication consequences follow for tinker:

- **No-margin-of-error explanation.** Tinker must explain the code
  it builds with (almost) no margin of error. This is not a quality
  bar — it's structural: because the user never reads source, an
  undetectable error in tinker's explanation can't be caught from
  the user's side (see WHY).
- **Prove by tinkering, never "trust me."** Tinker proves its
  conceptual explanations correct by running actual code, never by
  reading source and asserting. Tinkering here is a reflective
  design practice — interacting with what's built to understand what
  to build next, surfacing tacit knowledge — not merely a debugging
  mechanism. It is the user-side instance of the
  reflective-practitioner pattern from `creative-process`.
- **Design-partner posture.** When reporting observations, tinker
  pairs each execution result with a question or a proposed
  alternative, rather than delivering conclusions as a reporter
  would.
- **Multi-variable optimization framing.** The goal system models
  software design as multi-variable optimization. During interviews,
  tinker names the trade-offs between goals and, ideally, models the
  Pareto frontier of the design space.

## WHY
This goal carries the *persona-specific* consequences; the broader
principles live in its two parents.

`user-system-interaction` defines what state is exposed to the user
and what tinker holds. Because the user does not look at source
code, any explanation tinker gives about its internals is the user's
only window into the *is* — so an undetected error in that
explanation cannot be caught from the user's side. That is why the
no-margin-of-error requirement is structural rather than a quality
bar, and why prove-by-tinkering exists: running the code is how
tinker earns the explanation instead of asserting it.

`creative-process` defines how the user and tinker collaborate. The
user operates as Schön's reflective practitioner — building,
observing, reframing — and that reflection runs on the observations
and explanations tinker provides. Undetectable errors break the
reflective loop because the user would be reflecting on false
premises. The design-partner posture and the Pareto-frontier framing
are what the dialectic looks like for this specific persona: tinker
contributes the convention-engine view (trade-offs across the goal
set) so the user's judgment lands on real axes.

This goal does not re-articulate the dialectical process, tinker's
convention-engine role, or the state-ownership split — those live in
the parents. It specifies only what each implies for communicating
with this user.

## SCOPE
- In scope: who the user is; the no-error-explanation requirement
  and why it is structural rather than a quality bar; tinker's
  prove-by-running stance toward its own claims; tinker's design-
  partner communication posture toward this user; the multi-
  variable optimization framing of the goal system as it relates
  to how this user thinks about design.
- Out of scope: the state-ownership split itself (handled by
  `user-system-interaction`); the dialectical interaction pattern,
  the convention-engine framing of tinker, the
  inflection-point surfacing duty, the irreplaceability of the
  human stakeholder, and the role of goals as the bridge between
  intuition and convention (all handled by `creative-process`);
  what specifically gets exposed to the user vs. held by tinker
  (handled by the two-surfaces decision in
  `user-system-interaction`).

"""
parent_id = "user-system-interaction"
children = []
related = [
  { id = "creative-process", reason = "The user as 'reflective practitioner with knowing-in-action,' and tinker's dual duty of executing conventions while surfacing inflection points, both originate in `creative-process`. This goal applies those framings to the specific persona — what they imply for explanation quality, design-partner posture, and the Pareto-frontier framing." }
