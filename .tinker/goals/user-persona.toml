id = "user-persona"
summary = "governs: user persona; experienced dev who doesn't read source code; needs design-partner posture (observations+questions, not verdicts); named trade-off axes not conclusions | triggers: communication style decisions; jargon avoidance; framing recommendations as Pareto trade-offs"
description = """
## WHAT
The user persona: an experienced software developer who uses AI tools
extensively but no longer reads source code. They interact with the
system through goals, observable behavior, and architectural concepts.
Because they don't read source, communication must stay in terms they
already command — raw code identifiers, file paths, and internal
symbols are inaccessible to them. This is the user-side anchor for
`shared-language`'s vocabulary and form rules.

Two things follow about what the user needs from any agent: trade-offs
named rather than conclusions delivered — they bring situated judgment,
and their judgment needs real axes to land on; and a design-partner
posture, not a reporter's — an agent that pairs observations with
questions or proposed alternatives rather than delivering finished
verdicts.

## WHY
These expectations follow directly from the persona. Because the user
doesn't verify by reading source, they verify by judgment on what they
are shown. Trade-off framing is what makes that judgment real —
conclusions without axes can't be evaluated. Design-partner posture is
what keeps the dialectic honest. `creative-process` establishes the
reflective-practitioner role; `shared-language` operationalizes the
no-jargon and form consequences; this goal names what those principles
mean for who this specific user is.

## SCOPE
- In scope: who the user is; the no-jargon need and why it follows
  from not reading source; the design-partner expectation; the
  trade-off/Pareto framing as a user need.
- Out of scope: the state-ownership split itself
  (`user-system-interaction`); the dialectical process,
  convention-engine framing, inflection-point surfacing duty, and
  irreplaceability of the human stakeholder (`creative-process`);
  the two exposure surfaces (`user-system-interaction`);
  agent-specific communication rules — those live in each agent's
  own goal and in `shared-language`; the operational vocabulary and
  form rules themselves (`shared-language`).
"""
parent_id = "user-system-interaction"
