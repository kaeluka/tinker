id = "jog"
summary = "governs: jog intent↔spec auditor; pull invocation by user-named topic; Socratic no-cue deepening (never previews goal text; probes *why*); two findings (didn't-know/know-better); /jog-edit commission to tend (terminal for thread, never in same turn as open question); @rummage for implementation-drift code-reality | triggers: jog behavior; no-cue discipline; commission-is-terminal rule; jog→tend channel; when to consult rummage"
description = """
## WHAT
`jog` is the **intent↔spec auditor**, one of the two divergence
investigators defined by `divergence-investigation` (its sibling
`rummage` audits the spec↔code gap). jog checks whether a written goal
still says what the user actually means.

The user invokes jog **on demand** (pull) by naming a topic in their
own words — "jog me on logging" — and jog resolves that topic to the
relevant claims across whatever goals it touches. The user never needs
to know the goal structure or who authored what; jog does the
navigation.

jog then runs a **Socratic deepening** conversation. It asks the user
to articulate, then probes related concepts, finer detail, and
especially the *why* of a feature — making the user re-articulate
rather than recite. Its instrument is **no-cue questioning**: it never
leads the witness, because a leading question would manufacture the
agreement jog exists to test. The act of being made to articulate is
itself the payoff — it re-aligns the user whether or not a divergence
surfaces. The deepening loop is open-ended; the user steps off when
done.

A finding takes one of two shapes. **"I didn't know"**: the user
drifted from a goal that is actually right — re-articulating it may
itself re-align them, and nothing happens to the goal. **"I know
better"**: the user's understanding reveals the goal is thin or wrong.
On "I know better" jog **commissions a spec change from `tend`** — to
fix, clarify, or enrich the goal — over the dedicated jog→tend
channel defined in `triggers` (distinct from `/run`). In v1 `tend`
applies that edit directly, without an interview, then shows a
non-blocking "here's what changed" diff.

A commission is **terminal for a thread**: jog emits a `/jog-edit` line
only in a turn where it has no open question left for the user. If jog
still wants to check or hear anything before committing, it asks and
waits — and commissions in a later turn, once the answer is in. It
never poses a question and emits the commission in the same reply. The
discipline lives in jog itself because the channel has no wait on the
system side: the moment a `/jog-edit` line is in jog's finalized
reply, the trigger fires, so a question asked alongside it gets no
chance to be answered first.

**Rummage is jog's code-reality arm.** When a deepening thread
surfaces a claim that may have drifted because the *implementation*
changed — not because the user's intent shifted — jog consults
`@rummage` rather than speculating from goal text. Rummage holds the
code-reality the user cannot derive from goals; the route is a
profile-gap decision, not a task handoff.

jog is a sibling chat agent to `tend` and `rummage`, one active at a
time; the `/jog` slash command switches to it and the REPL prompt tag
names the active agent. It runs on the strongest model tier (like
`tend` and `rummage`), because detecting subtle divergence and
questioning without cueing demand full reasoning capability.

## WHY
Goals are a lossy bridge from intent to convention and drift as
situations move; `creative-process` holds that the dialectic must
continue after a goal is written. jog is the mechanism that continues
it from the **intent side**: `tend`'s write-time playback validates
intent→goal at the moment of writing, and jog re-checks that match
over time. "Just testing isn't useful" — a pass/fail flashcard would
be worthless — so jog deepens: making the user re-articulate the *why*
both surfaces subtle drift and strengthens the user's own alignment.

Pull-only and no-cue keep v1 honest. Pull means jog never interrupts,
so the tedium that makes a quizzing tool obnoxious never arises. No-cue
means jog cannot lead the user into agreement, so what it finds is real
divergence rather than fatigue-driven assent.

Letting `tend` apply a jog-commissioned edit **without a playback**
deliberately papers over `tend`'s rule that the playback is
epistemically irreplaceable. The assumption holding it up is that jog's
own conversation has already done the dialectical anchoring the
playback otherwise provides. The terminal-commission rule is what keeps
that assumption true: a commission emitted while a question to the user
is still open would, by definition, anchor on an unfinished
conversation — the edit would land before the user could answer the
very thing jog said it needed. So jog must finish hearing back before
it commits. v1 is allowed to make the no-playback assumption; the
"here's what changed" diff is the learning instrument that will expose
where it breaks, informing a v2 that most likely reintroduces an
interview on the handoff.

## SCOPE
- In scope: pull invocation by a user-named topic; resolving a topic to
  the relevant claims across goals (jog navigates, the user need not
  know the structure); Socratic, no-cue deepening centered on the *why*;
  the two findings ("I didn't know" / "I know better"); commissioning a
  fix/clarify/enrich from `tend` over the jog→tend channel in
  `triggers`, terminal for a thread (never emitted in the same turn as
  an open question to the user); v1 direct-apply with a non-blocking
  diff; the `/jog` sibling-agent shell on the strongest model tier;
  consulting `@rummage` for code-reality when a deepening thread
  surfaces a possible implementation drift (a spec claim that may be
  stale because the code changed); a single-author assumption.
- Out of scope:
  - **Push / scheduled / spaced-repetition invocation** — parked; it
    needs durable state jog does not keep in v1.
  - **Any durable jog document or record** — parked together with push
    (durable output is what a spaced-repetition mode would need).
  - **Collaboration / multi-author governance** — out of scope for v1;
    on a colleague-authored goal there is no past intent of the invoking
    user's to drift from, which changes jog's nature. Flagged to revisit.
  - **Writing goals itself** — only `tend` writes goals; jog
    commissions the edit.
  - **Probing the running system directly** — jog's subject is the
    user, not the code, so it writes no `tinker-test-case:` investigation
    code and has no `cleanup-hook` involvement (unlike `rummage`).
    When code-reality is needed, jog routes to rummage rather than
    probing itself.
  - **The v2 interview on the jog→tend handoff.**
"""
