id = "goal-complementarity"
kind = "feature"
summary = "This goal owns the complementarity principle: every goal claims a distinct domain and together they cover the space without overlap, with the authoritative goal named at any intentional boundary. It is the design rationale; tend runs the orthogonality check against it at write time and goal-structure-standard enforces placement structurally."
description = """
## WHAT
Every goal claims a distinct domain — complementarity. Together, goals
cover the space without overlap — each owns a piece of the problem,
none encroach on another's territory.

The anchor domains:

- **Tend**: intent synthesis, dialectical interviewing, goal
  management. The *should* for every other goal.
- **Rummage**: behavioral execution oracle — establishes what the running
  system actually does by executing it; surfaces behavioral contradictions
  to tend without classifying drift vs. intent-gap or dispatching repairs.
  The *is* for every other goal.
- **Jog**: bidirectional discrepancy finding across adjacent layers,
  via read-only delegation to peer goals.
- **Goal sessions**: code generation from a written spec.

Where domains touch, the overlap is intentional and the authoritative
goal is named.

**Orthogonality check.** Before writing any goal, tend verifies the
domain is distinct from every other goal's, naming the authoritative
goal at any intentional overlap; if the goal is one of the anchor goals
above, tend re-reads the anchor domain list and confirms all boundaries
still hold.

## WHY
A goal set where domains overlap produces ambiguous specs — two goals
make contradictory claims and the agent executing them receives
conflicting instructions. Complementarity is the structural guarantee
that the goal tree stays internally consistent as it grows.
"""
