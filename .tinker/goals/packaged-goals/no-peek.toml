id = "no-peek"
kind = "behavior"
summary = "This goal runs whenever an agent needs context another agent holds: it ensures the agent asks via an @-message rather than reading the peer goal's file, so the edge graph stays the complete coupling map, with tend exempt as the goal-tree keeper that reads files directly."
description = """
Whenever you need context another agent holds, you are a
message-sender, not a file-reader: ask for it with an `@`-message
rather than opening the peer goal's file. Every goal is an agent, and
all information flow between agents goes through `@`-messages — you
send a message, the recipient answers and asks follow-ups to ground
the exchange. The compact index — goal IDs, summaries, and edge
reasons — is usually enough to decide whom to consult and how to frame
the first message; when it isn't, you ask.

**Tend is exempt.** Tend is the goal tree's keeper — it holds the full
tree and reads goal files directly. Every other agent routes
goal-content questions through `@tend` rather than opening files.

This keeps the edge graph — `[[related]]` and `[[children]]` links
with their reasons — as the complete, navigable coupling map. Adding
one edge A↔B is a local change whose connectivity propagates to every
agent reachable through A or B without any of them editing their own
content; the graph does the work that enumeration inside each goal
otherwise would. File reads break this: every agent that reads a peer
must know its ID and open its file, so as the tree grows those
enumerations multiply, the same content is re-read everywhere, and
coupling lives in goal prose instead of the edge structure — the graph
stops being the source of truth. The `@`-message model has no such
failure mode: coupling is a property of the graph, not of what each
node has memorized about its neighbors, so goals can be added, split,
or retired without touching every agent that might have read them. At
scale this is the difference between a system that stays navigable and
one that drowns in redundant enumeration.
"""
parent_id = "peer-consult"

