id = "cleanup-hook"
description = """
## WHAT
While the orchestrator tinkers — writing temporary tests, exposing
private symbols, swapping constants, adding scratch programs —
every change it makes carries a marker comment of the form
`tinker-test-case: <one-line reason>`. Before any goal session
runs, the system finds every such marker and removes or reverts
the change it labels. If markers can't be cleaned after a few
retries, the goal session is blocked and the user is told which
files still need attention.

## WHY
Without a marker convention, investigation code accumulates and
contaminates production. With one, the orchestrator can probe
freely — including in production source, including by exposing
private symbols — and the cleanup step keeps the codebase honest.
The blocking-on-failure behavior is deliberate: a goal session
writing on top of half-cleaned investigation code is worse than
not running at all.

## SCOPE
- In scope: detecting markers across the project tree before
  each goal session; dispatching a cheap cleanup agent;
  retrying a few times before giving up; surfacing
  unrecoverable failures to the user; correctly distinguishing
  real markers from prose mentions of the marker name.
- Out of scope: enforcing the marker at write time (the
  orchestrator self-enforces; this hook only cleans up after);
  recovering across project boundaries.

## DECISIONS (vetted)
- Decision: A marker is recognized only when it appears at the
  start of a comment line. This is what lets the system's own
  source talk ABOUT the marker convention — constants that
  hold the literal string, prompts that describe how it works,
  this very goal description — without those mentions being
  treated as real markers. Source: required so the cleanup
  agent doesn't damage the system itself when run on its own
  source.
- Decision: Three shapes of marker are supported. An "inline
  addition" labels a new region to remove. An "in-place
  modification" labels a change to existing code; the marker
  carries undo information either in its reason text or by
  commenting out the original directly above. A "file-level"
  marker labels a whole file to delete. Source: user said
  "If required, make the thing visible but put in a marker
  comment that says this needs to be reverted" and "Make
  visible or make a visible 'adapter' function."
- Decision: A small fixed number of retries — the cleanup
  agent gets a few chances, then the goal session is blocked.
  Source: user said "retry a few times."
- Decision: When cleanup fails, the goal session does not
  proceed. The user is told which files still contain
  markers. Source: a partial cleanup is more dangerous than
  no cleanup, so blocking is the safe default.
- Decision: No reliance on version control. When a change
  isn't mechanically obvious to revert, the marker carries
  the undo information inline — either as instructions in
  the comment text or by commenting out the original
  alongside. Source: user asked "why does it need git
  diff?"; design simplified accordingly.

"""
parent_id = "goal-sessions"
children = []
related = [
  { id = "coding-standards", reason = "The `tinker-test-case:` marker this hook detects and cleans is defined by section 5 ('Tinkerability') of `coding-standards`. The marker syntax, semantics, and three shapes (inline / in-place / file-level) come from there." }
]
