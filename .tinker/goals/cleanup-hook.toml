id = "cleanup-hook"
summary = "governs: pre-session tinker-test-case: marker cleanup; three marker shapes (inline/in-place/file-level); start-of-comment-line detection rule; placeholder-reason exempt; retry 3x; block goal session on failure | triggers: cleanup behavior; marker recognition rules; rummage investigation code cleanup; placeholder exemption"
description = """
## WHAT
Before any goal session runs, the system scans the project tree for
`tinker-test-case:` markers — left by rummage's active investigation
work — and dispatches a cheap cleanup agent to remove or revert the change each
one labels. It retries a few times; if markers still can't be
cleaned, the goal session is blocked and the user is told which
files still need attention.

Markers come in three shapes. An **inline addition** labels a new
region to remove. An **in-place modification** labels a change to
existing code and carries its undo information with it — either as
instructions in the reason text or by commenting out the original
directly above. A **file-level** marker labels a whole file to
delete. Reverts rely on this inline undo information, never on
version control.

Two recognition rules keep cleanup from damaging the system's own
source:
- A marker counts only when it appears at the **start of a comment
  line**. This lets the system's source talk *about* the convention
  — string constants holding the literal marker, prompts describing
  how it works, this very goal — without those mentions being
  treated as real markers.
- A marker whose reason is an **angle-bracket placeholder** (e.g.
  `tinker-test-case: <one-line reason>`) is a format example —
  documentation of the marker shape — and is exempt. Real
  investigation markers always carry a concrete reason describing
  what the marked code probes.

## WHY
Without a marker convention, investigation code accumulates and
contaminates production. With one, rummage can probe freely and the
cleanup step keeps the codebase honest.

Blocking on cleanup failure is deliberate: a goal session writing on
top of half-cleaned investigation code is worse than not running at
all.

"""
