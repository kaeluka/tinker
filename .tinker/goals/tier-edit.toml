id = "tier-edit"
parent_id = "tui"
kind = "feature"
summary = "This goal owns the options dialog opened by Enter in the goal list: it collects a trigger reason and the goal's current tier, warns when a tier change on a running session will reset it, writes the updated tier to the goal's source file on confirm, and resets the session."
description = """
## WHAT
In the goal list, pressing Enter opens an options dialog. The dialog has two
fields: a trigger reason and the goal's current tier. If the tier is changed
and the goal has a running session, the dialog warns that confirming will
reset that session. On confirm, the updated tier is written to the goal's
source file immediately; if a session was running, it is reset to start
fresh on the new model. Tier is accessible only through the options dialog.

## WHY
Tier change implies session reset — a consequential action that needs to be
deliberate. The options dialog is already the surface for triggering goals
intentionally; consolidating tier there gives the user a single, visible
place to review and adjust goal settings before committing, with the
consequences stated at the moment of decision. The dialog is also the
designated home for future goal and model settings.
"""

[[related]]
id = "goal-storage"
reason = "The write target is the goal's source TOML file; goal-storage owns the on-disk format this interaction must preserve when writing the `tier` field."

[[related]]
id = "goal-agents"
reason = "goal-agents owns the tier field semantics — absent = mid, \"high\" = high — that govern what values tier-edit must write and display."
